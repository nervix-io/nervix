# The tests of the Turmoil suite, by the invocation of `just test-turmoil` that runs them.
#
# `just test-turmoil` saves each invocation's output under target/turmoil-suite and holds it to its
# entry here: a registered test that did not run, or ran ignored, fails the suite, and so does a test
# that ran without being registered, or a test registered as ignored that ran. An invocation that
# also runs tests which are not Turmoil invariants names the marker its invariants carry, and only a
# test whose name contains it must be registered. A renamed test is renamed here in the same change,
# and a new scenario joins its invocation's list.

[[invocation]]
name = "primitives"
tests = [
  "tests::simulated_host::sockets_names_timers_and_cpu_jobs_belong_to_the_simulated_host",
  "tests::turmoil_mode::turmoil_selects_simulated_sockets_and_tokios_timers",
]

[[invocation]]
marker = "simulation_checks"
name = "execution"
tests = [
  "workers::simulation_checks::cancelled_running_job_keeps_its_charge_until_exit",
  "workers::simulation_checks::queued_jobs_take_the_worker_in_admission_order",
  "workers::simulation_checks::saturation_and_dropped_waiters_restore_the_queue_and_charge",
]

[[invocation]]
ignored = ["authentication::simulation_tests::replay_trace_in_fresh_process"]
name = "interconnect-library"
tests = [
  "authentication::simulation_tests::a_server_certificate_for_another_node_is_rejected",
