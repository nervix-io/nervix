# The Cucumber scenarios that observe, at run time, every capability a connector entity declares.
#
# A capability is something a statement can make an entity do once it runs: deliver or publish in
# one declared mode, write one declared option or make one choice of it, read one typed metadata
# field, publish in batches, set one envelope clause or property, or, as `STALLED PEER <key>`,
# report a peer that stops answering within the client deadline key that bounds the wait. Each
# entity declares its capabilities in the vocabulary, beside everything else a statement can say
# about it, and `just validate-connector-capabilities`, which `just validate` runs, holds this file
# to those declarations: every declared capability names at least one scenario that observes it,
# every entry names a capability its entity declares, once, and every scenario an entry names
# exists in its feature file. A scenario is named exactly as its `Scenario:` or `Scenario Outline:`
# line writes it.
#
# A change that declares a new capability registers the scenario that observes it in the same
# change; one that renames or moves a registered scenario updates its entry. Quiesce modes and
# header access are not capabilities here: the host owns how a source is quiesced, the registry
# checks a program's header access against the declaration, and the generated conformance tests
# hold the grammar to both.

