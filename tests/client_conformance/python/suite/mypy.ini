# The type check `just validate-client-suites` runs over the suite and the paced simulation
# driver. The package's own stub, nervix_client.pyi beside crates/client-python/Cargo.toml, types
# every call; pyarrow ships no type information, and polars' is used when it is installed.
[mypy]
strict = True
warn_unreachable = True
explicit_package_bases = True
mypy_path = $MYPY_CONFIG_FILE_DIR/../../../../crates/client-python:$MYPY_CONFIG_FILE_DIR

[mypy-pyarrow.*]
ignore_missing_imports = True

[mypy-polars.*]
ignore_missing_imports = True
