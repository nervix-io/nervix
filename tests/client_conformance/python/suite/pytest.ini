# The pytest configuration of the Python package's suite. The suite directory is pytest's root, so
# a test's node id, such as `cluster/test_execute.py::test_a_command_completes`, is its identity in
# tests/client-suites-inventory.toml.
[pytest]
pythonpath = .
testpaths = boundary cluster
addopts = -p no:cacheprovider --strict-markers --color=no -q
