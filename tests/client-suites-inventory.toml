# Every test of a host's language-level suite, by host, tier and stable identity: a pytest node
# id relative to the suite, a JUnit class and method, a minitest class and method, or a C or C++
# test function.
#
# A tier's run fails when a test registered here did not run or did not pass, when a test was
# skipped, and when a test ran that this inventory does not register. `just validate-client-suites`
# holds this inventory to the suite sources: every identity exists, and every test is registered.

