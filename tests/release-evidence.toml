# The evidence a revision needs before it qualifies for release, which
# `just release-evidence <pull request>` holds a pull request's head revision to.
#
# Each method names the label that makes CI run it, when it is label-gated, and the checks it must
# leave on the revision: the latest run of every check below must have completed successfully. A
# `sharded` entry names the prefix of a matrix check, `prefix (I of N)`, whose shards 1 through N must
# all have passed. A method whose label the pull request lacks never ran, and refuses the revision.
# A renamed CI job is renamed here in the same change, and so is a value added to the matrix of a
# job named here.

[[method]]
checks = [
  "test-selection",
  "checks",
  "tests",
  "scenarios-build",
  "coverage",
  "coverage-full",
  "diagnostic-evidence",
]
description = "Formatting, lints, validation and ratchets; unit, documentation, scenario and runner tests; ordinary coverage integrity, complete selected-producer union and the deterministic complexity ratchet; advisory coverage percentages and CRAP scores"
name = "ordinary"
sharded = ["scenarios"]

[[method]]
checks = ["build-debian-amd64", "build-debian-arm64"]
description = "The release image of the revision for each architecture"
name = "release-images"

[[method]]
checks = ["operator-deployment-amd64", "operator-deployment-arm64"]
description = "The shipped Kubernetes operator initializes three ready Nervix pods and public three-voter membership on each release image"
name = "operator-deployment"

[[method]]
checks = ["bolero / bolero-random"]
description = "Every registered property's ordinary randomized and corpus run with its configured case count, after compiled discovery of the inventory"
label = "bolero-random"
name = "bolero-random"

[[method]]
checks = ["bolero / bolero-fuzz-combined", "bolero / bolero-gate"]
description = "Every registered property's sanitizer-backed fuzz campaign in every shard, the proof that the shards ran every target once, and the gate over the requested Bolero modes"
label = "fuzz"
name = "bolero-fuzz"
sharded = ["bolero / bolero-fuzz"]

[[method]]
checks = ["loom"]
description = "Every registered memory-ordering model's exploration, and each model failing under its weakening"
label = "loom"
name = "loom"
sharded = ["loom-qualification"]

[[method]]
checks = ["shuttle"]
description = "Every registered production-owner interleaving check, its nondeterminism run and schedule replay"
label = "shuttle"
name = "shuttle"

[[method]]
checks = ["turmoil"]
description = "Every registered network simulation and its replay check"
label = "turmoil"
name = "turmoil"

[[method]]
checks = [
  "deloxide (deloxide)",
  "deloxide (deloxide-order)",
  "deloxide (deloxide-stress)",
  "deloxide (deloxide-stress-restore)",
]
description = "The diagnostic lane's active-only, order, stress and stressed-restore selections and their supervision qualification"
label = "deloxide"
name = "deloxide"

[[method]]
checks = ["client-conformance"]
description = "The cross-language client probes against one- and three-node clusters"
label = "client-conformance"
name = "client-conformance"

[[method]]
checks = [
  "build-diagnostic-deloxide-order-amd64",
  "chaos-smoke / smoke ordinary verdict",
  "chaos-smoke-diagnostic / smoke deloxide-order verdict",
]
description = "The external smoke suite against the release image and the deloxide-order diagnostic image of the revision"
label = "chaos"
name = "chaos-smoke"

[[method]]
checks = [
  "chaos-soak / soak ordinary verdict",
  "chaos-soak-diagnostic / soak deloxide-order verdict",
]
description = "The external soak suite against the release image and the deloxide-order diagnostic image of the revision"
label = "chaos-soak"
name = "chaos-soak"

[[method]]
checks = ["extra-tests"]
description = "The capability doctests"
label = "extra-doctests"
name = "extra-doctests"

[[method]]
checks = ["extra-tests"]
description = "Miri over the expiry map"
label = "extra-miri"
name = "extra-miri"

[[method]]
checks = ["extra-tests"]
description = "Mutation tests of the expiry map"
label = "extra-mutation"
name = "extra-mutation"

[[method]]
checks = ["extra-tests"]
description = "The Python runners, gates and collectors under coverage"
label = "extra-runners"
name = "extra-runners"

[[method]]
checks = ["extra-tests"]
description = "Source contracts, compiler diagnostics and compiler cache qualification"
label = "extra-compiler"
name = "extra-compiler"

[[method]]
checks = ["extra-tests"]
description = "Benchmark smoke tests"
label = "extra-bench-smoke"
name = "extra-bench-smoke"

[[method]]
checks = ["extra-tests"]
description = "Primitive boundary conformance in every mode, and its compile and browser checks"
label = "extra-primitives"
name = "extra-primitives"

[[method]]
checks = ["extra-tests"]
description = "The Plexus completion walk"
label = "extra-completion-walk"
name = "extra-completion-walk"

[[method]]
checks = ["extra-tests"]
description = "The Plexus connector declaration export"
label = "extra-connector-matrix"
name = "extra-connector-matrix"
