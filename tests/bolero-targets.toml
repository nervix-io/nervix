invariant = "Invalid row order, bounds and branch alignment fail as a whole without partial emission or affecting subsequent valid encoding."
max_input_bytes = 512
package = "nervix-server"
random_iterations = 128
source = "src/subscription_row/properties.rs"
test = "subscription_row::properties::bolero_invalid_arrow_selection_has_no_partial_emission"
test_target = "lib"

[[target]]
case_timeout_seconds = 10
corpus = "crates/client-ffi/src/tests/__fuzz__/tests__properties__bolero_shared_binding_keeps_complete_cells_and_retained_frames/corpus"
domain_version = 1
features = []
id = "client-binding-rows"
invariant = "Shared-binding column states, native scalar bits, variable offsets and retained frame bytes agree with complete production Row views."
max_input_bytes = 512
package = "nervix-client-ffi"
random_iterations = 128
source = "crates/client-ffi/src/tests/properties.rs"
test = "tests::properties::bolero_shared_binding_keeps_complete_cells_and_retained_frames"
test_target = "lib"
