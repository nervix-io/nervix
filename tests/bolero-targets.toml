corpus = "crates/connectors/mysql/src/table/__fuzz__/table__tests__bolero_mysql_insert_measure_matches_binary_parameters/corpus"
domain_version = 1
features = []
id = "mysql-insert-measures"
invariant = "A bounded MySQL insert measures its complete quoted statement and the bytes the driver's binary encoder writes for its parameters, for every nonempty row range, null pattern, member rotation and conflict action."
manifest = "Cargo.toml"
max_input_bytes = 1024
package = "nervix-connector-mysql"
random_iterations = 256
source = "crates/connectors/mysql/src/table/mod.rs"
test = "table::tests::bolero_mysql_insert_measure_matches_binary_parameters"
test_target = "lib"

[[target]]
case_timeout_seconds = 10
corpus = "crates/models/tests/representations/__fuzz__/envelopes__bolero_envelopes_keep_every_clause_and_property_through_json_and_the_archive/corpus"
domain_version = 1
features = []
id = "models-emitter-envelopes"
invariant = "A generated emitter envelope of every clause kind and of properties of any name in written order keeps every clause, duration and property through its complete JSON and archived representations."
manifest = "Cargo.toml"
max_input_bytes = 1024
package = "nervix-models"
random_iterations = 256
source = "crates/models/tests/representations/envelopes.rs"
test = "envelopes::bolero_envelopes_keep_every_clause_and_property_through_json_and_the_archive"
test_target = "test:representations"

[[target]]
case_timeout_seconds = 10
corpus = "crates/plexus/src/emitter/__fuzz__/emitter__envelope__tests__bolero_envelope_sections_read_back_as_the_envelopes_they_render/corpus"
domain_version = 1
features = []
id = "plexus-emitter-envelopes"
invariant = "The canonical Plexus of a generated envelope section, of every clause kind and declared property, reads back through the shared envelope grammar as the complete envelope."
manifest = "Cargo.toml"
max_input_bytes = 2048
package = "nervix-plexus"
random_iterations = 256
source = "crates/plexus/src/emitter/envelope_tests.rs"
test = "emitter::envelope::tests::bolero_envelope_sections_read_back_as_the_envelopes_they_render"
test_target = "lib"
