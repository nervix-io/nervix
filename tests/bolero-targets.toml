# One entry for every compiled Bolero property. Paths are Bolero 0.13.4's actual
# source-adjacent work directories, so ordinary cargo test replays corpus files.
[tool]
cargo_bolero = "0.13.4"
nightly = "nightly-2026-09-17"
pr_fuzz_seconds = 30
# One target of each harness whose sanitizer build CI prepares first, with one Cargo build job and
# the preparation deadline: the server library is too large for a campaign's build deadline.
prepared_targets = ["registry-archived-models", "client-arrow-rows"]
sanitizer = "address"

[[target]]
case_timeout_seconds = 10
corpus = "crates/models/src/connector/__fuzz__/connector__clickhouse__tests__bolero_clickhouse_tls_pairing_matches_the_transport_contract/corpus"
domain_version = 1
features = []
id = "clickhouse-client-tls-pairing"
invariant = "HTTP accepts no TLS files; HTTPS requires CA trust and either both client identity files or neither, independent of configuration entry order, with exact typed refusal keys."
manifest = "Cargo.toml"
max_input_bytes = 32
package = "nervix-models"
random_iterations = 256
source = "crates/models/src/connector/clickhouse.rs"
test = "connector::clickhouse::tests::bolero_clickhouse_tls_pairing_matches_the_transport_contract"
test_target = "lib"

