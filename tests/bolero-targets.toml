# One entry for every compiled Bolero property. Paths are Bolero 0.13.4's actual
# source-adjacent work directories, so ordinary cargo test replays corpus files.
[tool]
campaign_fuzz_seconds = 300
cargo_bolero = "0.13.4"
nightly = "nightly-2026-09-17"
pr_fuzz_seconds = 30
sanitizer = "address"

[[target]]
case_timeout_seconds = 10
corpus = "src/runtime/__fuzz__/runtime__endpoint_route_table__tests__bolero_endpoint_sequences_preserve_visible_routes_and_intake_lifetimes/corpus"
domain_version = 1
features = []
id = "endpoint-route-table"
invariant = "Bind, unbind, replace and teardown publish exactly the configured routes, preserve other domains, and prevent retained routes from admitting ended source lifetimes."
manifest = "Cargo.toml"
max_input_bytes = 64
package = "nervix-server"
random_iterations = 256
source = "src/runtime/endpoint_route_table_tests.rs"
test = "runtime::endpoint_route_table::tests::bolero_endpoint_sequences_preserve_visible_routes_and_intake_lifetimes"
test_target = "lib"

[[target]]
case_timeout_seconds = 10
corpus = "src/runtime/state_replication/__fuzz__/runtime__state_replication__replica_branch_checkpoints__tests__bolero_a_replica_catches_up_every_named_branch_with_its_owner/corpus"
domain_version = 1
features = []
id = "replica-catch-up"
invariant = "Whatever catalog reads and branch fetches fail and however announcements are lost, repeated or reordered, a replica holds every branch its lifecycle names at its owner's revision once reads and fetches succeed, never records holding what its storage does not, and every listing reaches it through its wire form unchanged."
manifest = "Cargo.toml"
max_input_bytes = 256
package = "nervix-server"
random_iterations = 256
source = "src/runtime/state_replication/replica_branch_checkpoints_tests.rs"
test = "runtime::state_replication::replica_branch_checkpoints::tests::bolero_a_replica_catches_up_every_named_branch_with_its_owner"
test_target = "lib"

