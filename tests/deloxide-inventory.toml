id = "probe.opposite-order-mutexes"
invariant = "Two named threads that each hold one mutex and want the other's report one active cycle naming both threads, both locks and where each waits, record it, and end the child with status 3."
invocation = "probes"
selections = [
  "deloxide",
  "deloxide-order",
  "deloxide-stress",
  "deloxide-stress-restore",
]
test = "two_threads_locking_two_mutexes_in_opposite_orders_report_one_cycle"

