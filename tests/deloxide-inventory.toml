[[workload]]
coverage = "Held-guard, witness, history and retention bounds of order analysis."
id = "probe.order-overload"
invariant = "Exceeding any order or retention bound records explicit overload evidence that cannot qualify and ends the child with status 4."
invocation = "probes"
selections = ["deloxide-order"]
test = "order_context_and_retention_overload_leave_failure_evidence"

[[workload]]
coverage = "Finding descriptions written to a failing or blocked standard error."
id = "probe.output-failure"
invariant = "A finding whose description cannot be written, or whose standard error stays blocked past the recording budget, ends the child with status 4 and nonqualifying evidence."
invocation = "probes"
selections = ["deloxide-order"]
test = "diagnostic_output_failure_and_a_blocked_descriptor_end_with_failure"

[[workload]]
coverage = "The thread-blocking primitives a diagnostic build selects."
id = "primitive.selected-locks"
invariant = "A diagnostic build selects the tracked mutex, read-write lock, guards and condition variable, and keeps the standard library's barrier, one-time initialization and channel."
invocation = "primitive-conformance"
selections = ["deloxide", "deloxide-order", "deloxide-stress"]
test = "tests::tracked_locks::deloxide_selects_the_tracked_locks_and_keeps_the_rest"

[[workload]]
coverage = "The tracked adapters' own acquisitions: `Debug` formatting of a free and of a held mutex and read-write lock."
id = "primitive.debug-formatting"
invariant = "Formatting a tracked mutex or read-write lock tries the lock and never waits: a free lock prints its value, a lock its own thread holds prints `<locked>`, a read-write lock prints its value beside another reader, and no finding reaches the detector's sink."
invocation = "primitive-conformance"
selections = ["deloxide", "deloxide-order", "deloxide-stress"]
test = "tests::tracked_locks::debug_formatting_never_waits_for_a_held_lock"

[[workload]]
coverage = "Construction from a value or its default, exclusive borrows, non-blocking acquisitions and moving the value out of a tracked lock."
id = "primitive.value-handoff"
invariant = "A tracked mutex and read-write lock hand their value in and out as the locks they replace do, and a non-blocking writer is refused while a reader holds the lock."
invocation = "primitive-conformance"
selections = ["deloxide", "deloxide-order", "deloxide-stress"]
test = "tests::tracked_locks::a_lock_hands_its_value_in_and_out"

[[workload]]
coverage = "A tracked condition variable waking two waiters through wait and notify_all."
