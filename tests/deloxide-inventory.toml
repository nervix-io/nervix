# The lifecycle scenarios the stress selection runs under Deloxide's scheduling disturbance, tagged
# `@deloxide_stress`, in one process and one scenario at a time. A stress build enters Deloxide's
# process-wide detector twice on every mutex and write acquisition, so the nodes of several
# scenarios in one process contend on it and miss product deadlines; one at a time they meet them.
# Together with the paced-driver scenarios below and `stress-restore-scenarios`, the stressed
# scenarios are every scenario of the active-only selection but the report tool's triage, which
# drives no lifecycle path.
# On CI's Boat runner, Check run 40909456410 ran 153 of the 154 runs in 2342s before its suite
# budget expired, so all of them take about 2357s; Ubicloud's run 40825862815 had run 153 in 1909s.
# A 66-minute invocation leaves 60 minutes of execution after its six-minute teardown reserve, about
# 1.5 times that measurement.
[[invocation]]
bound_seconds = 3960
concurrency = 1
evidence = true
id = "stress-scenarios"
inputs = ["tests/features/**/*.feature"]
kind = "cucumber"
package = "nervix-scenarios"
selections = ["deloxide-stress"]
tags = ["@deloxide_stress"]
target = "test:scenarios"

# The ten endpoint ACK lifecycle examples have a separate bounded serial phase. They do not
# consume the baseline lifecycle process's suite budget; both phases share the lane's unchanged
# workload budget and retain the same teardown reserve.
[[invocation]]
bound_seconds = 900
concurrency = 1
evidence = true
id = "stress-endpoint-acknowledgement"
