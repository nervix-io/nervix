[[workload]]
coverage = "WebSocket source lifecycle through public Plexus commands, including tracked quiesce, schedule and teardown locks. Socket waits and timer ordering are outside the detector."
examples = 2
feature = "tests/features/runtime/websocket_client_ingestion.feature"
id = "scenario.websocket-source-drop"
invariant = "Dropping a WebSocket source exchanges Close frames before releasing its transport on one and three nodes."
