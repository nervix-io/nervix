# The workloads of the Deloxide diagnostic lane, and the owners of tracked locks they reach.
#
# `just test-deloxide`, `just test-deloxide-order` and `just test-deloxide-stress` build every
# invocation below that their selection runs, and run it supervised: each process in a session of its own, within its bound and the
# lane's budget, with its output, evidence and exit kept in a fresh attempt directory. A selection
# runs every workload that lists it. The lane fails when a registered workload is missing, ignored
# or did not complete; when a discovered test or tagged scenario is not registered; when an
# invocation selects or executes nothing; when a process deadlocks, fails its diagnostics, is killed
# by a signal, outlives its bound or leaves a process behind; and when evidence is missing, partly
# written, or does not qualify. A renamed or moved workload is renamed here in the same change, and
# a new probe, conformance check, owner test or tagged scenario joins its invocation's workloads.
#
# Every `[[owner]]` names a source file in which the compiler finds a tracked blocking acquisition
# in a diagnostic configuration, and records which workloads reach those locks, what path the lane
# does not reach and why, or both. `just validate-deloxide-applicability` holds these records to
# the compiler's catalog: a new owner of tracked locks needs a record, and a record whose file no
# longer acquires one is removed.

[lane]
# The real-time budget of one selection's diagnostic compilation and execution, after its
# prerequisites. Expiry ends the lane with status 124. CI bounds the prerequisites, this budget and
# the coverage export together at 95 minutes.
budget_seconds = 4800
# How long a process gets to end on SIGTERM before the lane kills it.
stop_grace_seconds = 30
# How long the scenario binary's own teardown may take after its suite budget expires. The lane
# starts the binary with its invocation bound less this reserve as the suite budget, so a suite that
# runs out of time reports its unfinished scenarios before the lane has to kill it.
suite_teardown_reserve_seconds = 360

[[selection]]
name = "deloxide"
recorded = "ActiveOnly"

[[selection]]
name = "deloxide-order"
recorded = "OrderAnalysis"

# The active-only build with Deloxide's bounded scheduling disturbance, `StressConfiguration::LANE`.
# It runs every probe, conformance check and owner test, and the lifecycle scenarios of the
# `stress-scenarios` invocation.
[[selection]]
name = "deloxide-stress"
recorded = "StressedActiveOnly"

[[invocation]]
artifacts = true
bound_seconds = 900
id = "probes"
ignored = ["workload"]
kind = "libtest"
package = "nervix-deadlock"
target = "test:active_cycles"

# The tracked locks' own conformance checks, each in a process of its own. The primitive crate sits
# below nervix-deadlock, which owns evidence files, so a check records none: its detector's sink
# aborts the process on any finding, and the lane classifies that process by how it ended. The bound
# is twice the minute a check gives its own participants before it fails by assertion.
[[invocation]]
bound_seconds = 120
features = ["native"]
id = "primitive-conformance"
kind = "libtest-each"
marker = "tests::tracked_locks::"
package = "nervix-primitives"
target = "lib"

[[invocation]]
bound_seconds = 600
evidence = true
features = ["testing"]
id = "owner-tests"
kind = "libtest-each"
marker = "deloxide_"
package = "nervix-server"
target = "lib"

# The scenario binary runs four scenarios at once in each scenario invocation, on any machine, so a
# local run and CI's 16-vCPU runner put the same load on the diagnostic nodes.
[[invocation]]
bound_seconds = 2400
concurrency = 4
evidence = true
features = ["testing"]
id = "scenarios"
inputs = ["tests/features/**/*.feature"]
kind = "cucumber"
package = "nervix-server"
selections = ["deloxide", "deloxide-order"]
tags = [
  "@deadlock_diagnostics",
  "@restore_installation",
  "@client_ingestor_alter_drain",
  "@deadlock_reports",
  "@memory_pressure_pause",
  "@client_io_03_consumer_restore",
  "@client_io_03_generation",
  "@remote_ack_owners",
  "@backup_wait",
  "@restarted_voter_observation",
  "@udf_column_builder",
  "@vhost_tls_rebinding",
  "@inferencer_branch_batches",
  "@shutdown_cordon_release",
  "@shutdown_kafka_handoff",
  "@shutdown_leader_change",
]
target = "test:scenarios"

[[invocation]]
bound_seconds = 1200
concurrency = 4
driver = "nervix-paced-simulation"
evidence = true
features = ["testing"]
id = "paced-simulation"
inputs = ["tests/features/runtime/paced_simulation.feature"]
kind = "cucumber"
package = "nervix-server"
selections = ["deloxide", "deloxide-order"]
tags = ["@paced_simulation_reopen"]
target = "test:scenarios"

# The lifecycle scenarios the stress selection runs under Deloxide's scheduling disturbance, tagged
# `@deloxide_stress`, in one process and one scenario at a time. A stress build enters Deloxide's
# process-wide detector twice on every mutex and write acquisition, so the nodes of several
# scenarios in one process contend on it and miss product deadlines; one at a time they meet them.
[[invocation]]
bound_seconds = 3000
concurrency = 1
evidence = true
features = ["testing"]
id = "stress-scenarios"
inputs = ["tests/features/**/*.feature"]
kind = "cucumber"
package = "nervix-server"
selections = ["deloxide-stress"]
tags = ["@deloxide_stress"]
target = "test:scenarios"

[[workload]]
coverage = "Tracked mutex acquisitions waiting in a two-thread wait-for cycle."
id = "probe.opposite-order-mutexes"
invariant = "Two named threads that each hold one mutex and want the other's report one active cycle naming both threads, both locks and where each waits, record it, and end the child with status 3."
invocation = "probes"
selections = ["deloxide", "deloxide-order", "deloxide-stress"]
test = "two_threads_locking_two_mutexes_in_opposite_orders_report_one_cycle"

[[workload]]
coverage = "A mutex acquisition by the thread that already holds its guard."
id = "probe.self-relock"
invariant = "A thread that locks a mutex it holds reports a cycle of one naming the construction and waiting lines, and ends the child with status 3."
invocation = "probes"
selections = ["deloxide", "deloxide-order", "deloxide-stress"]
test = "a_thread_relocking_its_own_mutex_reports_a_cycle_of_one"

[[workload]]
coverage = "A write acquisition by the thread holding a read guard of the same lock."
id = "probe.read-upgrade"
invariant = "A thread that asks for write access to a read-write lock it reads reports a cycle of one with exclusive access and ends the child with status 3."
invocation = "probes"
selections = ["deloxide", "deloxide-order", "deloxide-stress"]
test = "a_thread_upgrading_its_own_read_lock_reports_a_cycle_of_one"

[[workload]]
coverage = "Shared and exclusive acquisitions of a read-write lock and a mutex in one cycle."
id = "probe.writer-reader"
invariant = "A writer and a reader that each hold one lock the other wants report one cycle with the reader's shared and the writer's exclusive access and end the child with status 3."
invocation = "probes"
selections = ["deloxide", "deloxide-order", "deloxide-stress"]
test = "a_writer_and_a_reader_across_two_locks_report_one_cycle"

[[workload]]
coverage = "A condition variable waiter reacquiring its mutex while its notifier holds that mutex."
id = "probe.notified-waiter"
invariant = "A notified waiter and a notifier that holds the waiter's mutex while it wants the waiter's lock report one cycle and end the child with status 3."
invocation = "probes"
selections = ["deloxide", "deloxide-order", "deloxide-stress"]
test = "a_notified_waiter_and_a_notifier_holding_its_mutex_report_one_cycle"

[[workload]]
coverage = "Repeated nested mutex acquisitions in one consistent order."
id = "probe.consistent-order"
invariant = "Two threads that take two mutexes in one order for many rounds end cleanly with evidence that records no finding."
invocation = "probes"
selections = ["deloxide", "deloxide-order", "deloxide-stress"]
test = "threads_taking_two_mutexes_in_one_order_complete_without_findings"

[[workload]]
coverage = "A condition variable handing values between two threads through wait and notify_all."
id = "probe.condition-handoff"
invariant = "A value handed between two threads through a condition variable for many rounds ends cleanly with evidence that records no finding."
invocation = "probes"
selections = ["deloxide", "deloxide-order", "deloxide-stress"]
test = "a_condition_handed_between_threads_completes_without_findings"

[[workload]]
coverage = "Concurrent shared acquisitions of one read-write lock."
id = "probe.shared-readers"
invariant = "Three readers that share a read-write lock across a barrier end cleanly with evidence that records no finding."
invocation = "probes"
selections = ["deloxide", "deloxide-order", "deloxide-stress"]
test = "readers_sharing_a_read_write_lock_complete_without_findings"

[[workload]]
coverage = "Deloxide's scheduling disturbance before nested mutex acquisitions, and its configuration in evidence."
id = "probe.stress-disturbance"
invariant = "A thread that takes an inner mutex while it holds an outer one for twenty thousand rounds waits at least the shortest delay for half the preemptions the lane's configuration expects, and its evidence records that configuration and no finding."
invocation = "probes"
selections = ["deloxide-stress"]
test = "stress_delays_nested_acquisitions_and_records_its_configuration"

[[workload]]
coverage = "Detector installation and the process's standard streams."
id = "probe.quiet-start"
invariant = "Installing the detector writes nothing of its own to standard output or standard error, and the process's later output still arrives."
invocation = "probes"
selections = ["deloxide", "deloxide-order", "deloxide-stress"]
test = "the_detector_keeps_its_start_up_output_off_standard_output"

[[workload]]
coverage = "The once-per-process diagnostic run."
id = "probe.one-run"
invariant = "A second diagnostic run in one process is refused as an installation failure and the first run stays current."
invocation = "probes"
selections = ["deloxide", "deloxide-order", "deloxide-stress"]
test = "a_process_starts_one_run"

[[workload]]
coverage = "A tracked lock constructed before installation."
id = "probe.lock-before-run"
invariant = "A process that constructs a tracked lock before its diagnostic run fails with the configuration error instead of running untracked."
invocation = "probes"
selections = ["deloxide", "deloxide-order", "deloxide-stress"]
test = "a_tracked_lock_before_the_run_fails_the_process"

[[workload]]
coverage = "Starting a run whose evidence directory does not exist."
id = "probe.missing-directory"
invariant = "A run refuses an evidence directory that does not exist with a typed start failure and creates nothing."
invocation = "probes"
selections = ["deloxide", "deloxide-order", "deloxide-stress"]
test = "a_run_refuses_an_evidence_directory_that_does_not_exist"

[[workload]]
coverage = "Recording an active finding into a directory that can no longer hold evidence."
id = "probe.unrecordable-evidence"
invariant = "An active cycle whose evidence cannot be written is still described on standard error and ends the child with the diagnostic failure status 4."
invocation = "probes"
selections = ["deloxide", "deloxide-order", "deloxide-stress"]
test = "a_deadlock_whose_evidence_cannot_be_recorded_fails_the_diagnostic_run"

[[workload]]
coverage = "A run without an evidence directory."
id = "probe.standard-error-only"
invariant = "A run without an evidence directory describes an active cycle on standard error alone and ends the child with status 3."
invocation = "probes"
selections = ["deloxide", "deloxide-order", "deloxide-stress"]
test = "a_run_without_an_evidence_directory_reports_on_standard_error"

[[workload]]
coverage = "Historical order edges of two mutexes taken serially in both orders."
id = "probe.serial-inversion"
invariant = "One thread taking A then B and later B then A retains one unreviewed potential cycle with complete source context while the workload continues and ends cleanly."
invocation = "probes"
selections = ["deloxide-order"]
test = "serial_inverse_order_retains_potential_evidence_and_the_workload_continues"

[[workload]]
coverage = "The order history's witness budget across many short-lived worker threads."
id = "probe.worker-contexts"
invariant = "A historical edge retains every one of 512 distinct worker thread contexts, each once, with its exclusive modes and source sites."
invocation = "probes"
selections = ["deloxide-order"]
test = "a_historical_edge_retains_every_distinct_worker_context"

[[workload]]
coverage = "Opposite read-only orders of two read-write locks."
id = "probe.shared-read-order"
invariant = "Opposite orders of shared acquisitions only end cleanly without an order finding."
invocation = "probes"
selections = ["deloxide-order"]
test = "shared_read_orders_complete_without_an_order_finding"

[[workload]]
coverage = "Mixed shared and exclusive historical order with recursive reads."
id = "probe.mixed-order"
invariant = "A mixed reader/writer inversion retains its modes and read multiplicity, refuses a shared-reader proof and qualifies only after a specific non-overlap review."
invocation = "probes"
selections = ["deloxide-order"]
test = "mixed_order_history_retains_modes_multiplicity_and_a_serial_non_overlap_proof"

[[workload]]
coverage = "Lock instances constructed at one source site in separate lifetimes."
id = "probe.separate-lifetimes"
invariant = "Inverse orders of distinct lock instances built at the same construction sites in separate lifetimes record no finding."
invocation = "probes"
selections = ["deloxide-order"]
test = "reused_construction_sites_keep_separate_lock_lifetimes"

[[workload]]
coverage = "An order-instrumented build whose order checking is disabled at run time."
id = "probe.runtime-active-only"
invariant = "An order build started active-only records the OrderInstrumentedActiveOnly selection, retains no order finding and still reports an active self wait."
