# The workloads of the Deloxide diagnostic lane, and the owners of tracked locks they reach.
#
# `just test-deloxide`, `just test-deloxide-order`, `just test-deloxide-stress` and
# `just test-deloxide-stress-restore` build every invocation below that their selection runs, and
# run it supervised: each process in a session of its own, within its bound and its stage's budget,
# with its output, evidence and exit kept in a fresh attempt directory. A selection runs every
# workload that lists it. The lane fails when a registered workload is missing, ignored
# or did not complete; when a discovered test or tagged scenario is not registered; when an
# invocation selects or executes nothing; when a process deadlocks, fails its diagnostics, is killed
# by a signal, outlives its bound or leaves a process behind; and when evidence is missing, partly
# written, or does not qualify. A renamed or moved workload is renamed here in the same change, and
# a new probe, conformance check, owner test or tagged scenario joins its invocation's workloads.
#
# Every `[[owner]]` names a source file in which the compiler finds a tracked blocking acquisition
# in a diagnostic configuration, and records which workloads reach those locks, what path the lane
# does not reach and why, or both. `just validate-deloxide-applicability` holds these records to
# the compiler's catalog: a new owner of tracked locks needs a record, and a record whose file no
# longer acquires one is removed.

[[workload]]
coverage = "Kafka records through the real broker and the source host's tracked ingestion and ACK state, with every new metadata field read in NO ACK, ACK SEQUENTIAL and ACK PARALLEL on one and three nodes. Driver polling and borrowed metadata visits are untracked."
examples = 6
feature = "tests/features/runtime/kafka_metadata.feature"
id = "scenario.kafka-record-metadata"
invariant = "Every admitted record retains its own binary key, exact broker timestamp, timestamp kind and tombstone flag across ingestion and acknowledgement."
invocation = "scenarios"
scenario = "A Kafka <mode_name> ingestor projects each record's key, timestamp and type"
selections = ["deloxide", "deloxide-order"]

[[workload]]
coverage = "Real Kafka null and empty values decoded through TOML and JAQ, then projected beside tracked ingestion and acknowledgement state on one and three nodes. Driver data and metadata conversion are untracked."
examples = 2
feature = "tests/features/runtime/kafka_metadata.feature"
id = "scenario.kafka-record-tombstones"
invariant = "A null Kafka value has tombstone=true and an empty non-null value has tombstone=false for every row its codec produces."
invocation = "scenarios"
scenario = "A Kafka ingestor distinguishes a tombstone from an empty value"
selections = ["deloxide", "deloxide-order"]

[[workload]]
coverage = "Real Kafka metadata timestamps drive two branch-local historical windows through tracked source and processor lifecycle state on one and three nodes. Logical timer waits and borrowed metadata conversion are untracked."
examples = 2
feature = "tests/features/runtime/kafka_metadata.feature"
id = "scenario.kafka-record-event-time"
invariant = "TIMESTAMP AT metadata.timestamp uses the broker instant for each branch's duration window and preserves the row's fields."
invocation = "scenarios"
scenario = "Kafka broker event time makes historical windows due independently in two branches"
selections = ["deloxide", "deloxide-order"]

[[workload]]
coverage = "Under scheduling stress: real-broker Kafka ingestion and ACK state in all three modes with every record metadata field read. Driver polling and borrowed metadata visits remain untracked."
examples = 6
feature = "tests/features/runtime/kafka_metadata.feature"
id = "stress.kafka-record-metadata"
invariant = "Every admitted record retains its own binary key, exact broker timestamp, timestamp kind and tombstone flag across ingestion and acknowledgement."
invocation = "stress-scenarios"
scenario = "A Kafka <mode_name> ingestor projects each record's key, timestamp and type"
selections = ["deloxide-stress"]

[[workload]]
coverage = "Under scheduling stress: real Kafka null and empty values decoded through TOML and JAQ beside tracked ingestion and acknowledgement state. Driver data and metadata conversion remain untracked."
examples = 2
feature = "tests/features/runtime/kafka_metadata.feature"
id = "stress.kafka-record-tombstones"
invariant = "A null Kafka value has tombstone=true and an empty non-null value has tombstone=false for every row its codec produces."
invocation = "stress-scenarios"
scenario = "A Kafka ingestor distinguishes a tombstone from an empty value"
selections = ["deloxide-stress"]

[[workload]]
coverage = "Under scheduling stress: metadata timestamps drive two historical branch windows beside tracked source and processor lifecycle state. Logical timer waits and borrowed metadata conversion remain untracked."
examples = 2
feature = "tests/features/runtime/kafka_metadata.feature"
id = "stress.kafka-record-event-time"
invariant = "TIMESTAMP AT metadata.timestamp uses the broker instant for each branch's duration window and preserves the row's fields."
invocation = "stress-scenarios"
scenario = "Kafka broker event time makes historical windows due independently in two branches"
selections = ["deloxide-stress"]

[lane]
# All diagnostic test and driver executables build before any workload starts, under their own
# real-time budget. The measured cold stressed scenario build took 1988s on a loaded host; 80
# minutes also leaves room for the selection's other builds and variation without borrowing time
# from its workloads. Expiry ends the lane with status 124 and identifies the build stage.
build_budget_seconds = 4800
# The real-time budget of one selection's workloads, started after every build completes. On CI's
# Boat runner the order selection's workloads run about three times as long as on its previous
# runner: Check run 40926015015 reached its 24th scenario chunk after 4403s, which run 40825862815
# reached after 1226s of the 3289s all its workloads took, so they take about 10800s. Four hours
# cover that about 1.3 times. CI bounds prerequisites, both stages and the coverage export
# together at 335 minutes, within the six hours a Boat CI job may run.
budget_seconds = 14400
# How long a process gets to end on SIGTERM before the lane kills it.
stop_grace_seconds = 30
# How long the scenario binary's own teardown may take after its suite budget expires. The lane
# starts the binary with its invocation bound less this reserve as the suite budget, so a suite that
# runs out of time reports its unfinished scenarios before the lane has to kill it.
suite_teardown_reserve_seconds = 360

[[selection]]
name = "deloxide"
recorded = "ActiveOnly"

[[selection]]
name = "deloxide-order"
recorded = "OrderAnalysis"

# The active-only build with Deloxide's bounded scheduling disturbance, `StressConfiguration::LANE`.
# It runs every probe, conformance check and owner test, the lifecycle scenarios of the
# `stress-transaction-retention`, `stress-scenarios` and `stress-endpoint-acknowledgement`
# invocations and the paced-driver
# scenarios of `stress-paced-simulation`.
[[selection]]
name = "deloxide-stress"
recorded = "StressedActiveOnly"

# The same stressed build's capture, restore and checkpoint-transfer scenarios, in a lane of their
# own. Stressed scenarios run one at a time, and those of both selections together would take most
# of one lane's budget, so each selection keeps its own budget and CI runs each on a runner of its
# own.
[[selection]]
feature = "deloxide-stress"
name = "deloxide-stress-restore"
recorded = "StressedActiveOnly"

[[invocation]]
artifacts = true
bound_seconds = 900
id = "probes"
ignored = ["workload"]
kind = "libtest"
package = "nervix-deadlock"
target = "test:active_cycles"

# The tracked locks' own conformance checks, each in a process of its own. The primitive crate sits
# below nervix-deadlock, which owns evidence files, so a check records none: its detector's sink
# aborts the process on any finding, and the lane classifies that process by how it ended. The bound
# is twice the minute a check gives its own participants before it fails by assertion.
[[invocation]]
bound_seconds = 120
features = ["native"]
id = "primitive-conformance"
kind = "libtest-each"
marker = "tests::tracked_locks::"
package = "nervix-primitives"
selections = ["deloxide", "deloxide-order", "deloxide-stress"]
target = "lib"

[[invocation]]
bound_seconds = 600
evidence = true
features = ["testing"]
id = "owner-tests"
kind = "libtest-each"
marker = "deloxide_"
package = "nervix-server"
selections = ["deloxide", "deloxide-order", "deloxide-stress"]
target = "lib"

