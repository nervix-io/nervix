invariant = "Peer closes retain their code and reason through successful upgrades; reconnect delays grow until a batch is delivered."
invocation = "scenarios"
scenario = "A repeatedly closing WebSocket peer is reconnected with growing delays on <cluster_size> nodes"
selections = ["deloxide", "deloxide-order"]

