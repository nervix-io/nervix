[package]
description = "The Nervix web console"
edition.workspace = true
license-file.workspace = true
name = "nervix-web-console"
version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
console_error_panic_hook = { workspace = true }
error-stack = { workspace = true }
futures-util = { workspace = true }
gloo-net = { workspace = true, features = ["http", "websocket"] }
js-sys = { workspace = true }
leptos = { workspace = true }
meticulous = { workspace = true }
nervix-approx-into = { workspace = true }
nervix-client-wire = { workspace = true }
nervix-dataflow-graph = { workspace = true }
nervix-models = { workspace = true }
nervix-nspl = { workspace = true, features = ["client"] }
nervix-primitives = { workspace = true }
nervix-recovery = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["js", "v7"] }

wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
  "Blob",
  "Crypto",
  "Document",
  "Element",
  "File",
  "FileList",
  "FormData",
  "HtmlElement",
  "HtmlDivElement",
  "HtmlInputElement",
  "Location",
  "Request",
  "RequestInit",
  "Response",
  "Window",
] }

[dev-dependencies]
any_spawner = { workspace = true, features = ["futures-executor"] }
leptos = { workspace = true, features = ["ssr"] }
