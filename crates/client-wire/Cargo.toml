[package]
build = "build.rs"
description = "The verified FlatBuffers wire contract of the Nervix client session: schema, frames, limits and transport codecs"
edition.workspace = true
license-file.workspace = true
name = "nervix-client-wire"
version.workspace = true

[lints]
workspace = true

[features]
default = []
# The tonic codec for the native gRPC transport. Browser builds leave it off.
grpc = ["dep:nervix-primitives", "dep:tonic"]

[dependencies]
base64-simd = { workspace = true }
bytes = { workspace = true }
error-stack = { workspace = true }
flatbuffers = { workspace = true }
meticulous = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true, optional = true }
serde_json = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tonic = { workspace = true, optional = true }
url = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
flatc-rust = { workspace = true }
meticulous = { workspace = true }

[dev-dependencies]
bolero = { workspace = true }
futures-util = { workspace = true }
nervix-arbitrary = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
tokio-tungstenite = { workspace = true }

[[test]]
name = "grpc_session"
required-features = ["grpc"]
