[package]
description = "Canonical formatter for NSPL source files"
edition.workspace = true
license-file.workspace = true
name = "nervix-nspl-format"
version.workspace = true

[lints]
workspace = true

[dependencies]
ariadne = { workspace = true }
clap = { workspace = true, features = ["derive"] }
ignore = { workspace = true }
meticulous = { workspace = true }
nervix-models = { workspace = true }
nervix-nspl = { workspace = true, features = ["client"] }
nervix-recovery = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
nervix-nspl = { workspace = true, features = ["client"] }
