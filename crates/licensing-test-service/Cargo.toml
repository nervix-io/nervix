[package]
description = "A bounded HTTPS licensing peer for Nervix public scenarios"
edition.workspace = true
name = "nervix-licensing-test-service"
publish = false
version.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
error-stack = { workspace = true }
futures-util = { workspace = true }
hyper-util = { workspace = true, features = [
  "server-auto",
  "service",
  "tokio",
] }
meticulous = { workspace = true }
nervix-crypto = { workspace = true }
nervix-licensing-protocol = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
nervix-recovery = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio-rustls = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
