[package]
description = "The Nervix expression VM: compiles expression programs to IR and executes them over Arrow batches"
edition.workspace = true
license-file.workspace = true
name = "nervix-vm"
version.workspace = true

[lints]
workspace = true

[dependencies]
ahash = { workspace = true }
arc-swap = { workspace = true }
arch-into = { workspace = true }
arrow-arith = { workspace = true }
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-cast = { workspace = true }
arrow-ord = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
arrow-string = { workspace = true }
base64-simd = { workspace = true }
chrono = { workspace = true }
error-stack = { workspace = true }
faster-hex = { workspace = true }
humantime = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
jiff-tzdb = { workspace = true }
md5 = { workspace = true }
meticulous = { workspace = true }
nervix-approx-into = { workspace = true }
nervix-models = { workspace = true }
regex = { workspace = true }
regex-automata = { workspace = true }
sha2 = { workspace = true }
# Integers beyond 64 bits read as the nearest F64, so a document holding one is still valid JSON
# and an extraction reports the number as out of range rather than the document as malformed.
simd-json = { workspace = true, features = ["big-int-as-float"] }
sorted-vec = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
triomphe = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7"] }
xxhash-rust = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
nervix-nspl = { workspace = true }
nonzero_ext = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[[bench]]
harness = false
name = "vm"
