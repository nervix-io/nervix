[package]
description = "The shared Rust binding of the Nervix client session: a C ABI other languages load"
edition.workspace = true
license-file.workspace = true
name = "nervix-client-ffi"
version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arch-into = { workspace = true }
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-data = { workspace = true }
arrow-schema = { workspace = true }
bytes = { workspace = true }
error-stack = { workspace = true }
meticulous = { workspace = true }
nervix-client-core = { workspace = true, features = ["arrow", "autocomplete"] }
nervix-models = { workspace = true, features = ["arrow"] }
nervix-primitives = { workspace = true, features = ["native"] }
nervix-recovery = { workspace = true }
strum = { workspace = true, features = ["derive"] }

[dev-dependencies]
arrow-ipc = { workspace = true }
bolero = { workspace = true }
serde_json = { workspace = true }
tonic = { workspace = true }
uuid = { workspace = true }
