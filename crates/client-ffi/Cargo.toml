[package]
description = "The shared Rust binding of the Nervix client session: a C ABI other languages load"
edition.workspace = true
license-file.workspace = true
name = "nervix-client-ffi"
version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arch-into = { workspace = true }
error-stack = { workspace = true }
meticulous = { workspace = true }
nervix-client-core = { workspace = true, features = ["autocomplete"] }
nervix-models = { workspace = true }
strum = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
triomphe = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true }
