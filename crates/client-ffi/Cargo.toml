[package]
description = "The C ABI of the Nervix client session, which other languages load"
edition.workspace = true
license-file.workspace = true
name = "nervix-client-ffi"
version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arch-into = { workspace = true }
meticulous = { workspace = true }
nervix-client-core = { workspace = true, features = ["arrow", "autocomplete"] }
nervix-client-host = { workspace = true }
nervix-models = { workspace = true, features = ["arrow"] }
nervix-primitives = { workspace = true, features = ["native"] }
url = { workspace = true }

[dev-dependencies]
arrow-ipc = { workspace = true }
bolero = { workspace = true }
bytes = { workspace = true }
error-stack = { workspace = true }
nervix-arbitrary = { workspace = true }
serde_json = { workspace = true }
tonic = { workspace = true }
uuid = { workspace = true }
