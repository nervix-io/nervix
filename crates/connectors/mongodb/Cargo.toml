[package]
description = "The MongoDB sink connector for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-mongodb"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = [
  "nervix-connector/shuttle",
  "nervix-execution/shuttle",
  "nervix-primitives/shuttle",
]

[dependencies]
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
error-stack = { workspace = true }
futures-util = { workspace = true }
meticulous = { workspace = true }
mongodb = { workspace = true }
nervix-connector = { workspace = true }
nervix-execution = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
strum = { workspace = true, features = ["derive"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bolero = { workspace = true }
rcgen = { workspace = true }
