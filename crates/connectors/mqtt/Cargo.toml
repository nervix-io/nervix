[package]
description = "The MQTT source and sink connector for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-mqtt"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = [
  "dep:shuttle-tokio",
  "nervix-connector/shuttle",
  "shuttle-tokio/shuttle",
]

[dependencies]
arch-into = { workspace = true }
async-trait = { workspace = true }
error-stack = { workspace = true }
futures-util = { workspace = true }
humantime = { workspace = true }
meticulous = { workspace = true }
nervix-connector = { workspace = true }
nervix-models = { workspace = true }
rumqttc = { workspace = true }
shuttle-tokio = { workspace = true, features = [
  "macros",
  "rt",
  "sync",
  "time",
], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
nonzero_ext = { workspace = true }
tempfile = { workspace = true }
