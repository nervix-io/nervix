[package]
description = "The MQTT source and sink connector for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-mqtt"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = ["nervix-connector/shuttle", "nervix-primitives/shuttle"]

[dependencies]
arch-into = { workspace = true }
async-trait = { workspace = true }
error-stack = { workspace = true }
futures-util = { workspace = true }
humantime = { workspace = true }
meticulous = { workspace = true }
nervix-connector = { workspace = true }
nervix-dns = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
rumqttc = { workspace = true }
rumqttc-core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
triomphe = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# The test hosts hand a sink the node's executor, as the server's host does.
nervix-execution = { workspace = true }
nervix-test-environment = { workspace = true }
nonzero_ext = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
