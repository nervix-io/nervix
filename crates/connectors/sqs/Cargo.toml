[package]
description = "The SQS sink connector for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-sqs"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = [
  "dep:shuttle-tokio",
  "nervix-connector/shuttle",
  "shuttle-tokio/shuttle",
]

[dependencies]
ahash = { workspace = true }
async-trait = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
aws-sdk-sqs = { workspace = true }
# The SDK crates disable their TLS defaults; select AWS-LC on their shared client.
aws-smithy-http-client = { workspace = true, features = ["rustls-aws-lc"] }
error-stack = { workspace = true }
meticulous = { workspace = true }
nervix-connector = { workspace = true }
nervix-models = { workspace = true }
shuttle-tokio = { workspace = true, features = [
  "macros",
  "rt",
], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
