[package]
description = "The SQS source and sink connector for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-sqs"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = [
  "dep:shuttle",
  "nervix-connector/shuttle",
  "nervix-model-harness/shuttle",
  "nervix-primitives/shuttle",
]

[dependencies]
ahash = { workspace = true }
async-trait = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
aws-sdk-sqs = { workspace = true }
# The SDK crates disable their TLS defaults; select AWS-LC on their shared client.
aws-smithy-http-client = { workspace = true, features = ["rustls-aws-lc"] }
error-stack = { workspace = true }
meticulous = { workspace = true }
nervix-connector = { workspace = true }
nervix-dns = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
nervix-simd-kernels = { workspace = true }
# Parses a CA file the same way Smithy's TLS context will, before Smithy reads it.
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
shuttle = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[dev-dependencies]
bolero = { workspace = true }
nervix-model-harness = { workspace = true }
# The cancelled-receive budget test advances a paused clock.
nervix-primitives = { workspace = true, features = ["native", "test-util"] }
nervix-recovery = { workspace = true }
nervix-test-environment = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
] }
