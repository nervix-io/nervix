[package]
description = "The SQS source and sink connector for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-sqs"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = ["nervix-connector/shuttle", "nervix-primitives/shuttle"]

[dependencies]
ahash = { workspace = true }
async-trait = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
aws-sdk-sqs = { workspace = true }
# The SDK crates disable their TLS defaults; select AWS-LC on their shared client.
aws-smithy-http-client = { workspace = true, features = ["rustls-aws-lc"] }
error-stack = { workspace = true }
meticulous = { workspace = true }
nervix-connector = { workspace = true }
nervix-dns = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
nervix-simd-kernels = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[dev-dependencies]
bolero = { workspace = true }
nervix-test-environment = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
] }
