[package]
description = "The Pulsar source and sink connector for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-pulsar"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = ["nervix-connector/shuttle", "nervix-primitives/shuttle"]

[dependencies]
arch-into = { workspace = true }
async-trait = { workspace = true }
error-stack = { workspace = true }
futures-util = { workspace = true }
meticulous = { workspace = true }
nervix-connector = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
nervix-recovery = { workspace = true }
pulsar = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
bolero = { workspace = true }
# The test hosts hand a sink the node's executor, as the server's host does.
nervix-execution = { workspace = true }
nervix-primitives = { workspace = true, features = ["native", "test-util"] }
tempfile = { workspace = true }
tokio-util = { workspace = true, features = ["codec"] }
