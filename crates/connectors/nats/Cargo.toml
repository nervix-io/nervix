[package]
description = "The NATS source and sink connector for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-nats"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = ["nervix-connector/shuttle", "nervix-primitives/shuttle"]

[dependencies]
async-nats = { workspace = true }
async-trait = { workspace = true }
error-stack = { workspace = true }
futures-util = { workspace = true }
meticulous = { workspace = true }
nervix-connector = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
nervix-recovery = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
bolero = { workspace = true }
bytes = { workspace = true }
nervix-arbitrary = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
