[package]
description = "The OpenTelemetry sink connector for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-otel"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = ["nervix-connector/shuttle", "nervix-primitives/shuttle"]

[dependencies]
ahash = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
error-stack = { workspace = true }
flate2 = { workspace = true }
hyper-util = { workspace = true, features = ["client-legacy", "tokio"] }
meticulous = { workspace = true }
nervix-approx-into = { workspace = true }
nervix-connector = { workspace = true }
nervix-dns = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
opentelemetry-proto = { workspace = true, features = [
  "gen-tonic",
  "logs",
  "metrics",
  "trace",
] }
otel-prost = { workspace = true }
otel-tonic = { workspace = true }
otel-tonic-types = { workspace = true }
reqwest = { workspace = true, features = [
  "brotli",
  "deflate",
  "gzip",
  "hickory-dns",
  "json",
  "rustls",
] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# The test hosts hand a sink the node's executor, as the server's host does.
nervix-execution = { workspace = true }
nervix-test-environment = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
] }
