[package]
description = "The Iceberg sink connector for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-iceberg"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = [
  "dep:shuttle-tokio",
  "nervix-connector/shuttle",
  "shuttle-tokio/shuttle",
]

[dependencies]
ahash = { workspace = true }
arch-into = { workspace = true }
arrow-array = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
error-stack = { workspace = true }
fastrand = { workspace = true }
futures-util = { workspace = true }
iceberg = { workspace = true }
iceberg-catalog-rest = { workspace = true }
meticulous = { workspace = true }
nervix-connector = { workspace = true }
nervix-dns = { workspace = true }
nervix-models = { workspace = true }
opendal = { workspace = true, features = [
  "layers-retry",
  "layers-timeout",
  "services-azdls",
  "services-gcs",
  "services-s3",
] }
parquet = { workspace = true }
reqwest = { workspace = true }
reqwest_iceberg = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
shuttle-tokio = { workspace = true, features = [
  "fs",
  "macros",
  "rt",
  "sync",
  "time",
], optional = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync", "time"] }
tracing = { workspace = true }
typetag = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
webpki-roots = { workspace = true }

[dev-dependencies]
http = { workspace = true }
nervix-test-environment = { workspace = true }
reqsign-core = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
] }
