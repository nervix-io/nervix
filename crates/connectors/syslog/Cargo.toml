[package]
description = "The Syslog sink connector for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-syslog"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = [
  "dep:shuttle-tokio",
  "nervix-connector/shuttle",
  "shuttle-tokio/shuttle",
]

[dependencies]
ahash = { workspace = true }
async-trait = { workspace = true }
error-stack = { workspace = true }
nervix-connector = { workspace = true }
nervix-models = { workspace = true }
nervix-recovery = { workspace = true }
nonzero_ext = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
shuttle-tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
tokio-rustls = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
