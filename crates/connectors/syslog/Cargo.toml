[package]
description = "The Syslog source and sink transports and their shared client configuration for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-syslog"
version.workspace = true

[lints]
workspace = true

[features]
# Exposes the stream framer to the Criterion benchmark.
benchmarks = []
default = []
shuttle = ["nervix-connector/shuttle", "nervix-primitives/shuttle"]

[dependencies]
ahash = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
error-stack = { workspace = true }
memchr = { workspace = true }
meticulous = { workspace = true }
nervix-connector = { workspace = true }
nervix-dns = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
nonzero_ext = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
bolero = { workspace = true }
criterion = { workspace = true }
nervix-test-environment = { workspace = true }
tempfile = { workspace = true }

[[bench]]
harness = false
name = "stream_framing"
required-features = ["benchmarks"]
