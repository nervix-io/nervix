[package]
description = "The Syslog source and sink transports for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-syslog"
version.workspace = true

[lints]
workspace = true

[features]
# Exposes the stream framer to the Criterion benchmark.
benchmarks = []
default = []
shuttle = [
  "dep:shuttle",
  "nervix-connector/shuttle",
  "nervix-model-harness/shuttle",
  "nervix-primitives/shuttle",
]
testing = []

[dependencies]
arch-into = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
error-stack = { workspace = true }
memchr = { workspace = true }
meticulous = { workspace = true }
nervix-connector = { workspace = true }
nervix-dns = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
shuttle = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bolero = { workspace = true }
criterion = { workspace = true }
nervix-model-harness = { workspace = true }
nonzero_ext = { workspace = true }
# The connection deadline checks run on a paused clock.
nervix-primitives = { workspace = true, features = ["native", "test-util"] }
nervix-test-environment = { workspace = true }
# The TLS handshake deadline check accepts connections with a generated server identity.
rcgen = { workspace = true }
tempfile = { workspace = true }

[[bench]]
harness = false
name = "stream_framing"
required-features = ["benchmarks"]
