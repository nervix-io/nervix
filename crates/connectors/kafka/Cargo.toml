[package]
description = "The Kafka sink connector for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-kafka"
version.workspace = true

[lints]
workspace = true

[features]
benchmarks = []
default = []
shuttle = ["nervix-connector/shuttle", "nervix-primitives/shuttle"]
testing = []

[dependencies]
async-trait = { workspace = true }
error-stack = { workspace = true }
humantime = { workspace = true }
meticulous = { workspace = true }
nervix-connector = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
nervix-recovery = { workspace = true }
rdkafka = { workspace = true, features = [
  "tokio",
  "curl-static",
  "curl-rustls",
  "libz-static",
  "cmake_build",
  "static-linking",
  "aws-lc",
] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bolero = { workspace = true }
criterion = { workspace = true }
# The test host hands a sink the node's executor, as the server's host does.
nervix-execution = { workspace = true }

[[bench]]
harness = false
name = "partition_offsets"
required-features = ["benchmarks"]
