[package]
description = "The Kafka sink connector for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-kafka"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = ["nervix-connector/shuttle", "nervix-primitives/shuttle"]
testing = []

[dependencies]
async-trait = { workspace = true }
error-stack = { workspace = true }
futures-util = { workspace = true }
humantime = { workspace = true }
meticulous = { workspace = true }
nervix-connector = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
rdkafka = { workspace = true, features = [
  "tokio",
  "curl-static",
  "curl-rustls",
  "libz-static",
  "cmake_build",
  "static-linking",
  "aws-lc",
] }
thiserror = { workspace = true }
tracing = { workspace = true }
triomphe = { workspace = true }
