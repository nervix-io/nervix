[package]
description = "The WebSocket source and signaling protocol engine for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-websockets"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = [
  "dep:shuttle",
  "nervix-connector/shuttle",
  "nervix-model-harness/shuttle",
  "nervix-primitives/shuttle",
]

[dependencies]
async-trait = { workspace = true }
error-stack = { workspace = true }
futures-util = { workspace = true }
meticulous = { workspace = true }
nervix-connector = { workspace = true }
nervix-dns = { workspace = true }
nervix-jaq = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
prost = { workspace = true }
prost-reflect = { workspace = true, features = ["serde"] }
serde_json = { workspace = true }
shuttle = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }
tokio-tungstenite = { workspace = true, features = ["__rustls-tls", "connect"] }
url = { workspace = true }

[dev-dependencies]
bolero = { workspace = true }
nervix-arbitrary = { workspace = true }
nervix-model-harness = { workspace = true }
nervix-test-environment = { workspace = true }
tempfile = { workspace = true }
