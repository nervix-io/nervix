[package]
description = "The RabbitMQ source and sink connector for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-rabbitmq"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = [
  "dep:shuttle-tokio",
  "nervix-connector/shuttle",
  "nervix-primitives/shuttle",
  "shuttle-tokio/shuttle",
]

[dependencies]
async-rs = { workspace = true }
async-trait = { workspace = true }
error-stack = { workspace = true }
flume = { workspace = true }
futures-util = { workspace = true }
humantime = { workspace = true }
lapin = { workspace = true }
meticulous = { workspace = true }
nervix-connector = { workspace = true }
nervix-dns = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true }
shuttle-tokio = { workspace = true, features = [
  "macros",
  "rt",
  "time",
], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
url = { workspace = true }

[dev-dependencies]
nervix-test-environment = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
] }
