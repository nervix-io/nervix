[package]
description = "The RabbitMQ ingestor and emitter connector for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-rabbitmq"
version.workspace = true

[lints]
workspace = true

[features]
# Real-broker publication benchmarks are selected explicitly.
benchmarks = []
default = []
shuttle = [
  "dep:shuttle",
  "nervix-connector/shuttle",
  "nervix-execution/shuttle",
  "nervix-model-harness/shuttle",
  "nervix-primitives/shuttle",
]

[dependencies]
async-rs = { workspace = true }
async-trait = { workspace = true }
error-stack = { workspace = true }
futures-util = { workspace = true }
humantime = { workspace = true }
lapin = { workspace = true }
meticulous = { workspace = true }
nervix-connector = { workspace = true }
nervix-dns = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
nervix-recovery = { workspace = true }
rustls = { workspace = true }
shuttle = { workspace = true, optional = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
url = { workspace = true }

[dev-dependencies]
bolero = { workspace = true }
criterion = { workspace = true }
nervix-crypto = { workspace = true }
nervix-execution = { workspace = true }
nervix-model-harness = { workspace = true }
nervix-primitives = { workspace = true, features = ["native", "test-util"] }
nervix-test-environment = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }
tikv-jemallocator = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
] }
tokio-rustls = { workspace = true }

[[bench]]
harness = false
name = "publish"
required-features = ["benchmarks"]
