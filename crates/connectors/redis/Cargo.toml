[package]
description = "The Redis source and sink connector for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-redis"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = [
  "dep:shuttle",
  "nervix-connector/shuttle",
  "nervix-model-harness/shuttle",
  "nervix-primitives/shuttle",
]

[dependencies]
async-trait = { workspace = true }
bb8 = { workspace = true }
combine = { workspace = true }
error-stack = { workspace = true }
futures-util = { workspace = true }
meticulous = { workspace = true }
nervix-connector = { workspace = true }
nervix-dns = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
nervix-recovery = { workspace = true }
redis = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
shuttle = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "time"] }
tokio-rustls = { workspace = true }

[dev-dependencies]
nervix-model-harness = { workspace = true }
nervix-primitives = { workspace = true, features = ["test-util"] }
nervix-test-environment = { workspace = true }
tempfile = { workspace = true }
