[package]
description = "The Redis source and sink connector for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector-redis"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = [
  "dep:shuttle-tokio",
  "nervix-connector/shuttle",
  "nervix-primitives/shuttle",
  "shuttle-tokio/shuttle",
]

[dependencies]
async-trait = { workspace = true }
bb8 = { workspace = true }
error-stack = { workspace = true }
futures-util = { workspace = true }
nervix-connector = { workspace = true }
nervix-dns = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
redis = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
shuttle-tokio = { workspace = true, features = ["rt"], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "time"] }
tokio-rustls = { workspace = true }
triomphe = { workspace = true }

[dev-dependencies]
nervix-test-environment = { workspace = true }
tempfile = { workspace = true }
