[package]
description = "The compiled jaq engine and schemaless wire formats used by Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-jaq"
version.workspace = true

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
error-stack = { workspace = true }
jaq-core = { workspace = true }
jaq-fmts = { workspace = true }
jaq-json = { workspace = true, features = ["serde"] }
jaq-std = { workspace = true }
nervix-models = { workspace = true }
serde = { workspace = true }
# JAQ emits object members in declaration order, which is part of its public JSON output contract.
serde_json = { workspace = true, features = ["preserve_order"] }
strum = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
bolero = { workspace = true }
ciborium = { workspace = true }
meticulous = { workspace = true }
