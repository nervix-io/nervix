[package]
description = "Canonical formatter for Plexus source files"
edition.workspace = true
license-file.workspace = true
name = "nervix-plexus-format"
version.workspace = true

[lints]
workspace = true

[dependencies]
ariadne = { workspace = true }
clap = { workspace = true, features = ["derive"] }
error-stack = { workspace = true }
ignore = { workspace = true }
meticulous = { workspace = true }
nervix-models = { workspace = true }
nervix-plexus = { workspace = true, features = ["client"] }
nervix-primitives = { workspace = true }
nervix-recovery = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
bolero = { workspace = true }
nervix-arbitrary = { workspace = true }
nervix-plexus = { workspace = true, features = ["client"] }
