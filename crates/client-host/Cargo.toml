[package]
description = "The host session runtime every language binding of the Nervix client shares"
edition.workspace = true
license-file.workspace = true
name = "nervix-client-host"
version.workspace = true

[lints]
workspace = true

[dependencies]
arch-into = { workspace = true }
arrow-array = { workspace = true, features = ["ffi"] }
arrow-buffer = { workspace = true }
arrow-data = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
bytes = { workspace = true }
error-stack = { workspace = true }
meticulous = { workspace = true }
nervix-client-core = { workspace = true, features = ["arrow", "autocomplete"] }
nervix-models = { workspace = true, features = ["arrow"] }
nervix-primitives = { workspace = true, features = ["native"] }
nervix-recovery = { workspace = true }
strum = { workspace = true, features = ["derive"] }

[dev-dependencies]
bolero = { workspace = true }
nervix-arbitrary = { workspace = true }
uuid = { workspace = true }
