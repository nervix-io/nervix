[package]
description = "The contract between the Nervix host and its connector crates: source and sink contracts, host handles and boundary values"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = ["dep:shuttle-tokio", "shuttle-tokio/shuttle"]

[dependencies]
arrow-array = { workspace = true }
async-trait = { workspace = true }
error-stack = { workspace = true }
nervix-models = { workspace = true }
nervix-recovery = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
shuttle-tokio = { workspace = true, features = [
  "macros",
  "rt",
  "test-util",
  "time",
], optional = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
triomphe = { workspace = true }
upon = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
webpki-roots = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
