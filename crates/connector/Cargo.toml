[package]
description = "The contract between the Nervix host and its connector crates: source and sink contracts, host handles and boundary values"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = ["nervix-execution/shuttle", "nervix-primitives/shuttle"]

[dependencies]
arrow-array = { workspace = true }
async-trait = { workspace = true }
error-stack = { workspace = true }
meticulous = { workspace = true }
nervix-dns = { workspace = true }
nervix-execution = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
nervix-recovery = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
upon = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
webpki-roots = { workspace = true }

[dev-dependencies]
bolero = { workspace = true }
# The physical-deadline tests advance a paused clock.
nervix-primitives = { workspace = true, features = ["native", "test-util"] }
serde_json = { workspace = true }
