[package]
description = "The contract between the Nervix host and its connector crates: source and sink contracts, host handles and boundary values"
edition.workspace = true
license-file.workspace = true
name = "nervix-connector"
version.workspace = true

[lints]
workspace = true

[dependencies]
error-stack = { workspace = true }
nervix-models = { workspace = true }
nervix-recovery = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
# The runtime's Shuttle feature enables `tokio/shuttle` on this same wrapper, so physical deadlines
# stay on the scheduler-visible clock the runtime models.
tokio = { package = "shuttle-tokio", version = "1", features = ["time"] }
tracing = { workspace = true }
triomphe = { workspace = true }
upon = { workspace = true }
url = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { package = "shuttle-tokio", version = "1", features = [
  "macros",
  "rt",
  "test-util",
  "time",
] }
