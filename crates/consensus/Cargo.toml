[package]
description = "Raft replication of Nervix control-plane state: log store, state machine, snapshots and the peer network"
edition.workspace = true
license-file.workspace = true
name = "nervix-consensus"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = [
  "nervix-execution/shuttle",
  "nervix-interconnect/shuttle",
  "dep:shuttle-parking-lot",
  "dep:shuttle-tokio",
  "dep:shuttle-tokio-util",
  "shuttle-parking-lot/shuttle",
  "shuttle-tokio/shuttle",
  "shuttle-tokio-util/shuttle",
]
testing = []

[dependencies]
arch-into = { workspace = true }
blake3 = { workspace = true }
error-stack = { workspace = true }
fjall = { workspace = true }
futures-util = { workspace = true }
imbl = { workspace = true }
meticulous = { workspace = true }
nervix-execution = { workspace = true }
nervix-interconnect = { workspace = true }
nervix-models = { workspace = true }
nervix-recovery = { workspace = true }
openraft = { workspace = true }
parking_lot = { workspace = true }
rkyv = { workspace = true }
serde = { workspace = true }
shuttle-parking-lot = { workspace = true, optional = true }
shuttle-tokio = { workspace = true, features = [
  "full",
  "test-util",
], optional = true }
shuttle-tokio-util = { workspace = true, features = ["rt"], optional = true }
sorted-vec = { workspace = true }
storekey = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
triomphe = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
ubyte = { workspace = true }
