[package]
description = "Raft replication of Nervix control-plane state: log store, state machine, snapshots and the peer network"
edition.workspace = true
license-file.workspace = true
name = "nervix-consensus"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = [
  "nervix-execution/shuttle",
  "nervix-interconnect/shuttle",
  "parking_lot/shuttle",
  "tokio/shuttle",
  "tokio-util/shuttle",
]
testing = []

[dependencies]
arch-into = { workspace = true }
blake3 = { workspace = true }
error-stack = { workspace = true }
fjall = { workspace = true }
futures-util = { workspace = true }
imbl = { workspace = true }
meticulous = { workspace = true }
nervix-execution = { workspace = true }
nervix-interconnect = { workspace = true }
nervix-models = { workspace = true }
nervix-recovery = { workspace = true }
openraft = { workspace = true }
parking_lot = { package = "shuttle-parking_lot", version = "0.12" }
rkyv = { workspace = true }
serde = { workspace = true }
sorted-vec = { workspace = true }
storekey = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { package = "shuttle-tokio", version = "1", features = ["full"] }
tokio-util = { package = "shuttle-tokio-util", version = "0.7", features = [
  "rt",
] }
tracing = { workspace = true }
triomphe = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { package = "shuttle-tokio", version = "1", features = ["test-util"] }
ubyte = { workspace = true }
