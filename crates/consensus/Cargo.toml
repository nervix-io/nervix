[package]
description = "Raft replication of Nervix control-plane state: log store, state machine, snapshots and the peer network"
edition.workspace = true
license-file.workspace = true
name = "nervix-consensus"
version.workspace = true

[lints]
workspace = true

[features]
default = []
# Selects Loom's primitives for the whole graph, so a Loom model of a consensus owner runs on them.
loom = [
  "nervix-execution/loom",
  "nervix-interconnect/loom",
  "nervix-primitives/loom",
]
shuttle = [
  "nervix-execution/shuttle",
  "nervix-interconnect/shuttle",
  "nervix-primitives/shuttle",
  "nervix-model-harness/shuttle",
]
testing = []

[dependencies]
arch-into = { workspace = true }
blake3 = { workspace = true }
error-stack = { workspace = true }
fjall = { workspace = true }
futures-util = { workspace = true }
imbl = { workspace = true }
meticulous = { workspace = true }
nervix-execution = { workspace = true }
nervix-interconnect = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
nervix-recovery = { workspace = true }
openraft = { workspace = true }
rkyv = { workspace = true }
serde = { workspace = true }
sorted-vec = { workspace = true }
storekey = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[dev-dependencies]
alloc_count = { workspace = true }
bolero = { workspace = true }
nervix-arbitrary = { workspace = true }
nervix-model-harness = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
ubyte = { workspace = true }
