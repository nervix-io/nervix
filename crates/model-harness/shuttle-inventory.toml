# The Shuttle checks of production owners, by package.
#
# `just test-shuttle` lists the library tests whose full names contain `shuttle_` in every package
# below, built with its `shuttle` feature, and runs each in its own process: under the exploration
# the check declares, then under the uncontrolled-nondeterminism detector. A run over the whole
# inventory fails when a registered check is missing, ignored or did not complete its exploration,
# and when a discovered check is not registered here. A check is identified by its test's full name,
# which names the invariant it holds; a renamed or moved check is renamed here in the same change,
# and a new check joins its package's list.

