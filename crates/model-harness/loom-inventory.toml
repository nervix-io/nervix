# The Loom models of production owners, by invariant.
#
# `just test-loom` discovers every library test named `loom_*` in the packages listed below, built
# with their `loom` feature, and runs each in its own process. A run over the whole inventory fails
# when a registered invariant's test is missing, ignored or did not explore its model to exhaustion,
# and when a discovered model is not registered here. An invariant keeps its `id` when its test is
# renamed; update `test` in the same change.
#
# `just test-loom-qualification` applies each `[[qualification]]` weakening to a copy of the working
# tree and requires the named invariant's model to fail with the stated message. It proves the model
# detects the ordering fault it exists for, rather than passing because something else synchronizes
# its threads. A stack capacity check instead reduces its declared stack request. A qualification
# whose `original` text no longer appears exactly once fails too, so
# changing the owner's ordering means revisiting its qualification.

