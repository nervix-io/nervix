test = "runtime::backup_capture_fence::loom_models::loom_a_publisher_acquires_the_cut_generation"

[[qualification]]
failure = "the cut omitted a publication registered before it closed"
id = "server.backup.relaxed-publication-completion"
invariant = "server.backup.cut-includes-publication"
original = "self.fence.state.fetch_sub(1, Ordering::Release);"
path = "src/runtime/backup_capture_fence.rs"
weakened = "self.fence.state.fetch_sub(1, Ordering::Relaxed);"

[[qualification]]
failure = "a publisher observed the cut generation without its prior writes"
id = "server.backup.missing-publisher-acquire"
invariant = "server.backup.cut-generation"
original = ".compare_exchange_weak(state, state + 1, Ordering::AcqRel, Ordering::Relaxed)"
path = "src/runtime/backup_capture_fence.rs"
weakened = ".compare_exchange_weak(state, state + 1, Ordering::Release, Ordering::Relaxed)"

[[qualification]]
failure = "the cut omitted a publication registered before it closed"
id = "server.backup.relaxed-drain-observation"
invariant = "server.backup.cut-includes-publication"
original = "while fence.state.load(Ordering::Acquire) & ACTIVE != 0 {"
path = "src/runtime/backup_capture_fence.rs"
weakened = "while fence.state.load(Ordering::Relaxed) & ACTIVE != 0 {"

[[qualification]]
failure = "a publisher observed the cut generation without its prior writes"
id = "server.backup.relaxed-cut-close"
invariant = "server.backup.cut-generation"
original = "let previous = fence.state.fetch_or(CLOSED, Ordering::Release);"
path = "src/runtime/backup_capture_fence.rs"
weakened = "let previous = fence.state.fetch_or(CLOSED, Ordering::Relaxed);"

[[invariant]]
claim = "Concurrent runtime admission and transport cancellation choose exactly one irreversible relay verdict; later participants cannot overwrite the winner."
id = "interconnect.relay.irreversible-admission"
package = "nervix-interconnect"
test = "connection::relay_admission_choice::loom_models::loom_admission_and_cancellation_choose_one_irreversible_verdict"

[[qualification]]
failure = "admission verdict changed after its winning transition"
id = "interconnect.relay.overwriting-verdict"
invariant = "interconnect.relay.irreversible-admission"
original = ".compare_exchange(PENDING, choice, Ordering::AcqRel, Ordering::Acquire)\n            .is_ok()"
path = "crates/interconnect/src/connection/relay_admission_choice.rs"
weakened = ".swap(choice, Ordering::AcqRel) == PENDING"
