[package]
description = "How a model check of a production owner is explored, and the evidence each exploration leaves"
edition.workspace = true
license-file.workspace = true
name = "nervix-model-harness"
publish = false
version.workspace = true

[lints]
workspace = true

[features]
default = []
# Runs Loom models, and selects Loom's primitives for the whole graph through nervix-primitives.
# A crate with Loom models forwards its own `loom` feature here.
loom = [
  "dep:loom",
  "dep:tracing",
  "dep:tracing-subscriber",
  "nervix-primitives/loom",
]

[dependencies]
# The checkpoint records the schedule a failed execution took, so the failure can be replayed.
loom = { workspace = true, features = ["checkpoint"], optional = true }
nervix-primitives = { workspace = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = [
  "env-filter",
  "fmt",
], optional = true }
triomphe = { workspace = true }
