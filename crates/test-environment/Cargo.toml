[package]
description = "The external services the Nervix test and benchmark suites run against"
edition.workspace = true
name = "nervix-test-environment"
publish = false
version.workspace = true

[lints]
workspace = true

[dependencies]
arch-into = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
error-stack = { workspace = true }
hickory-proto = { workspace = true }
meticulous = { workspace = true }
nervix-recovery = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }
uuid = { workspace = true, features = ["v7"] }
