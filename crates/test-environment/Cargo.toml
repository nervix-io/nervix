[package]
description = "The external services the Nervix test and benchmark suites run against"
edition.workspace = true
name = "nervix-test-environment"
publish = false
version.workspace = true

[lints]
workspace = true

[dependencies]
arch-into = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
meticulous = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
