[package]
description = "The AWS-LC cryptography boundary for Nervix"
edition.workspace = true
license-file.workspace = true
name = "nervix-crypto"
version.workspace = true

[lints]
workspace = true

[features]
# AWS-LC's FIPS module beneath the boundary, for a service whose FIPS configuration embeds it:
# aws-lc-rs on aws-lc-fips-sys, the rustls FIPS provider, and the boundary's own native SHA-256
# context on the same module, so the build links that one module. No Nervix build enables it.
fips = ["aws-lc-rs/fips", "rustls/fips", "dep:aws-lc-fips-sys"]

[dependencies]
aws-lc-fips-sys = { workspace = true, optional = true }
aws-lc-rs = { workspace = true }
aws-lc-sys = { workspace = true }
error-stack = { workspace = true }
jsonwebtoken = { workspace = true }
meticulous = { workspace = true }
nervix-primitives = { workspace = true }
nervix-recovery = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
bolero = { workspace = true }
faster-hex = { workspace = true }
sha2 = { workspace = true }
