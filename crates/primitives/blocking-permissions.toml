# Every file whose own work blocks a thread rather than going through the bounded executor: on the
# runtime's blocking pool, `nervix_primitives::task::spawn_blocking`, or in place, on the runtime
# worker thread that calls `nervix_primitives::task::block_in_place`, or on a thread it creates through
# `thread::spawn`, `thread::Builder`, `thread::scope`, `thread::spawn_detached` or the real
# `unmodeled::thread::Builder`.
#
# A node runs its variable-size encoding, decoding, validation, hashing, compilation and synchronous
# filesystem or database work through `nervix-execution`, which admits it into a CPU or storage
# class, charges its memory and cancels it between bounded units; the executor's worker pools are
# the only built-in owner of the pool, for the storage jobs they admit, and nothing owns
# `block_in_place` by default. A permission names a file whose work stays outside the executor, the
# blocking items its owner names by their paths below `nervix_primitives`, the owner, why that owner
# cannot be admitted, and what bounds the work instead. A file whose owners block in different ways
# has a permission for each. `just validate-primitive-boundary` rejects a blocking item no
# permission lists for the file that names it, and a listed item the file no longer names.
# Thread declarations also state their count and lifetime bounds. Tests, models and harnesses
# declare each exact file and item; conditional compilation exempts nothing. The real builder
# needs its unmodeled permission as well, whose reason and verification limit do not replace its
# thread count, work and lifetime bound here.

[[permission]]
bound = "Three model threads per execution: two claim one fixed pool slot and one retires it; all are joined before the bounded Shuttle execution ends."
items = ["thread::spawn"]
owner = "The retained transport pool-slot lifetime model."
path = "crates/interconnect/src/connection/retained_slots_tests.rs"
reason = "These threads drive the production slot owner inside Shuttle's scheduler. They are model contenders, not node work admitted to the bounded executor."

