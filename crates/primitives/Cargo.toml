[package]
description = "The execution-sensitive primitives every Nervix crate obtains through one boundary, selected for ordinary execution or for a model checker"
edition.workspace = true
license-file.workspace = true
name = "nervix-primitives"
version.workspace = true

[lints]
workspace = true

[features]
default = []
# The native capability: operating-system threads, the async runtime and its tasks, and the
# synchronization, publication and concurrent-collection families built for them. A capability of
# native targets only: enabling it for a wasm target is a compile error rather than a primitive that
# fails when it is used.
native = [
  "dep:arc-swap",
  "dep:concurrent-queue",
  "dep:dashmap",
  "dep:nervix-primitives-macros",
  "dep:parking_lot",
  "dep:tokio",
  "dep:tokio-stream",
  "dep:tokio-util",
]
# The controls a test uses to pause, advance and resume a runtime's clock, so it can measure the
# elapsed-time behavior of a timer without waiting for it. A native capability that no production
# graph enables: Tokio's clock checks for a paused runtime only when it is compiled in.
test-util = ["native", "tokio/test-util"]
# The execution modes. Exactly one may be enabled in a dependency graph, and every crate that owns a
# mode feature forwards it here, so the whole graph uses one backend. Ordinary execution is the
# absence of all three.
loom = ["dep:loom"]
shuttle = [
  "dep:shuttle",
  "dep:shuttle-dashmap",
  "dep:shuttle-parking-lot",
  "dep:shuttle-tokio",
  "dep:shuttle-tokio-stream",
  "dep:shuttle-tokio-util",
  "shuttle-dashmap/shuttle",
  "shuttle-parking-lot/shuttle",
  "shuttle-tokio/shuttle",
  "shuttle-tokio-stream/shuttle",
  "shuttle-tokio-util/shuttle",
]
turmoil = ["dep:turmoil"]
# The diagnostic mode: the native capability's thread-blocking locks and condition variable are
# tracked by Deloxide's process-wide wait-for graph, and a process reports an active deadlock among
# them through `deadlock`. Unlike the three modes above it models nothing, so a binary that declares
# a diagnostic form builds and runs as a product does. It requires the `native` capability and is
# exclusive with every other mode.
deloxide = ["dep:deloxide", "dep:error-stack", "dep:nix", "dep:thiserror"]

[dependencies]
# The `futures` channels, `select!` and abort handles of the unmodeled surface, and the waker
# registration the native `sync` family selects.
futures-channel = { workspace = true }
futures-util = { workspace = true }
meticulous = { workspace = true }
# Shared ownership of Nervix-owned state, the same in every mode and on every target.
triomphe = { workspace = true }

# The libraries of the native capability and of every execution mode exist only for native targets.
# A wasm build that asks for either compiles none of them, so the boundary's own diagnostic is what
# fails it, rather than a dependency that cannot build for the browser.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
arc-swap = { workspace = true, optional = true }
concurrent-queue = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
deloxide = { workspace = true, optional = true }
error-stack = { workspace = true, optional = true }
loom = { workspace = true, optional = true }
nervix-primitives-macros = { workspace = true, optional = true }
# Silences Deloxide's start-up banner: standard output carries a node's logs and completion scripts.
nix = { workspace = true, features = ["fs"], optional = true }
parking_lot = { workspace = true, optional = true }
shuttle = { workspace = true, optional = true }
shuttle-dashmap = { workspace = true, optional = true }
shuttle-parking-lot = { workspace = true, optional = true }
shuttle-tokio = { workspace = true, features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
], optional = true }
shuttle-tokio-stream = { workspace = true, optional = true }
shuttle-tokio-util = { workspace = true, features = ["rt"], optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = [
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
], optional = true }
tokio-stream = { workspace = true, features = ["net"], optional = true }
tokio-util = { workspace = true, features = ["rt"], optional = true }
turmoil = { workspace = true, optional = true }
