[[permission]]
items = ["AtomicBool", "AtomicUsize", "Ordering"]
limit = "Records observe the node budget, the admission fence, and a forwarded batch's clearance and never synchronize them; the budget's and the quiesce control's own atomics are modeled, and the clearance travels on the endpoint's modeled channels."
owner = "The client ingestor's Shuttle checks."
path = "src/runtime/client_ingestor_shuttle_tests.rs"
reason = "Each record must change in the same scheduling step as the reservation, drain, or clearance it records, so recording adds no scheduling point."

[[permission]]
items = ["AtomicU64", "Ordering"]
limit = "Fixture bookkeeping that no invariant reads; no model builds these fixtures."
owner = "The application unit-test fixtures."
path = "src/application/test_fixtures.rs"
reason = "Test databases and node ports must differ across every unit test the process runs in parallel, so their identities outlive each test and each model execution."

[[permission]]
items = ["AtomicUsize", "Ordering"]
limit = "Runner bookkeeping that no model reads."
owner = "The Loom runner of nervix-model-harness."
path = "crates/model-harness/src/loom.rs"
reason = "The number of executions a search explored spans every execution and is reported after the search ends, where no modeled atomic can exist."

[[permission]]
items = ["AtomicBool", "Ordering"]
limit = "The epoch driver's shutdown is outside every model: no check covers when the thread observes the flag."
owner = "The WASM runtime's epoch driver."
path = "crates/nervix-wasm/src/lib.rs"
reason = "The flag stops a dedicated operating-system thread that no model runs, and a modeled atomic cannot be used from a thread outside its model."

[[permission]]
items = ["AtomicBool", "AtomicUsize", "Ordering"]
limit = "Benchmark statistics; the benchmark claims nothing about synchronization."
owner = "The VM benchmarks' allocation probe."
path = "crates/nervix-vm/benches/vm/allocation_probe.rs"
reason = "The global allocator counts every allocation of the process, on every thread, including the ones a model checker makes for itself."

