# Every use of `nervix_primitives::unmodeled`: a real atomic that stays outside every model.
#
# A permission names the file, the items it uses, the owner that needs a real atomic, why, and what
# the choice leaves unverified. `just validate-primitive-boundary` rejects an unmodeled use without a
# permission, an item a permission does not list, and a permission or listed item nothing uses. A
# real atomic may keep runner statistics, cross an external boundary, or record what a check
# observes. It never carries the protocol under test, chooses its branches, supplies its wakeups, or
# establishes an ordering an assertion relies on.

[[permission]]
items = ["AtomicUsize", "Ordering"]
limit = "Runner bookkeeping that no invariant reads."
owner = "The execution crate's Shuttle runner."
path = "crates/execution/src/tests.rs"
reason = "The highest step count spans every model execution the runner starts and is read after they end, where no modeled atomic can exist."

[[permission]]
items = ["AtomicUsize", "Ordering"]
limit = "Runner bookkeeping that no invariant reads."
owner = "The interconnect's Shuttle runner."
path = "crates/interconnect/src/shuttle_test.rs"
reason = "The highest step count spans every model execution the runner starts and is read after they end, where no modeled atomic can exist."

[[permission]]
items = ["AtomicUsize", "Ordering"]
