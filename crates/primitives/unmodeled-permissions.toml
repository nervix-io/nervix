[[permission]]
items = [
  "sync::atomic::AtomicBool",
  "sync::atomic::Ordering",
  "task_local",
  "thread::Builder",
  "thread::sleep",
]
limit = "The epoch driver and a guest callback's time scope are outside every model: no check covers when the epoch thread observes the flag, and under Shuttle every task shares the storage a time scope sets while it is polled."
owner = "The WASM runtime: its epoch driver, and the domain time of a guest callback."
path = "crates/nervix-wasm/src/lib.rs"
reason = "The epoch driver is a dedicated operating-system thread that no model runs, sleeping for real between ticks and stopped by a flag a modeled atomic could not share with it. A guest callback reads its domain time from Tokio's task-local storage, which no model provides."

