# Every use of `nervix_primitives::unmodeled`: a real primitive that stays outside every model.
#
# A permission names the file, the items it uses by their paths below `unmodeled`, the owner that
# needs a real primitive, why, and what the choice leaves unverified. `just validate-primitive-boundary`
# rejects an unmodeled use without a permission, an item a permission does not list, and a permission
# or listed item nothing uses. A real primitive may keep runner statistics, cross an external
# boundary, serve a thread or process-wide state no model runs, or record what a check observes. It
# never carries the protocol under test, chooses its branches, supplies its wakeups, or establishes
# an ordering an assertion relies on.

[[permission]]
items = ["sync::atomic::AtomicUsize", "sync::atomic::Ordering"]
limit = "Runner bookkeeping that no invariant reads."
owner = "The execution crate's Shuttle runner."
path = "crates/execution/src/tests.rs"
reason = "The highest step count spans every model execution the runner starts and is read after they end, where no modeled atomic can exist."

