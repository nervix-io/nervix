limit = "Nothing the binding does runs in a model; the client protocol it drives has its own checks through the Rust client."
owner = "The C binding's session."
path = "crates/client-ffi/src/session.rs"
reason = "The binding owns the runtime its host's threads enter, and entering it and shutting it down in the background are the binding's contract with the host, which Shuttle's runtime does not provide."

[[permission]]
items = [
  "select",
  "sync::Mutex",
  "sync::mpsc",
  "sync::watch",
  "task::consume_budget",
  "task::spawn",
  "time::sleep",
]
limit = "Cluster membership gossip is outside every model: no check covers chitchat or the transport tasks it drives."
owner = "The cluster membership transport."
path = "src/cluster.rs"
reason = "Chitchat hands out Tokio's own lock and watch receiver and runs on Tokio's runtime, so the transport tasks it drives wait on Tokio's primitives."

