[package]
description = "Authenticated node-to-node HTTP/2 pools for Nervix clusters"
edition.workspace = true
license-file.workspace = true
name = "nervix-interconnect"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = [
  "dep:shuttle",
  "nervix-execution/shuttle",
  "nervix-model-harness/shuttle",
  "nervix-primitives/shuttle",
]
turmoil = [
  "dep:turmoil",
  "nervix-execution/turmoil",
  "nervix-primitives/turmoil",
]

[[test]]
name = "simulation"
path = "tests/simulation.rs"
required-features = ["turmoil"]

[dependencies]
ahash = { workspace = true }
arch-into = { workspace = true }
bytes = { workspace = true }
error-stack = { workspace = true }
fastrand = { workspace = true }
futures-util = { workspace = true }
h2 = { workspace = true }
http = { workspace = true }
meticulous = { workspace = true }
nervix-dns = { workspace = true }
nervix-execution = { workspace = true }
nervix-models = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
nervix-recovery = { workspace = true }
percent-encoding = { workspace = true }
rand_core = { workspace = true }
rkyv = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
shuttle = { workspace = true, optional = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
turmoil = { workspace = true, optional = true }
url = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
alloc_count = { workspace = true }
arrow-array = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }
humantime = { workspace = true }
nervix-model-harness = { workspace = true }
rcgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
ubyte = { workspace = true }
