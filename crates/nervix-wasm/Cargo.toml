[package]
description = "Wasmtime host for Nervix WASM processors: instances, limits, epoch deadlines and the guest ABI"
edition.workspace = true
license-file.workspace = true
name = "nervix-wasm"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = ["parking_lot/shuttle", "tokio/shuttle"]

[dependencies]
arch-into = { workspace = true }
bytes = { workspace = true }
error-stack = { workspace = true }
flatbuffers = { workspace = true }
meticulous = { workspace = true }
nervix-models = { workspace = true }
nervix-recovery = { workspace = true }
nervix-wasm-protocol = { workspace = true }
nonzero_ext = { workspace = true }
parking_lot = { package = "shuttle-parking_lot", version = "0.12" }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { package = "shuttle-tokio", version = "1", features = ["rt", "sync"] }
triomphe = { workspace = true }
wasmtime = { workspace = true }

[dev-dependencies]
arrow-array = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }
tokio = { package = "shuttle-tokio", version = "1", features = [
  "macros",
  "rt",
  "sync",
  "time",
] }
