[package]
description = "Bounded execution and transient-memory admission for a Nervix node: worker classes, byte budgets and cancellation"
edition.workspace = true
license-file.workspace = true
name = "nervix-execution"
version.workspace = true

[lints]
workspace = true

[features]
default = []
# Runs the cancellation protocol's Loom models, with Loom's primitives selected for the whole graph.
loom = ["nervix-model-harness/loom", "nervix-primitives/loom"]
shuttle = [
  "dep:shuttle",
  "dep:shuttle-tokio",
  "nervix-primitives/shuttle",
  "shuttle-tokio/shuttle",
]
turmoil = ["dep:turmoil", "nervix-primitives/turmoil"]

[dependencies]
arch-into = { workspace = true }
error-stack = { workspace = true }
meticulous = { workspace = true }
nervix-primitives = { workspace = true, features = ["native"] }
shuttle = { workspace = true, optional = true }
shuttle-tokio = { workspace = true, features = [
  "full",
  "test-util",
], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
triomphe = { workspace = true }
turmoil = { workspace = true, optional = true }
ubyte = { workspace = true }

[dev-dependencies]
nervix-model-harness = { workspace = true }
# The cancellation models run their participants as threads of the selected model.
nervix-primitives = { workspace = true, features = ["native"] }
tokio = { workspace = true, features = ["full", "test-util"] }
