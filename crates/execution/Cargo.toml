[package]
description = "Bounded execution and transient-memory admission for a Nervix node: worker classes, byte budgets and cancellation"
edition.workspace = true
license-file.workspace = true
name = "nervix-execution"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = [
  "dep:shuttle",
  "dep:shuttle-dashmap",
  "dep:shuttle-parking-lot",
  "dep:shuttle-tokio",
  "dep:shuttle-tokio-util",
  "shuttle-dashmap/shuttle",
  "shuttle-parking-lot/shuttle",
  "shuttle-tokio/shuttle",
  "shuttle-tokio-util/shuttle",
]

[dependencies]
arc-swap = { workspace = true }
arch-into = { workspace = true }
dashmap = { workspace = true }
error-stack = { workspace = true }
meticulous = { workspace = true }
parking_lot = { workspace = true }
shuttle = { workspace = true, optional = true }
shuttle-dashmap = { workspace = true, optional = true }
shuttle-parking-lot = { workspace = true, optional = true }
shuttle-tokio = { workspace = true, features = [
  "full",
  "test-util",
], optional = true }
shuttle-tokio-util = { workspace = true, features = ["rt"], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["rt"] }
triomphe = { workspace = true }
ubyte = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
