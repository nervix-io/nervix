[package]
description = "Bounded execution and transient-memory admission for a Nervix node: worker classes, byte budgets and cancellation"
edition.workspace = true
license-file.workspace = true
name = "nervix-execution"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = [
  "dashmap/shuttle",
  "dep:shuttle",
  "parking_lot/shuttle",
  "tokio/shuttle",
  "tokio-util/shuttle",
]

[dependencies]
arc-swap = { workspace = true }
arch-into = { workspace = true }
dashmap = { package = "shuttle-dashmap", version = "6" }
error-stack = { workspace = true }
meticulous = { workspace = true }
parking_lot = { package = "shuttle-parking_lot", version = "0.12" }
shuttle = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { package = "shuttle-tokio", version = "1", features = ["full"] }
tokio-util = { package = "shuttle-tokio-util", version = "0.7", features = [
  "rt",
] }
triomphe = { workspace = true }
ubyte = { workspace = true }

[dev-dependencies]
tokio = { package = "shuttle-tokio", version = "1", features = [
  "full",
  "test-util",
] }
