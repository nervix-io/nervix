[package]
description = "Bounded execution and transient-memory admission for a Nervix node: worker classes, byte budgets and cancellation"
edition.workspace = true
license-file.workspace = true
name = "nervix-execution"
version.workspace = true

[lints]
workspace = true

[features]
default = []
shuttle = ["tokio/shuttle"]

[dependencies]
arch-into = { workspace = true }
error-stack = { workspace = true }
meticulous = { workspace = true }
thiserror = { workspace = true }
tokio = { package = "shuttle-tokio", version = "1", features = ["full"] }
triomphe = { workspace = true }
ubyte = { workspace = true }

[dev-dependencies]
parking_lot = { workspace = true }
shuttle = { workspace = true }
tokio = { package = "shuttle-tokio", version = "1", features = [
  "full",
  "test-util",
] }
