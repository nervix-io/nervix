# Reviewed transport explanations for absent capabilities and directional differences.
# Capability facts come only from the compiled vocabulary; stale explanation keys fail validation.

[entity."CLIENT PRODUCER"]
ingest_headers = "Native Arrow batches cross an application session; producers submit batches and consumers explicitly acknowledge delivery attempts, with no broker envelope."
ingest_locator = "The body references the native schema; there is no external topic, queue or table to locate."
metadata = "Application batches carry their declared schema; there is no separate transport metadata namespace."
mirror = "Native Arrow batches cross an application session; producers submit batches and consumers explicitly acknowledge delivery attempts, with no broker envelope."

[entity."HTTP REQUEST"]
emit_locator = "The client's endpoint names the origin, and each record's PATH expression names its target beneath it; PATH is a request option rather than an external-name locator."
envelope = "This implementation maps payloads and declared headers; it declares no additional per-record envelope clauses for this entity."
ingest_locator = "The client's endpoint URL names the polled resource, its path and query included, so this body has no separate external-name locator."
mirror = "Polling writes its whole request in the statement, a literal METHOD and HEADERS of literals or client secrets, and sends it to the client's endpoint URL as written; HEADERS is ingest-only. Emitting computes METHOD and PATH for each record as expressions beneath an origin endpoint and writes headers with write_header; PATH is emit-only. Polling reads the response's headers, status and due instant, while an emitter reads only whether its final response headers deliver, retry or reject the record. Both directions share one HTTP CLIENT transport: timeout_ms and the follow_redirects and proxy opt-ins."
properties = "This entity declares no typed PROPERTIES block; any encoded record fields belong to its payload or VALUES mapping."

[entity."HTTP ENDPOINT"]
ingest_locator = "The endpoint declaration owns the host and path this cluster serves; this body has no separate external-name locator."
mirror = "An endpoint is the server side: every live node serves it, its requests carry no remote transport position, and their headers and method, path, query, peer address and host metadata describe what a client sent. The HTTP REQUEST emitter instead sends requests to an external endpoint through an HTTP CLIENT."

[entity."KAFKA TOPIC"]
mirror = "Consumption tracks replayable log offsets and consumer groups; ACK consumption waits for commit confirmation, while publication uses a producer queue or delivery report. Both directions use the same quoted, case-preserving Kafka topic names and a client with bootstrap.servers. Nervix-owned client keys are refused; other driver properties are checked offline under one accepted name each. Consumers disable topic auto-creation, while producers retain the driver default, so provision input and output topics explicitly."
properties = "This entity declares no typed PROPERTIES block; any encoded record fields belong to its payload or VALUES mapping."

[entity."PULSAR TOPIC"]
mirror = "SUBSCRIPTION, TYPE and INSTANCES configure ingestion only: subscription ownership and an owned subscription's EARLIEST or LATEST position govern creation, while existing cursors prevail. TIMESTAMP and DELIVER AFTER are emitter envelope clauses; an ingestor selects a received time with TIMESTAMP AT. Ingestion reads ordered, repeated properties, while publication keeps the last value written for each property name and uses a producer receipt. Both directions use the same quoted, case-preserving local or fully qualified Pulsar topic names and the same client configuration."
properties = "This entity declares no typed PROPERTIES block; any encoded record fields belong to its payload or VALUES mapping."

[entity."MQTT TOPIC"]
mirror = "Both directions declare QOS 0, 1 or 2 independently of MODE. Consumption alone declares SESSION: NO ACK accepts every session/QoS pairing, while ACK SEQUENTIAL, ACK PARALLEL and SUSPEND require SESSION PERSISTENT with QOS 1 or 2. Every ingestor joins a Nervix-managed shared subscription, so its broker must support shared subscriptions. Publication pairs QOS 0 with NO ACK and QOS 1 or 2 with an ACK mode; its clean or persistent session follows QoS without a SESSION clause. Consumption reads the delivered packet's metadata and ordered, repeated user properties; publication writes RETAIN, exact MQTT 5 publish properties and ordered, repeated user properties. Both directions keep the written case of topic names."

[entity."NATS SUBJECT"]
mirror = "Core NATS on both sides. A subject ingestor joins a queue group, so the server hands each message to one of its members, and reads in NO ACK with no position to resume from; QUEUE GROUP and INSTANCES are ingest-only. A subject emitter publishes in NO ACK and completes once its client has flushed the write, without a server answer; REPLY TO is emit-only. JetStream is the NATS STREAM entity on each side: a stream also stores a Core publication to one of its subjects, and a subscription also receives a JetStream publication to its subject. Both directions use quoted, case-preserving subjects; publication subjects exclude subscription wildcards."
properties = "This entity declares no typed PROPERTIES block; any encoded record fields belong to its payload or VALUES mapping."

[entity."NATS STREAM"]
mirror = "JetStream on both sides. A stream ingestor reads an operator-provisioned stream through a durable pull consumer, which keeps the position, and settles each delivery with an acknowledgement or negative acknowledgement the server answers; CONSUMER is ingest-only. A stream emitter publishes to one literal subject its operator-provisioned stream captures, names that stream in each message's expected-stream header and waits for the PubAck that says the stream stored it; SUBJECT and MESSAGE ID are emit-only. Core NATS is the NATS SUBJECT entity on each side: a stream ingestor also reads what a subject emitter published to one of the stream's subjects, and a subject ingestor also receives what a stream emitter publishes to its subject."
properties = "This entity declares no typed PROPERTIES block; its MESSAGE ID envelope and written headers travel with the payload."

[entity."RABBITMQ QUEUE"]
mirror = "Consumption chooses automatic NO ACK or per-delivery acknowledgement with prefetch one under ACK SEQUENTIAL and MAX under ACK PARALLEL; prefetch is ingest-only and scoped to each instance. Queue publication uses the default exchange with the queue name as its routing key, and waits for a channel round trip under NO ACK or publisher confirms under ACK. PERSISTENT, MANDATORY, TIMESTAMP and PROPERTIES are emit-only; consumption reads the delivered envelope and properties through metadata. Both directions preserve quoted queue names and use sorted_by_name headers with exact names."

[entity."RABBITMQ EXCHANGE"]
mirror = "No ingestor consumes an exchange: provision its bindings and consume a bound queue with RABBITMQ QUEUE. ROUTING KEY and MANDATORY are emit-only: each record computes its routing key, and MANDATORY rejects an unroutable message instead of letting the broker drop it. Publication shares the queue emitter's modes, persistence, timestamp, properties and sorted_by_name headers with exact names; consumer prefetch belongs only to the queue ingestor."

[entity."REDIS PUBSUB"]
emit_headers = "Redis Pub/Sub carries a channel and a payload, and for a pattern subscription the pattern that matched, but no headers. A subscription has no acknowledgement; PUBLISH answers with a subscriber count rather than a delivery receipt. An ingestor subscribes to a quoted channel or channel pattern and an emitter publishes to a quoted channel, each case-preserving."
envelope = "This implementation maps payloads; it declares no additional per-record envelope clauses for this entity."
ingest_headers = "Redis Pub/Sub carries a channel and a payload, and for a pattern subscription the pattern that matched, but no headers. A subscription has no acknowledgement; PUBLISH answers with a subscriber count rather than a delivery receipt. An ingestor subscribes to a quoted channel or channel pattern and an emitter publishes to a quoted channel, each case-preserving."
mirror = "Redis Pub/Sub carries a channel and a payload, and for a pattern subscription the pattern that matched, but no headers. A subscription has no acknowledgement; PUBLISH answers with a subscriber count rather than a delivery receipt. An ingestor subscribes to a quoted channel or channel pattern and an emitter publishes to a quoted channel, each case-preserving."
properties = "This entity declares no typed PROPERTIES block; any encoded record fields belong to its payload or VALUES mapping."

[entity."PROMETHEUS QUERY"]
ingest_headers = "An HTTP response's headers describe a whole answer rather than one of its samples, and each sample's labels travel in its payload under metric, so a query ingestor reads no transport headers."
ingest_locator = "QUERY is a PromQL expression option rather than an external entity name."
mirror = "The Prometheus query API is polled for samples; no Prometheus remote-write emitter is declared."

