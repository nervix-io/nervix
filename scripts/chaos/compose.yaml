x-nervix-environment: &nervix-environment
  NERVIX_ADDR: 0.0.0.0:47391
  NERVIX_WEB_CONSOLE_LISTEN_ADDR: 0.0.0.0:47420
  NERVIX_OBSERVABILITY_LISTEN_ADDR: 0.0.0.0:9090
  NERVIX_CLUSTER_ID: ${CHAOS_CLUSTER_ID:?CHAOS_CLUSTER_ID is required}
  NERVIX_INTERCONNECT_LISTEN_ADDR: 0.0.0.0:47395
  NERVIX_INTERCONNECT_TLS_CA: /etc/nervix/interconnect/ca.pem
  NERVIX_INTERCONNECT_TLS_CERT: /etc/nervix/interconnect/node.pem
  NERVIX_INTERCONNECT_TLS_KEY: /etc/nervix/interconnect/node-key.pem
  NERVIX_REPLICA_COUNT: ${CHAOS_REPLICA_COUNT:-0}
  NERVIX_STATE_SNAPSHOT_INTERVAL: ${CHAOS_STATE_SNAPSHOT_INTERVAL:-30s}
  NERVIX_RAFT_HEARTBEAT_INTERVAL: ${CHAOS_RAFT_HEARTBEAT_INTERVAL:-250ms}
  NERVIX_NODE_UNAVAILABILITY_TIMEOUT: ${CHAOS_NODE_UNAVAILABILITY_TIMEOUT:-10s}
  NERVIX_RAFT_SNAPSHOT_ENTRY_THRESHOLD: ${CHAOS_RAFT_SNAPSHOT_ENTRY_THRESHOLD:-10000}
  NERVIX_RAFT_COVERED_LOG_ENTRIES_RETAINED: ${CHAOS_RAFT_COVERED_LOG_ENTRIES_RETAINED:-1000}
  NERVIX_COMMAND_RETRY_VALIDITY: ${CHAOS_COMMAND_RETRY_VALIDITY:-15m}
  RUST_LOG: nervix=info

x-nervix-service: &nervix-service
  image: ${NERVIX_IMAGE:?NERVIX_IMAGE is required}
  init: true
  restart: "no"
  stop_grace_period: 60s
  logging:
    driver: local
    options:
      max-file: "2"
      max-size: 2m

x-run-labels: &run-labels
  io.nervix.chaos.run: ${CHAOS_RUN_ID:?CHAOS_RUN_ID is required}

services:
  broker:
    image: ${CHAOS_KAFKA_IMAGE:?CHAOS_KAFKA_IMAGE is required}
    hostname: broker
    restart: "no"
    labels:
      <<: *run-labels
      io.nervix.chaos.role: broker
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    logging:
      driver: local
      options:
        max-file: "2"
        max-size: 2m
    networks:
      - chaos

  nervix-1:
    <<: *nervix-service
    hostname: nervix-1
    networks:
      chaos:
        ipv4_address: ${CHAOS_NODE_1_ADDRESS:?CHAOS_NODE_1_ADDRESS is required}
    labels:
      <<: *run-labels
      io.nervix.chaos.role: node
      io.nervix.chaos.target: "true"
    environment:
      <<: *nervix-environment
      NERVIX_NODE_ID: node-1
      NERVIX_GRPC_ADVERTISE_ADDR: nervix-1:47391
      NERVIX_WEB_CONSOLE_ADVERTISE_ADDR: nervix-1:47420
      NERVIX_INTERCONNECT_ADVERTISE_ADDR: nervix-1:47395
      NERVIX_ALLOW_BOOTSTRAP: "true"
      NERVIX_INIT_DEFAULT_USER_PASSWORD: ${CHAOS_PASSWORD:?CHAOS_PASSWORD is required}
    volumes:
      - node-1-data:/var/lib/nervix
      - ${CHAOS_TLS_DIR:?CHAOS_TLS_DIR is required}/ca.pem:/etc/nervix/interconnect/ca.pem:ro
      - ${CHAOS_TLS_DIR:?CHAOS_TLS_DIR is required}/node-1.pem:/etc/nervix/interconnect/node.pem:ro
      - ${CHAOS_TLS_DIR:?CHAOS_TLS_DIR is required}/node-1-key.pem:/etc/nervix/interconnect/node-key.pem:ro

  nervix-2:
    <<: *nervix-service
    hostname: nervix-2
    networks:
      chaos:
        ipv4_address: ${CHAOS_NODE_2_ADDRESS:?CHAOS_NODE_2_ADDRESS is required}
    profiles:
      - three-node
    depends_on:
      - nervix-1
    labels:
      <<: *run-labels
      io.nervix.chaos.role: node
      io.nervix.chaos.target: "true"
    environment:
      <<: *nervix-environment
      NERVIX_NODE_ID: node-2
      NERVIX_GRPC_ADVERTISE_ADDR: nervix-2:47391
      NERVIX_WEB_CONSOLE_ADVERTISE_ADDR: nervix-2:47420
      NERVIX_INTERCONNECT_ADVERTISE_ADDR: nervix-2:47395
      NERVIX_CLUSTER_BOOTSTRAP_HOST: nervix-1:47395
    volumes:
      - node-2-data:/var/lib/nervix
      - ${CHAOS_TLS_DIR:?CHAOS_TLS_DIR is required}/ca.pem:/etc/nervix/interconnect/ca.pem:ro
      - ${CHAOS_TLS_DIR:?CHAOS_TLS_DIR is required}/node-2.pem:/etc/nervix/interconnect/node.pem:ro
      - ${CHAOS_TLS_DIR:?CHAOS_TLS_DIR is required}/node-2-key.pem:/etc/nervix/interconnect/node-key.pem:ro

  nervix-3:
    <<: *nervix-service
    hostname: nervix-3
    networks:
      chaos:
        ipv4_address: ${CHAOS_NODE_3_ADDRESS:?CHAOS_NODE_3_ADDRESS is required}
    profiles:
      - three-node
    depends_on:
      - nervix-1
    labels:
      <<: *run-labels
      io.nervix.chaos.role: node
      io.nervix.chaos.target: "true"
    environment:
      <<: *nervix-environment
      NERVIX_NODE_ID: node-3
      NERVIX_GRPC_ADVERTISE_ADDR: nervix-3:47391
      NERVIX_WEB_CONSOLE_ADVERTISE_ADDR: nervix-3:47420
      NERVIX_INTERCONNECT_ADVERTISE_ADDR: nervix-3:47395
      NERVIX_CLUSTER_BOOTSTRAP_HOST: nervix-1:47395
    volumes:
      - node-3-data:/var/lib/nervix
      - ${CHAOS_TLS_DIR:?CHAOS_TLS_DIR is required}/ca.pem:/etc/nervix/interconnect/ca.pem:ro
      - ${CHAOS_TLS_DIR:?CHAOS_TLS_DIR is required}/node-3.pem:/etc/nervix/interconnect/node.pem:ro
      - ${CHAOS_TLS_DIR:?CHAOS_TLS_DIR is required}/node-3-key.pem:/etc/nervix/interconnect/node-key.pem:ro

  admin:
    image: ${NERVIX_IMAGE:?NERVIX_IMAGE is required}
    profiles:
      - tools
    entrypoint: []
    labels:
      <<: *run-labels
      io.nervix.chaos.role: admin
    environment:
      NERVIX_PASSWORD: ${CHAOS_PASSWORD:?CHAOS_PASSWORD is required}
    tmpfs:
      - /var/lib/nervix
    networks:
      - chaos

  broker-admin:
    image: ${CHAOS_KAFKA_IMAGE:?CHAOS_KAFKA_IMAGE is required}
    profiles:
      - tools
    entrypoint: []
    labels:
      <<: *run-labels
      io.nervix.chaos.role: broker-admin
    networks:
      - chaos

  kcat:
    image: ${CHAOS_KCAT_IMAGE:?CHAOS_KCAT_IMAGE is required}
    profiles:
      - tools
    entrypoint:
      - kcat
    labels:
      <<: *run-labels
      io.nervix.chaos.role: traffic
    networks:
      - chaos

  probe:
    image: ${CHAOS_PROBE_IMAGE:?CHAOS_PROBE_IMAGE is required}
    profiles:
      - tools
    entrypoint: []
    labels:
      <<: *run-labels
      io.nervix.chaos.role: observer
    networks:
      - chaos

  load:
    image: ${CHAOS_KCAT_IMAGE:?CHAOS_KCAT_IMAGE is required}
    profiles:
      - rolling
    entrypoint:
      - /bin/sh
      - /opt/chaos/continuous-load.sh
    labels:
      <<: *run-labels
      io.nervix.chaos.role: load
    environment:
      CHAOS_LOAD_INTERVAL_MS: ${CHAOS_LOAD_INTERVAL_MS:?CHAOS_LOAD_INTERVAL_MS is required}
    volumes:
      - ${CHAOS_SCRIPT_DIR:?CHAOS_SCRIPT_DIR is required}/continuous-load.sh:/opt/chaos/continuous-load.sh:ro
      - ${CHAOS_LOAD_FILE:?CHAOS_LOAD_FILE is required}:/opt/chaos/input.ndjson:ro
      - ${CHAOS_TRAFFIC_DIR:?CHAOS_TRAFFIC_DIR is required}:/opt/chaos/traffic:ro
    logging:
      driver: local
      options:
        max-file: "2"
        max-size: 2m
    networks:
      - chaos

  state-load:
    image: ${CHAOS_KCAT_IMAGE:?CHAOS_KCAT_IMAGE is required}
    profiles:
      - stateful
    entrypoint:
      - /bin/sh
      - /opt/chaos/continuous-load.sh
    labels:
      <<: *run-labels
      io.nervix.chaos.role: load
    environment:
      CHAOS_LOAD_INTERVAL_MS: ${CHAOS_STATE_LOAD_INTERVAL_MS:?CHAOS_STATE_LOAD_INTERVAL_MS is required}
      CHAOS_LOAD_TOPIC: chaos_state_input
      CHAOS_LOAD_STOP_FILE: stop-state-load
      CHAOS_LOAD_HOLD_FILE: hold-state-load
    volumes:
      - ${CHAOS_SCRIPT_DIR:?CHAOS_SCRIPT_DIR is required}/continuous-load.sh:/opt/chaos/continuous-load.sh:ro
      - ${CHAOS_STATE_LOAD_FILE:?CHAOS_STATE_LOAD_FILE is required}:/opt/chaos/input.ndjson:ro
      - ${CHAOS_TRAFFIC_DIR:?CHAOS_TRAFFIC_DIR is required}:/opt/chaos/traffic:ro
    logging:
      driver: local
      options:
        max-file: "2"
        max-size: 2m
    networks:
      - chaos

  paced-load:
    image: ${CHAOS_KCAT_IMAGE:?CHAOS_KCAT_IMAGE is required}
    profiles:
      - paced
    entrypoint:
      - /bin/sh
      - /opt/chaos/continuous-load.sh
    labels:
      <<: *run-labels
      io.nervix.chaos.role: load
    environment:
      CHAOS_LOAD_INTERVAL_MS: ${CHAOS_PACED_LOAD_INTERVAL_MS:?CHAOS_PACED_LOAD_INTERVAL_MS is required}
      CHAOS_LOAD_TOPIC: chaos_paced_input
      CHAOS_LOAD_STOP_FILE: stop-paced-load
    volumes:
      - ${CHAOS_SCRIPT_DIR:?CHAOS_SCRIPT_DIR is required}/continuous-load.sh:/opt/chaos/continuous-load.sh:ro
      - ${CHAOS_PACED_LOAD_FILE:?CHAOS_PACED_LOAD_FILE is required}:/opt/chaos/input.ndjson:ro
      - ${CHAOS_TRAFFIC_DIR:?CHAOS_TRAFFIC_DIR is required}:/opt/chaos/traffic:ro
    logging:
      driver: local
      options:
        max-file: "2"
        max-size: 2m
    networks:
      - chaos

  # The PostgreSQL server the lifetimes scenario's pooled emitters write to. Its data lives in memory
  # for the run only.
  postgres:
    image: ${CHAOS_POSTGRES_IMAGE:?CHAOS_POSTGRES_IMAGE is required}
    profiles:
      - lifetimes
    labels:
      <<: *run-labels
      io.nervix.chaos.role: database
    environment:
      POSTGRES_PASSWORD: nervix
    tmpfs:
      - /var/lib/postgresql/data
    logging:
      driver: local
      options:
        max-file: "2"
        max-size: 2m
    networks:
      - chaos

  life-load:
    image: ${CHAOS_KCAT_IMAGE:?CHAOS_KCAT_IMAGE is required}
    profiles:
      - lifetimes
    entrypoint:
      - /bin/sh
      - /opt/chaos/continuous-load.sh
    labels:
      <<: *run-labels
      io.nervix.chaos.role: load
    environment:
      CHAOS_LOAD_INTERVAL_MS: ${CHAOS_LIFE_LOAD_INTERVAL_MS:?CHAOS_LIFE_LOAD_INTERVAL_MS is required}
      CHAOS_LOAD_TOPIC: chaos_life_input
      CHAOS_LOAD_STOP_FILE: stop-life-load
      CHAOS_LOAD_HOLD_FILE: hold-life-load
    volumes:
      - ${CHAOS_SCRIPT_DIR:?CHAOS_SCRIPT_DIR is required}/continuous-load.sh:/opt/chaos/continuous-load.sh:ro
      - ${CHAOS_LIFE_LOAD_FILE:?CHAOS_LIFE_LOAD_FILE is required}:/opt/chaos/input.ndjson:ro
      - ${CHAOS_TRAFFIC_DIR:?CHAOS_TRAFFIC_DIR is required}:/opt/chaos/traffic:ro
    logging:
      driver: local
      options:
        max-file: "2"
        max-size: 2m
    networks:
      - chaos

  # The endpoint client posts the endpoints scenario's records to every node's HTTP listener and
  # writes its ledger of attempts to its log; the runner holds and releases it through the control
  # files of its read-only endpoint directory.
  endpoint-load:
    image: ${CHAOS_PYTHON_IMAGE:?CHAOS_PYTHON_IMAGE is required}
    profiles:
      - endpoints
    entrypoint:
      - python3
      - -I
      - /opt/chaos/endpoint-client.py
      - http
      - --host
      - chaos-edge.example
      - --path
      - /events
      - --targets
      - ${CHAOS_ENDPOINT_TARGETS:-nervix-1:8080}
      - --interval-ms
      - ${CHAOS_ENDPOINT_INTERVAL_MS:?CHAOS_ENDPOINT_INTERVAL_MS is required}
      - --input
      - /opt/chaos/endpoints/http-input.ndjson
      - --control
      - /opt/chaos/endpoints/control
    labels:
      <<: *run-labels
      io.nervix.chaos.role: load
    volumes:
      - ${CHAOS_SCRIPT_DIR:?CHAOS_SCRIPT_DIR is required}/endpoint-client.py:/opt/chaos/endpoint-client.py:ro
      - ${CHAOS_ENDPOINT_DIR:?CHAOS_ENDPOINT_DIR is required}:/opt/chaos/endpoints:ro
    logging:
      driver: local
      options:
        max-file: "2"
        max-size: 2m
    networks:
      - chaos

  # The WebSocket client keeps one connection to CHAOS_ENDPOINT_WEBSOCKET_TARGET open across the
  # replacement of its source, then opens a new one.
  endpoint-websocket:
    image: ${CHAOS_PYTHON_IMAGE:?CHAOS_PYTHON_IMAGE is required}
    profiles:
      - endpoints
    entrypoint:
      - python3
      - -I
      - /opt/chaos/endpoint-client.py
      - websocket
      - --host
      - chaos-edge.example
      - --path
      - /stream
      - --target
      - ${CHAOS_ENDPOINT_WEBSOCKET_TARGET:-nervix-1:8080}
      - --interval-ms
      - "100"
      - --retained-records
      - "20"
      - --input
      - /opt/chaos/endpoints/frame-input.ndjson
      - --control
      - /opt/chaos/endpoints/control
    labels:
      <<: *run-labels
      io.nervix.chaos.role: load
    volumes:
      - ${CHAOS_SCRIPT_DIR:?CHAOS_SCRIPT_DIR is required}/endpoint-client.py:/opt/chaos/endpoint-client.py:ro
      - ${CHAOS_ENDPOINT_DIR:?CHAOS_ENDPOINT_DIR is required}:/opt/chaos/endpoints:ro
    logging:
      driver: local
      options:
        max-file: "2"
        max-size: 2m
    networks:
      - chaos

  # One independent observer per node follows the paced domain's clock through that node's
  # session route with the packaged CLI; the runner starts each with its CHAOS_CLOCK_HOST.
  clock-observer:
    image: ${NERVIX_IMAGE:?NERVIX_IMAGE is required}
    profiles:
      - paced
    entrypoint:
      - /bin/sh
      - /opt/chaos/observe-clock.sh
    labels:
      <<: *run-labels
      io.nervix.chaos.role: observer
    environment:
      NERVIX_PASSWORD: ${CHAOS_PASSWORD:?CHAOS_PASSWORD is required}
      CHAOS_CLOCK_DOMAIN: chaos_paced
      CHAOS_CLOCK_HOST: nervix-1
    tmpfs:
      - /var/lib/nervix
    volumes:
      - ${CHAOS_SCRIPT_DIR:?CHAOS_SCRIPT_DIR is required}/observe-clock.sh:/opt/chaos/observe-clock.sh:ro
    logging:
      driver: local
      options:
        max-file: "2"
        max-size: 8m
    networks:
      - chaos

  observer:
    image: ${CHAOS_PROBE_IMAGE:?CHAOS_PROBE_IMAGE is required}
    profiles:
      - rolling
    entrypoint:
      - /bin/sh
      - /opt/chaos/observe-nodes.sh
    labels:
      <<: *run-labels
      io.nervix.chaos.role: observer
    environment:
      CHAOS_NODE_COUNT: ${CHAOS_NODE_COUNT:?CHAOS_NODE_COUNT is required}
    volumes:
      - ${CHAOS_SCRIPT_DIR:?CHAOS_SCRIPT_DIR is required}/observe-nodes.sh:/opt/chaos/observe-nodes.sh:ro
    logging:
      driver: local
      options:
        max-file: "2"
        max-size: 2m
    networks:
      - chaos

networks:
  # Node addresses are fixed per run so peer-side partition rules keep matching a node across its
  # restart. Dynamic addresses for every other container come from a range that excludes them.
  chaos:
    labels:
      <<: *run-labels
    ipam:
      config:
        - subnet: ${CHAOS_SUBNET:?CHAOS_SUBNET is required}
          ip_range: ${CHAOS_DYNAMIC_RANGE:?CHAOS_DYNAMIC_RANGE is required}

volumes:
  node-1-data:
    labels:
      <<: *run-labels
  node-2-data:
    labels:
      <<: *run-labels
  node-3-data:
    labels:
      <<: *run-labels
