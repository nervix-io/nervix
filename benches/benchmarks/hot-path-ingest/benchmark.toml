dependencies = ["kafka"]
description = "Concurrent Kafka ingestors publishing batches into one relay"
name = "hot-path-ingest"

[load]
duration = "auto"
max_backlog_messages = 131072
partitions = 16
value_bytes = 128
wait_timeout_seconds = 120
warmup_seconds = 10

[load.shape]
kind = "uniform-passthrough"

[parameters]
emitter_flush_each = "10ms"
emitter_max_batch_size = "8MiB"
ingestor_flush_each = "10ms"
ingestor_max_batch_size = "8MiB"

[implementations.nervix]
kind = "nervix"
template = "nervix.nspl.upon"
