dependencies = ["kafka"]
description = "Concurrent ingestors delivering batches to a relay owned by another cluster node"
name = "hot-path-remote-delivery"

[load]
duration = "auto"
max_backlog_messages = 131072
partitions = 16
value_bytes = 128
wait_timeout_seconds = 120
warmup_seconds = 10

[load.shape]
kind = "uniform-passthrough"

[parameters]
emitter_flush_each = "10ms"
emitter_max_batch_size = "8MiB"
ingestor_flush_each = "10ms"
ingestor_max_batch_size = "8MiB"

[implementations.nervix]
after_start = "after-start.nspl.upon"
kind = "nervix"
nodes = 2
template = "nervix.nspl.upon"
