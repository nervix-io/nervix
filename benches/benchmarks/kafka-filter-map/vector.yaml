api:
  enabled: true
  address: 0.0.0.0:8686

acknowledgements:
  enabled: false

healthchecks:
  enabled: true
  require_healthy: true

sources:
{% for lane in lanes %}
  kafka_in_{{ lane }}:
    type: kafka
    bootstrap_servers: "{{ kafka_bootstrap_servers }}"
    group_id: "{{ consumer_group }}"
    topics:
      - "{{ input_topic }}"
    auto_offset_reset: earliest
    decoding:
      codec: json
      json:
        lossy: false
{% endfor %}

transforms:
{% for lane in lanes %}
  benchmark_transform_{{ lane }}:
    type: remap
    inputs:
      - kafka_in_{{ lane }}
    drop_on_abort: true
    drop_on_error: true
    source: |
      value = string!(.value)
      if !contains(value, "x") {
        abort
      }
      . = {"value": upcase(value)}
{% endfor %}

sinks:
{% for lane in lanes %}
  kafka_out_{{ lane }}:
    type: kafka
    inputs:
      - benchmark_transform_{{ lane }}
    bootstrap_servers: "{{ kafka_bootstrap_servers }}"
    topic: "{{ output_topic }}"
    compression: none
    batch:
      max_bytes: {{ parameters.emitter_max_batch_bytes }}
      timeout_secs: {{ parameters.emitter_flush_seconds }}
    encoding:
      codec: json
      only_fields:
        - value
    healthcheck:
      enabled: true
    librdkafka_options:
      enable.idempotence: "true"
{% endfor %}
