dependencies = ["kafka"]
description = "Concurrent Kafka inputs copied to four Kafka output paths"
name = "hot-path-relay-fanout"

[load]
duration = "auto"
max_backlog_messages = 131072
partitions = 16
value_bytes = 128
wait_timeout_seconds = 120
warmup_seconds = 10

[load.shape]
kind = "uniform-fanout"
outputs_per_input = 4

[parameters]
consumers = [0, 1, 2, 3]
emitter_flush_each = "10ms"
emitter_max_batch_size = "8MiB"
ingestor_flush_each = "10ms"
ingestor_max_batch_size = "8MiB"

[implementations.nervix]
kind = "nervix"
template = "nervix.nspl.upon"

[implementations.vector]
command = ["--config", "/etc/vector/vector.yaml"]
config_path = "/etc/vector/vector.yaml"
image = "timberio/vector:0.57.0-debian"
kind = "container"
readiness_path = "/health"
readiness_port = 8686
require_consumer_group_membership = true
template = "vector.yaml"

[implementations.flink]
command = ["/opt/flink/benchmark-start.sh", "/opt/flink/benchmark.sql"]
config_path = "/opt/flink/benchmark.sql"
image = "nervix-benchmark-flink:2.0.1"
kind = "container"
readiness_log = "BENCHMARK_FLINK_READY"
require_consumer_group_membership = false
template = "flink.sql.upon"
