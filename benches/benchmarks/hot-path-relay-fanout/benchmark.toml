dependencies = ["kafka"]
description = "Concurrent publishers fan one relay batch out to four attached consumers"
name = "hot-path-relay-fanout"

[load]
duration = "auto"
max_backlog_messages = 131072
partitions = 16
value_bytes = 128
wait_timeout_seconds = 120
warmup_seconds = 10

[load.shape]
kind = "uniform-fanout"
outputs_per_input = 4

[parameters]
consumers = [0, 1, 2, 3]
emitter_flush_each = "10ms"
emitter_max_batch_size = "8MiB"
ingestor_flush_each = "10ms"
ingestor_max_batch_size = "8MiB"

[implementations.nervix]
kind = "nervix"
template = "nervix.nspl.upon"
