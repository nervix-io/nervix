apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nervix-node-1-interconnect
  namespace: nervix
spec:
  secretName: nervix-node-1-interconnect-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - nervix-0.nervix-headless.nervix.svc.cluster.local
  uris:
    - nervix://cluster/nervix-kube/node/node-1
  usages:
    - server auth
    - client auth
  issuerRef:
    name: nervix-internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
