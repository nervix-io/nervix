# Only these compiled configurations are claimed by the synchronization gate. Primitive provenance
# in authored macros and inactive cfg continues to be enforced by the mandatory source validator.
[[configuration]]
features = ["nervix-deadlock/report-tool"]
kinds = ["lib", "bin"]
manifest = "Cargo.toml"
name = "ordinary"
packages = []

[[configuration]]
features = ["testing"]
manifest = "Cargo.toml"
name = "testing"
packages = ["nervix-server"]

[[configuration]]
features = ["native", "shuttle"]
manifest = "Cargo.toml"
name = "shuttle"
packages = ["nervix-primitives", "nervix-interconnect", "nervix-server"]

[[configuration]]
features = ["native", "loom"]
manifest = "Cargo.toml"
name = "loom"
packages = ["nervix-primitives", "nervix-server", "nervix-consensus"]

[[configuration]]
features = ["native", "turmoil"]
manifest = "Cargo.toml"
name = "turmoil"
packages = ["nervix-primitives", "nervix-interconnect"]

[[configuration]]
features = ["native", "deloxide"]
kinds = ["lib"]
manifest = "Cargo.toml"
name = "deloxide"
packages = [
  "nervix-primitives",
  "nervix-deadlock",
  "nervix-paced-simulation",
  "nervix-server",
]

[[configuration]]
features = ["native", "deloxide-order"]
kinds = ["lib"]
manifest = "Cargo.toml"
name = "deloxide-order"
packages = [
  "nervix-primitives",
  "nervix-deadlock",
  "nervix-paced-simulation",
  "nervix-server",
]

[[configuration]]
features = ["native", "deloxide-stress"]
kinds = ["lib"]
manifest = "Cargo.toml"
name = "deloxide-stress"
packages = [
  "nervix-primitives",
  "nervix-deadlock",
  "nervix-paced-simulation",
  "nervix-server",
]

# The local report tool is an ordinary product binary. Diagnostic binaries are checked separately
# from the reporting library, so these configurations never enable its report-tool capability.
[[configuration]]
features = ["native", "deloxide"]
kinds = ["bin"]
manifest = "Cargo.toml"
name = "deloxide-binaries"
packages = ["nervix-primitives", "nervix-paced-simulation", "nervix-server"]

[[configuration]]
features = ["native", "deloxide-order"]
kinds = ["bin"]
manifest = "Cargo.toml"
name = "deloxide-order-binaries"
packages = ["nervix-primitives", "nervix-paced-simulation", "nervix-server"]

[[configuration]]
features = ["native", "deloxide-stress"]
kinds = ["bin"]
manifest = "Cargo.toml"
name = "deloxide-stress-binaries"
packages = ["nervix-primitives", "nervix-paced-simulation", "nervix-server"]
