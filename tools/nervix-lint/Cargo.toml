[workspace]
exclude = ["fixtures", "fixture-macros"]
members = ["driver", "report"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
bolero = "=0.13.4"
error-stack = "0.6"
indexmap = "2"
meticulous = "0.2.0-pre.2"
nervix-primitives = { path = "../../crates/primitives", features = ["native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
triomphe = "0.1"

[profile.dev]
debug = 1

[profile.fuzz]
codegen-units = 1
debug = 1
debug-assertions = true
inherits = "dev"
opt-level = 2
overflow-checks = true
