[package]
edition = "2024"
name = "nervix-lint-fixtures"
version = "0.1.0"

[workspace]

[features]
default = []
deloxide = ["nervix-primitives/deloxide"]
loom = ["nervix-primitives/loom"]
shuttle = ["nervix-primitives/shuttle"]
turmoil = ["nervix-primitives/turmoil"]

[dependencies]
error-stack = "0.6"
futures-core = "0.3"
indexmap = "2"
meticulous = "0.2.0-pre.2"
nervix-lint-fixture-macros = { path = "../fixture-macros" }
nervix-primitives = { path = "../../../crates/primitives", features = [
  "native",
] }
nervix-recovery = { path = "../../../crates/recovery" }
serde_json = "1"
thiserror = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nervix_lint)'] }
