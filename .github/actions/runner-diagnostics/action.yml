name: Runner diagnostics
description: Short CPU, memory and build-filesystem probes before a build step
inputs:
  label:
    description: Unique lowercase build-step label within this job
    required: true
runs:
  using: composite
  steps:
    - name: Install benchmark tools once per job
      shell: bash
      run: |
        if ! command -v sysbench >/dev/null || [[ ! -x /usr/bin/fio ]]; then
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends sysbench fio
        fi
    - name: Measure runner resources
      shell: bash
      env:
        PROBE_LABEL: ${{ inputs.label }}
      run: >-
        python3 -m scripts.runner_diagnostics
        --label "${PROBE_LABEL}"
        --output "${RUNNER_TEMP}/runner-diagnostics/${PROBE_LABEL}"
        --storage-path "${GITHUB_WORKSPACE}"
    - name: Retain runner diagnostics
      if: always()
      uses: ./.github/actions/ci-artifact-upload
      with:
        name: runner-diagnostics-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ inputs.label }}
        path: ${{ runner.temp }}/runner-diagnostics/${{ inputs.label }}
        if-no-files-found: warn
