name: Binaries

# Runs beside Docker Build rather than inside it: the binaries for platforms that have no container
# image are built by the host toolchain of a matching runner, so they share no step with the image
# matrix, which cross-builds every architecture from one Linux runner.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new commit makes a running build stale, so it is cancelled. A label event must not: the run it
  # would cancel is the build someone asked for, and labelling is how this workflow is requested.
  cancel-in-progress: ${{ github.event.action != 'labeled' }}

permissions:
  contents: read

env:
  KACHE_VERSION: "0.19.0"

jobs:
  build:
    name: build-${{ matrix.platform }}
    # The `binaries` label is the request for this build. It keeps a per-minute macOS runner off
    # every pull request, and it is checked on the label event too so that adding an unrelated label
    # later does not rebuild. Forks are excluded because the build needs the kache remote
    # credentials.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'binaries') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action != 'labeled' || github.event.label.name == 'binaries'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 15 rather than the current release: a binary built against the older SDK still
          # runs on the newer system, and the reverse is not guaranteed.
          - platform: macos-arm64
            runner: blacksmith-6vcpu-macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable,just,toml-cli,trunk

      # librdkafka and aws-lc are built from source by cargo, and the protobuf and FlatBuffers
      # compilers generate the wire bindings.
      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install cmake protobuf

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Configure kache daemon remote
        env:
          KACHE_S3_BUCKET: ${{ vars.KACHE_S3_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_S3_REGION }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          config="${RUNNER_TEMP}/kache-${GITHUB_JOB}.toml"
          bash scripts/configure_kache_remote.sh "${config}"
          echo "KACHE_CONFIG=${config}" >> "${GITHUB_ENV}"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          manifest-key: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          pr-comment: "false"
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-region: ${{ vars.KACHE_S3_REGION }}
          s3-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Package binaries
        run: just package-binaries "${RUNNER_TEMP}/nervix-binaries"

      - name: Kache stats
        continue-on-error: true
        if: always()
        run: kache stats

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: nervix-binaries-${{ matrix.platform }}
          path: ${{ runner.temp }}/nervix-binaries
          if-no-files-found: error
          retention-days: 14
