name: Docker Build

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  packages: write
  issues: write

jobs:
  meta:
    name: metadata
    if: github.event.action != 'labeled' || github.event.label.name == 'benchmark'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 40
    outputs:
      build_id: ${{ steps.meta.outputs.build_id }}
      timestamp: ${{ steps.meta.outputs.timestamp }}
    steps:
      - name: Compute image metadata
        id: meta
        run: |
          ts="$(date -u +'%Y%m%d%H%M%S')"
          echo "build_id=${ts}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          echo "timestamp=${ts}" >> "${GITHUB_OUTPUT}"

  build-arch:
    name: build-${{ matrix.image }}-${{ matrix.arch }}
    needs: meta
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian
            version: trixie
            platform: linux/amd64
            arch: amd64
            llvm: "22"
          - image: debian
            version: trixie
            platform: linux/arm64
            arch: arm64
            llvm: "22"
          # - image: alpine
          #   version: "3.23"
          #   platform: linux/amd64
          #   arch: amd64
          #   llvm: "21"
          # - image: alpine
          #   version: "3.23"
          #   platform: linux/arm64
          #   arch: arm64
          #   llvm: "21"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: useblacksmith/setup-docker-builder@v1

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,toml-cli

      - name: Login to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arch image
        run: |
          image_repo="ghcr.io/nervix-io/nervix"
          tag="${image_repo}:${{ needs.meta.outputs.build_id }}-${{ matrix.image }}-${{ matrix.arch }}"
          push_image="true"
          if [[ "${{ github.event_name }}" == "pull_request" \
            && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            push_image="false"
          fi
          if [[ "${{ matrix.image }}" == "debian" ]]; then
            just docker-build-debian \
              "${{ matrix.version }}" \
              "${{ matrix.llvm }}" \
              "${tag}" \
              "${{ matrix.platform }}" \
              "${push_image}"
          else
            just docker-build-alpine \
              "${{ matrix.version }}" \
              "${{ matrix.llvm }}" \
              "${tag}" \
              "${{ matrix.platform }}" \
              "${push_image}"
          fi

  benchmark:
    name: benchmarks
    needs: [meta, build-arch]
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'benchmark') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    env:
      CARGO_TERM_COLOR: never
      NO_COLOR: "1"
      RUST_LOG_STYLE: never
      NERVIX_BENCHMARK_IMAGE: ghcr.io/nervix-io/nervix:${{ needs.meta.outputs.build_id }}-debian-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull benchmark image
        run: docker pull "${NERVIX_BENCHMARK_IMAGE}"

      - name: Logout from GHCR
        run: docker logout ghcr.io

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,toml-cli,wild-linker

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22

      - name: Configure cargo
        run: |
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-22"
          linker = "clang-22"
          rustflags = ["-Clink-arg=--ld-path=wild"]
          EOF

      - name: Install benchmark build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Blacksmith cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run benchmarks
        id: benchmark
        run: >-
          just benchmark-ci
          "${NERVIX_BENCHMARK_IMAGE}"
          "${RUNNER_TEMP}/nervix-benchmarks"

      - name: Publish benchmark summary
        if: always()
        run: |
          root="${RUNNER_TEMP}/nervix-benchmarks"
          comparison="${root}/benchmark-comparison.md"
          if [[ -f "${comparison}" ]]; then
            cat "${comparison}" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          mapfile -d '' reports < <(find "${root}" -type f -name load-report.txt -print0 2>/dev/null | sort -z)
          if (( ${#reports[@]} == 0 )); then
            exit 0
          fi
          {
            echo "## Benchmark results"
            for report in "${reports[@]}"; do
              relative="${report#"${root}/"}"
              echo
              echo "### ${relative%/load-report.txt}"
              echo '```text'
              cat "${report}"
              echo '```'
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nervix-benchmarks
          if-no-files-found: warn
          retention-days: 14

  benchmark-comment:
    name: benchmark-comment
    needs: [build-arch, benchmark]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'benchmark') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Download benchmark artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nervix-benchmarks

      - name: Update benchmark comparison on PR
        uses: actions/github-script@v7
        env:
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          BUILD_RESULT: ${{ needs.build-arch.result }}
          COMPARISON_PATH: ${{ runner.temp }}/nervix-benchmarks/benchmark-comparison.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- nervix-benchmark-comparison -->';
            const runLink = `[Workflow run and artifacts](${process.env.RUN_URL})`;
            const comparisonPath = process.env.COMPARISON_PATH;
            let body;
            let missingSuccessfulComparison = false;

            if (
              process.env.BENCHMARK_RESULT === 'success' &&
              fs.existsSync(comparisonPath)
            ) {
              const comparison = fs.readFileSync(comparisonPath, 'utf8').trim();
              body = `${marker}\n${comparison}\n\n${runLink} · commit \`${context.sha}\``;
            } else {
              let reason;
              if (process.env.BUILD_RESULT !== 'success') {
                reason = `The Docker image build finished with status \`${process.env.BUILD_RESULT}\`, so benchmarks did not run.`;
              } else if (process.env.BENCHMARK_RESULT !== 'success') {
                reason = `The benchmark job finished with status \`${process.env.BENCHMARK_RESULT}\` and did not produce a valid comparison.`;
              } else {
                reason = 'The benchmark job succeeded but did not publish benchmark-comparison.md.';
                missingSuccessfulComparison = true;
              }
              body = `${marker}\n## Benchmark comparison\n\n❌ ${reason}\n\n${runLink} · commit \`${context.sha}\``;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

            if (missingSuccessfulComparison) {
              core.setFailed('successful benchmark job did not publish a comparison');
            }

  publish-manifest:
    name: manifest-${{ matrix.image }}
    needs: [meta, build-arch]
    if: >-
      github.event.action != 'labeled' &&
      (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian
          # - alpine
    steps:
      - name: Setup Docker Buildx
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifest
        run: |
          base="ghcr.io/nervix-io/nervix"
          build_id="${{ needs.meta.outputs.build_id }}"
          ts="${{ needs.meta.outputs.timestamp }}"
          docker buildx imagetools create \
            -t "${base}:${ts}-${{ matrix.image }}" \
            -t "${base}:${{ matrix.image }}-latest" \
            "${base}:${build_id}-${{ matrix.image }}-amd64" \
            "${base}:${build_id}-${{ matrix.image }}-arm64"

  build-book:
    name: build-book
    needs: [meta, build-arch]
    runs-on: ubuntu-latest
    # `just book` recaptures the console screenshots and renders the nervix-cli
    # reference from the current binary, so this job compiles the workspace and
    # drives a real browser rather than only rendering Markdown.
    timeout-minutes: 60
    if: >-
      github.event.action != 'labeled' &&
      (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Resolve pinned mdBook version
        id: mdbook
        run: |
          version="$(uv run --locked python -c \
            'from scripts.build_book import MDBOOK_VERSION; print(MDBOOK_VERSION)')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: ${{ steps.mdbook.outputs.version }}

      - name: Install Pandoc and PDF engine
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-noto-cjk \
            fonts-noto-core \
            lmodern \
            pandoc \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-lang-chinese \
            texlive-lang-cjk \
            texlive-xetex

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,toml-cli,trunk

      # The book build compiles nervix-server and nervix-cli: the screenshot tool
      # drives a real server, and the nervix-cli reference is rendered from the
      # binary's own --help.
      - name: Install apt deps
        run: |
          sudo apt-get install --yes --no-install-recommends \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-book-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-book-cargo-

      - name: Compute docs target
        id: docs
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            docs_target="pr-${{ github.event.pull_request.number }}-${{ github.sha }}"
          else
            docs_target="main-${{ github.sha }}"
          fi
          docs_url="https://docs.nervix.io/${docs_target}/"
          llms_url="https://docs.nervix.io/${docs_target}/llms.txt"
          pdf_url="https://docs.nervix.io/${docs_target}/nervix.pdf"
          echo "target=${docs_target}" >> "$GITHUB_OUTPUT"
          echo "url=${docs_url}" >> "$GITHUB_OUTPUT"
          echo "llms_url=${llms_url}" >> "$GITHUB_OUTPUT"
          echo "pdf_url=${pdf_url}" >> "$GITHUB_OUTPUT"

      - name: Publish Book
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          just publish-book "${{ steps.docs.outputs.target }}" "$CLOUDFLARE_ZONE_ID"

      - name: Publish docs link to build summary
        run: |
          {
            echo "## Documentation Preview"
            echo
            echo "- Target: \`${{ steps.docs.outputs.target }}\`"
            echo "- Book: ${{ steps.docs.outputs.url }}"
            echo "- PDF: ${{ steps.docs.outputs.pdf_url }}"
            echo "- NSPL agent index: ${{ steps.docs.outputs.llms_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment docs link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- nervix-docs-preview -->';
            const body = `${marker}
            Documentation preview for this PR:

            - Target: \`${{ steps.docs.outputs.target }}\`
            - Book: ${{ steps.docs.outputs.url }}
            - PDF: ${{ steps.docs.outputs.pdf_url }}
            - NSPL agent index: ${{ steps.docs.outputs.llms_url }}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
