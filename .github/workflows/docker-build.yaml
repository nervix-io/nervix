name: Docker Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # The nightly chaos soak runs against the image this build makes from main.
  schedule:
    - cron: "0 2 * * *"

concurrency:
  # A label that builds no image runs in a group of its own: adding it beside `chaos` in one request
  # would otherwise cancel the build that label started and then skip itself, leaving no image.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      github.event.action == 'labeled' &&
      !contains(fromJSON('["benchmark", "chaos", "chaos-soak"]'), github.event.label.name) &&
      format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  packages: write
  issues: write

env:
  # Kache sizes its local store from the cache volume (5%, rounded and bounded).
  # Keep the default so a runner disk change also changes its cache budget.
  KACHE_VERSION: "1.2.1"
  KACHE_REMOTE_KEY_LISTING: "false"
  # Kache disables free-space recovery in CI unless a decimal-byte floor is explicit: 64 GiB.
  KACHE_AUTO_RECOVER_MIN_FREE_BYTES: "68719476736"

jobs:
  meta:
    name: metadata
    if: >-
      (github.event_name != 'pull_request' ||
        !contains(github.event.pull_request.labels.*.name, 'no-docker')) &&
      (github.event.action != 'labeled' ||
        contains(fromJSON('["benchmark", "chaos", "chaos-soak"]'), github.event.label.name))
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 40
    outputs:
      build_id: ${{ steps.meta.outputs.build_id }}
      timestamp: ${{ steps.meta.outputs.timestamp }}
    steps:
      - name: Compute image metadata
        id: meta
        run: |
          ts="$(date -u +'%Y%m%d%H%M%S')"
          echo "build_id=${ts}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          echo "timestamp=${ts}" >> "${GITHUB_OUTPUT}"

  build-arch:
    name: build-${{ matrix.image }}-${{ matrix.arch }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    # Run 39534273321's amd64 build took 65 minutes. Reserve another half plus upload headroom.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian
            platform: linux/amd64
            arch: amd64
            llvm: "23"
            runner: ubicloud-standard-4-ubuntu-2404
          - image: debian
            platform: linux/arm64
            arch: arm64
            llvm: "23"
            runner: ubicloud-standard-8-ubuntu-2404
          # - image: alpine
          #   platform: linux/amd64
          #   arch: amd64
          #   llvm: "21"
          # - image: alpine
          #   platform: linux/arm64
          #   arch: arm64
          #   llvm: "21"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest

      - name: Login to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Runner diagnostics before Build and push arch image
        uses: ./.github/actions/runner-diagnostics
        with:
          label: build-and-push-arch-image

      - name: Build and push arch image
        env:
          KACHE_S3_BUCKET: ${{ vars.KACHE_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}
        run: |
          image_repo="ghcr.io/nervix-io/nervix"
          tag="${image_repo}:${{ needs.meta.outputs.build_id }}-${{ matrix.image }}-${{ matrix.arch }}"
          push_image="true"
          if [[ "${{ github.event_name }}" == "pull_request" \
            && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            push_image="false"
          fi
          if [[ "${{ matrix.image }}" == "debian" ]]; then
            just docker-build-debian \
              "${{ matrix.llvm }}" \
              "${tag}" \
              "${{ matrix.platform }}" \
              "${push_image}"
          else
            just docker-build-alpine \
              "3.23" \
              "${{ matrix.llvm }}" \
              "${tag}" \
              "${{ matrix.platform }}" \
              "${push_image}"
          fi

  # The Deloxide diagnostic image of the same revision, for the chaos runs that qualify its tracked
  # locks under process, pause and network faults. It is pushed under its own tag, carries its
  # selection in a label, and never enters a published manifest.
  build-diagnostic:
    name: build-diagnostic-deloxide-order-amd64
    needs: meta
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (contains(github.event.pull_request.labels.*.name, 'chaos') ||
          contains(github.event.pull_request.labels.*.name, 'chaos-soak')))
    # The diagnostic server's workspace crates compile with the detector's features, which the
    # release image's cache does not hold, so this build takes the larger worker.
    runs-on: ubicloud-standard-8-ubuntu-2404
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Runner diagnostics before Build and push the diagnostic image
        uses: ./.github/actions/runner-diagnostics
        with:
          label: build-and-push-the-diagnostic-image

      - name: Build and push the diagnostic image
        env:
          KACHE_S3_BUCKET: ${{ vars.KACHE_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}
        run: |
          just docker-build-diagnostic deloxide-order 23 \
            "ghcr.io/nervix-io/nervix:${{ needs.meta.outputs.build_id }}-debian-amd64-deloxide-order" \
            linux/amd64 true

  benchmark:
    name: benchmarks
    needs: [meta, build-arch]
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'benchmark') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubicloud-standard-8-ubuntu-2404
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    env:
      CARGO_TERM_COLOR: never
      NO_COLOR: "1"
      RUST_LOG_STYLE: never
      NERVIX_BENCHMARK_IMAGE: ghcr.io/nervix-io/nervix:${{ needs.meta.outputs.build_id }}-debian-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull benchmark image
        run: docker pull "${NERVIX_BENCHMARK_IMAGE}"

      - name: Logout from GHCR
        run: docker logout ghcr.io

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest,wild-linker

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      - name: Configure cargo
        run: |
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "clang-23"
          rustflags = ["-Clink-arg=--ld-path=wild"]
          EOF

      - name: Install benchmark build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          cache-executables: "true"
          pr-comment: "false"

      - name: Start kache remote
        env:
          KACHE_MANIFEST_KEY: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          KACHE_S3_BUCKET: ${{ vars.KACHE_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}
        run: python3 scripts/kache_remote.py start

      - name: Runner diagnostics before Run benchmarks
        uses: ./.github/actions/runner-diagnostics
        with:
          label: run-benchmarks

      - name: Run benchmarks
        run: >-
          just benchmark-ci
          "${NERVIX_BENCHMARK_IMAGE}"
          "${RUNNER_TEMP}/nervix-benchmarks"

      - name: Runner diagnostics before Measure ordinary primitive costs
        uses: ./.github/actions/runner-diagnostics
        with:
          label: measure-ordinary-primitive-costs

      - name: Measure ordinary primitive costs
        run: |
          mkdir -p "${RUNNER_TEMP}/nervix-benchmarks/primitives"
          just bench-primitives --sample-size 20 --warm-up-time 1 --measurement-time 1 \
            > "${RUNNER_TEMP}/nervix-benchmarks/primitives/ordinary-cost.txt" 2>&1

      - name: Publish kache cache
        if: always()
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -f scripts/kache_remote.py ]]; then
            python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache publication did not run because checkout did not provide its script"
          fi

      - name: Publish kache report
        if: always()
        run: python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/kache-report
          if-no-files-found: warn

      - name: Publish benchmark summary
        if: always()
        run: |
          root="${RUNNER_TEMP}/nervix-benchmarks"
          comparison="${root}/benchmark-comparison.md"
          if [[ -f "${comparison}" ]]; then
            cat "${comparison}" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          mapfile -d '' reports < <(find "${root}" -type f -name load-report.txt -print0 2>/dev/null | sort -z)
          if (( ${#reports[@]} == 0 )); then
            exit 0
          fi
          {
            echo "## Benchmark results"
            for report in "${reports[@]}"; do
              relative="${report#"${root}/"}"
              echo
              echo "### ${relative%/load-report.txt}"
              echo '```text'
              cat "${report}"
              echo '```'
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish ordinary primitive costs
        if: always()
        run: |
          report="${RUNNER_TEMP}/nervix-benchmarks/primitives/ordinary-cost.txt"
          if [[ -f "${report}" ]]; then
            {
              echo '## Ordinary primitive costs'
              echo '```text'
              cat "${report}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nervix-benchmarks
          if-no-files-found: warn
          retention-days: 14

  benchmark-comment:
    name: benchmark-comment
    needs: [build-arch, benchmark]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'no-docker') &&
      contains(github.event.pull_request.labels.*.name, 'benchmark') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Download benchmark artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nervix-benchmarks

      - name: Update benchmark comparison on PR
        uses: actions/github-script@v7
        env:
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          BUILD_RESULT: ${{ needs.build-arch.result }}
          COMPARISON_PATH: ${{ runner.temp }}/nervix-benchmarks/benchmark-comparison.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- nervix-benchmark-comparison -->';
            const runLink = `[Workflow run and artifacts](${process.env.RUN_URL})`;
            const comparisonPath = process.env.COMPARISON_PATH;
            let body;
            let missingSuccessfulComparison = false;

            if (fs.existsSync(comparisonPath)) {
              const comparison = fs.readFileSync(comparisonPath, 'utf8').trim();
              const resultNote = process.env.BENCHMARK_RESULT === 'success'
                ? ''
                : `\n\n> [!WARNING]\n> The benchmark job finished with status \`${process.env.BENCHMARK_RESULT}\`; the report retains every completed measurement and lists each failed catalog entry.`;
              body = `${marker}\n${comparison}${resultNote}\n\n${runLink} · commit \`${context.sha}\``;
            } else {
              let reason;
              if (process.env.BUILD_RESULT !== 'success') {
                reason = `The Docker image build finished with status \`${process.env.BUILD_RESULT}\`, so benchmarks did not run.`;
              } else if (process.env.BENCHMARK_RESULT !== 'success') {
                reason = `The benchmark job finished with status \`${process.env.BENCHMARK_RESULT}\` and did not produce a valid comparison.`;
              } else {
                reason = 'The benchmark job succeeded but did not publish benchmark-comparison.md.';
                missingSuccessfulComparison = true;
              }
              body = `${marker}\n## Benchmark comparison\n\n❌ ${reason}\n\n${runLink} · commit \`${context.sha}\``;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

            if (missingSuccessfulComparison) {
              core.setFailed('successful benchmark job did not publish a comparison');
            }

  # The external chaos runner against the images built above, through the same `just chaos suite`
  # command a developer runs: the release image and the Deloxide diagnostic image of the same
  # revision, each refused by the suite unless its labels name that kind and revision. A pull
  # request runs the smoke suite with the `chaos` label and the soak suite with `chaos-soak`; the
  # nightly build of main runs the soak.
  chaos-smoke:
    name: chaos-smoke
    needs: [meta, build-arch]
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'chaos') &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/chaos.yaml
    with:
      image: ghcr.io/nervix-io/nervix:${{ needs.meta.outputs.build_id }}-debian-amd64
      image-kind: ordinary
      revision: ${{ github.sha }}
      suite: smoke

  chaos-smoke-diagnostic:
    name: chaos-smoke-diagnostic
    needs: [meta, build-diagnostic]
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'chaos') &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/chaos.yaml
    with:
      image: ghcr.io/nervix-io/nervix:${{ needs.meta.outputs.build_id }}-debian-amd64-deloxide-order
      image-kind: deloxide-order
      revision: ${{ github.sha }}
      suite: smoke

  chaos-soak:
    name: chaos-soak
    needs: [meta, build-arch]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'chaos-soak') &&
        github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/chaos.yaml
    with:
      image: ghcr.io/nervix-io/nervix:${{ needs.meta.outputs.build_id }}-debian-amd64
      image-kind: ordinary
      revision: ${{ github.sha }}
      suite: soak

  chaos-soak-diagnostic:
    name: chaos-soak-diagnostic
    needs: [meta, build-diagnostic]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'chaos-soak') &&
        github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/chaos.yaml
    with:
      image: ghcr.io/nervix-io/nervix:${{ needs.meta.outputs.build_id }}-debian-amd64-deloxide-order
      image-kind: deloxide-order
      revision: ${{ github.sha }}
      suite: soak

  # Every revision eligible for debian-latest must start through the deployment we ship. Native
  # runners exercise both images, with the same image's CLI observing the public bootstrap port.
  operator-deployment:
    name: operator-deployment-${{ matrix.arch }}
    needs: [meta, build-arch]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubicloud-standard-4-ubuntu-2404
          - arch: arm64
            # The 4-vCPU ARM class has 12 GB; leave host headroom around minikube's 10 GiB.
            runner: ubicloud-standard-8-arm-ubuntu-2404
    steps:
      - name: Checkout tested server
        uses: actions/checkout@v4

      - name: Checkout shipped operator chart and example
        uses: actions/checkout@v4
        with:
          repository: nervix-io/nervix-k8s-operator
          ref: main
          path: target/operator-source
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Install minikube
        uses: medyagh/setup-minikube@v0.0.21
        with:
          minikube-version: 1.39.0
          start: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy and observe the built server image
        env:
          NERVIX_OPERATOR_SERVER_IMAGE: ghcr.io/nervix-io/nervix:${{ needs.meta.outputs.build_id }}-debian-${{ matrix.arch }}
          NERVIX_OPERATOR_REVISION: ${{ github.sha }}
          NERVIX_OPERATOR_ARCHITECTURE: ${{ matrix.arch }}
        run: |
          just operator-deployment-check \
            "${NERVIX_OPERATOR_SERVER_IMAGE}" "${NERVIX_OPERATOR_REVISION}" \
            "${NERVIX_OPERATOR_ARCHITECTURE}" target/operator-source target/operator-deployment

      - name: Retain deployment observations and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-deployment-${{ matrix.arch }}
          path: target/operator-deployment
          if-no-files-found: error

  publish-manifest:
    name: manifest-${{ matrix.image }}
    needs: [meta, build-arch, operator-deployment]
    if: >-
      github.event.action != 'labeled' &&
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian
          # - alpine
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifest
        run: |
          base="ghcr.io/nervix-io/nervix"
          build_id="${{ needs.meta.outputs.build_id }}"
          ts="${{ needs.meta.outputs.timestamp }}"
          docker buildx imagetools create \
            -t "${base}:${ts}-${{ matrix.image }}" \
            -t "${base}:${{ matrix.image }}-latest" \
            "${base}:${build_id}-${{ matrix.image }}-amd64" \
            "${base}:${build_id}-${{ matrix.image }}-arm64"

  # Renders the book, its PDF and the Plexus agent index, uploads them under an immutable prefix and
  # repoints the `snapshot` alias that docs.nervix.io serves to it. A pull request from this
  # repository builds it only with the `book` label, which it carries only when its task requires the
  # rendered book; a manual run always builds it. The book needs no image, so adding the label builds
  # it in that label's own run. Every pull request's checks job runs the script tests that
  # `just book` runs first.
  build-book:
    name: build-book
    runs-on: ubicloud-standard-4-ubuntu-2404
    # `just book` recaptures the console screenshots and renders the nervix-cli
    # reference from the current binary, so this job compiles the workspace and
    # drives a real browser rather than only rendering Markdown.
    timeout-minutes: 60
    # The label's run and a push's run of one pull request are in different workflow groups, so the
    # newer book build replaces the older one here and only one of them publishes.
    concurrency:
      group: build-book-${{ github.ref }}
      cancel-in-progress: true
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'book') &&
          (github.event.action != 'labeled' || github.event.label.name == 'book')))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Resolve pinned mdBook version
        id: mdbook
        run: |
          version="$(uv run --locked python -c \
            'from scripts.build_book import MDBOOK_VERSION; print(MDBOOK_VERSION)')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: ${{ steps.mdbook.outputs.version }}

      - name: Install Pandoc and PDF engine
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-noto-cjk \
            fonts-noto-core \
            lmodern \
            pandoc \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-lang-chinese \
            texlive-lang-cjk \
            texlive-xetex

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest,trunk

      # The book build compiles nervix-server and nervix-cli: the screenshot tool
      # drives a real server, and the nervix-cli reference is rendered from the
      # binary's own --help.
      - name: Install apt deps
        run: |
          sudo apt-get install --yes --no-install-recommends \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          cache-executables: "true"
          pr-comment: "false"

      - name: Start kache remote
        env:
          KACHE_MANIFEST_KEY: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          KACHE_S3_BUCKET: ${{ vars.KACHE_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}
        run: python3 scripts/kache_remote.py start

      - name: Compute docs target
        id: docs
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            docs_target="pr-${{ github.event.pull_request.number }}-${{ github.sha }}"
          else
            docs_target="main-${{ github.sha }}"
          fi
          docs_url="https://docs.nervix.io/${docs_target}/"
          llms_url="https://docs.nervix.io/${docs_target}/llms.txt"
          pdf_url="https://docs.nervix.io/${docs_target}/nervix.pdf"
          {
            echo "target=${docs_target}"
            echo "url=${docs_url}"
            echo "llms_url=${llms_url}"
            echo "pdf_url=${pdf_url}"
          } >> "$GITHUB_OUTPUT"

      - name: Runner diagnostics before Publish Book
        uses: ./.github/actions/runner-diagnostics
        with:
          label: publish-book

      - name: Publish Book
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          just publish-book "${{ steps.docs.outputs.target }}" "$CLOUDFLARE_ZONE_ID"

      - name: Publish docs link to build summary
        run: |
          {
            echo "## Documentation Preview"
            echo
            echo "- Target: \`${{ steps.docs.outputs.target }}\`"
            echo "- Book: ${{ steps.docs.outputs.url }}"
            echo "- PDF: ${{ steps.docs.outputs.pdf_url }}"
            echo "- Plexus agent index: ${{ steps.docs.outputs.llms_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment docs link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- nervix-docs-preview -->';
            const body = `${marker}
            Documentation preview for this PR:

            - Target: \`${{ steps.docs.outputs.target }}\`
            - Book: ${{ steps.docs.outputs.url }}
            - PDF: ${{ steps.docs.outputs.pdf_url }}
            - Plexus agent index: ${{ steps.docs.outputs.llms_url }}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Publish kache cache
        if: always()
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -f scripts/kache_remote.py ]]; then
            python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache publication did not run because checkout did not provide its script"
          fi

      - name: Publish kache report
        if: always()
        run: python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/kache-report
          if-no-files-found: warn
