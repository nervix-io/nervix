name: Bolero

on:
  workflow_call:
    inputs:
      tested-sha:
        type: string
        required: true
      event-name:
        type: string
        required: true
      labels-json:
        type: string
        required: true
    outputs:
      randomized-result:
        value: ${{ jobs.bolero-gate.outputs.randomized-result }}
      sanitizer-result:
        value: ${{ jobs.bolero-gate.outputs.sanitizer-result }}
      sanitizer-required:
        value: ${{ jobs.bolero-gate.outputs.sanitizer-required }}
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bolero-${{ github.ref }}
  cancel-in-progress: true

env:
  KACHE_VERSION: "0.28.1"
  KACHE_REMOTE_KEY_LISTING: "false"
  NO_COLOR: "1"
  CARGO_TERM_COLOR: never
  RUST_LOG_STYLE: never
  BOLERO_TESTED_SHA: ${{ inputs.tested-sha || github.sha }}
  BOLERO_EVENT_NAME: ${{ inputs.event-name || github.event_name }}
  BOLERO_LABELS: ${{ inputs.labels-json || '[]' }}

jobs:
  bolero-random:
    name: bolero-random
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tested-sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99
        with:
          targets: wasm32-unknown-unknown

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest,toml-cli,trunk,wild-linker

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Install native build tools
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      - name: Install native server build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev protobuf-compiler

      - name: Configure cargo
        run: |
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Configure kache remote
        env:
          KACHE_CONFIG: ${{ runner.temp }}/kache-bolero.toml
          KACHE_S3_BUCKET: ${{ vars.KACHE_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}
        run: |
          bash scripts/configure_kache_remote.sh "$KACHE_CONFIG"
          echo "KACHE_CONFIG=$KACHE_CONFIG" >> "$GITHUB_ENV"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          sync: "false"
          cache-executables: "true"
          max-size: "1TiB"
          manifest-key: bolero-random-${{ runner.os }}-${{ runner.arch }}
          pr-comment: "false"
          s3-bucket: ${{ vars.KACHE_BUCKET }}
          s3-prefix: "artifacts"
          s3-region: ${{ vars.KACHE_BUCKET_REGION }}
          s3-endpoint: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          s3-access-key-id: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}

      - name: Run runner tests and every ordinary Bolero property
        run: |
          just toolchains-install
          just test-bolero-runner
          just test-bolero

  bolero-fuzz:
    name: bolero-fuzz
    if: inputs.event-name == 'pull_request' && contains(fromJSON(inputs.labels-json || '[]'), 'fuzz')
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # The measured 68-target campaign took 125 minutes after preparation; the
    # 85-target run needs room for cold builds, qualification and report uploads.
    timeout-minutes: 300
    env:
      CARGO_BUILD_JOBS: "1"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tested-sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99
        with:
          targets: wasm32-unknown-unknown

      - name: Setup pinned sanitizer nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-17
          components: llvm-tools

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest,toml-cli,trunk,wild-linker

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Setup uv for runner coverage
        uses: astral-sh/setup-uv@v6

      - name: Install native build tools
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          sudo ln -s /usr/bin/llvm-symbolizer-23 /usr/local/bin/llvm-symbolizer
          llvm-symbolizer --version

      - name: Install native server build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev protobuf-compiler

      - name: Configure cargo
        run: |
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Configure kache remote
        env:
          KACHE_CONFIG: ${{ runner.temp }}/kache-bolero.toml
          KACHE_S3_BUCKET: ${{ vars.KACHE_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}
        run: |
          bash scripts/configure_kache_remote.sh "$KACHE_CONFIG"
          echo "KACHE_CONFIG=$KACHE_CONFIG" >> "$GITHUB_ENV"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          sync: "false"
          cache-executables: "true"
          max-size: "1TiB"
          manifest-key: bolero-fuzz-${{ runner.os }}-${{ runner.arch }}
          pr-comment: "false"
          s3-bucket: ${{ vars.KACHE_BUCKET }}
          s3-prefix: "artifacts"
          s3-region: ${{ vars.KACHE_BUCKET_REGION }}
          s3-endpoint: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          s3-access-key-id: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}

      - name: Install pinned cargo-bolero
        run: just install-cargo-bolero

      - name: Prepare the registered server sanitizer harnesses
        run: |
          just toolchains-install
          just prepare-archive-counts-fuzz
          just prepare-bolero client-arrow-rows

      - name: Run every sanitizer libFuzzer target and qualify failures
        run: |
          just coverage-bolero 30

      - name: Upload live campaign coverage and completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-bolero-fuzz
          path: target/native-coverage/bolero-fuzz/
          if-no-files-found: error

      - name: Upload all fuzz and qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bolero-runs
          path: |
            target/bolero/runs/
            target/bolero/python.lcov
          if-no-files-found: warn

  bolero-gate:
    name: bolero-gate
    if: always()
    needs: [bolero-random, bolero-fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      randomized-result: ${{ steps.selection.outputs.randomized-result }}
      sanitizer-result: ${{ steps.selection.outputs.sanitizer-result }}
      sanitizer-required: ${{ steps.selection.outputs.sanitizer-required }}
    steps:
      - name: Require ordinary properties and requested fuzzing
        id: selection
        env:
          RANDOM_RESULT: ${{ needs.bolero-random.result }}
          FUZZ_RESULT: ${{ needs.bolero-fuzz.result }}
          FUZZ_REQUIRED: ${{ inputs.event-name == 'pull_request' && contains(fromJSON(inputs.labels-json || '[]'), 'fuzz') }}
        run: |
          test "$RANDOM_RESULT" = success
          if [[ "$FUZZ_REQUIRED" == "true" ]]; then
            test "$FUZZ_RESULT" = success
          else
            test "$FUZZ_RESULT" = skipped
          fi
          python3 - <<'PYTHON'
          import json, os, pathlib
          record = {
              "producer": "bolero-selection", "verdict": "complete",
              "tested_sha": os.environ["BOLERO_TESTED_SHA"],
              "run": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["BOLERO_EVENT_NAME"], "labels": json.loads(os.environ["BOLERO_LABELS"]),
              "randomized": os.environ["RANDOM_RESULT"], "sanitizer": os.environ["FUZZ_RESULT"],
              "sanitizer_required": os.environ["FUZZ_REQUIRED"] == "true",
          }
          pathlib.Path("selection.json").write_text(json.dumps(record, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, value in [("randomized-result", record["randomized"]), ("sanitizer-result", record["sanitizer"]), ("sanitizer-required", os.environ["FUZZ_REQUIRED"])]:
                  output.write(f"{name}={value}\n")
          PYTHON

      - name: Publish eligible execution or deliberate skip
        uses: actions/upload-artifact@v4
        with:
          name: bolero-selection
          path: selection.json
          if-no-files-found: error
