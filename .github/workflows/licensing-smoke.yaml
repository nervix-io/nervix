name: Licensing Smoke

# One- and three-node scenario clusters activate the production smoke-test account against the
# production licensing service, licensing.nervix.io, and show its licensing.dummy capability enabled
# (tests/features/licensing/production_smoke.feature). It runs nightly on main, on demand, and from
# Check for a pull request labeled `licensing-smoke`. It never runs on every pull request: GitHub
# gives a fork's pull request no secrets, and an outage of the production service must not block
# unrelated work.
on:
  workflow_call:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Boat machines set en_US.UTF-8, whose collation orders `sort` output differently. Keep the
  # C.UTF-8 locale of GitHub's runner image, which the scripts and their tests expect.
  LC_ALL: C.UTF-8
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  KACHE_VERSION: "2.0.0"
  KACHE_REMOTE_KEY_LISTING: "false"
  TINYGO_VERSION: "0.41.1"

jobs:
  licensing-smoke:
    name: licensing-smoke
    # The runner of the other jobs that build the scenario suite, scenarios-build and
    # client-conformance, so their compilations are interchangeable in the shared cache.
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # The limit funds a cold build of the scenario suite; the two scenarios take minutes.
    timeout-minutes: 120
    # The account allows four ephemeral activations and each run holds two, so runs never overlap: a
    # later run waits for the one in progress.
    concurrency:
      group: licensing-smoke
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest,trunk,wild-linker

      - name: Install Latest LLVM
        run: |
          sudo apt-get update --allow-releaseinfo-change
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      # The same toolchain and flags the other jobs build with, so their compilations are
      # interchangeable in the shared cache rather than a second set of artifacts.
      - name: Configure cargo
        run: |
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install TinyGo
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64|arm64) ;;
            *) echo "unsupported TinyGo CI architecture: ${arch}" >&2; exit 1 ;;
          esac
          curl --retry 3 --retry-delay 2 --retry-max-time 120 --connect-timeout 20 --max-time 120 -fsSLo /tmp/tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_${arch}.deb"
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install apt deps
        run: |
          sudo apt-get update --allow-releaseinfo-change
          sudo apt install -y \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          cache-executables: "true"
          pr-comment: "false"

      - name: Start kache remote
        env:
          KACHE_MANIFEST_KEY: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          KACHE_S3_BUCKET: ${{ vars.KACHE_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}
        run: python3 scripts/kache_remote.py start

      # The secret reaches only the scenario step, and no step prints it. A fork's pull request
      # receives no secrets, so its run stops here with that reason.
      - name: Production licensing smoke test
        env:
          NERVIX_LICENSING_SMOKE_KEY: ${{ secrets.NERVIX_LICENSING_SMOKE_KEY }}
        run: |
          just toolchains-install
          just test-licensing-production-smoke

      - name: Publish kache cache
        if: always()
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -f scripts/kache_remote.py ]]; then
            python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache publication did not run because checkout did not provide its script"
          fi

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licensing-smoke-logs
          path: tests/logs
          if-no-files-found: ignore
