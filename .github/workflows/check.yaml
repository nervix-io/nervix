        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/kache-report
          if-no-files-found: warn

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: tests/logs
          if-no-files-found: ignore

  scenarios:
    name: scenarios
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # The harness watchdog derives its budget from this limit and leaves time for logs and reports.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
      NERVIX_TEST_CONCURRENCY_FACTOR: "2"
