name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  KACHE_VERSION: "0.19.0"
  TINYGO_VERSION: "0.41.1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: false
      - uses: CondeNast/conventional-pull-request-action@v0.2.0
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ignoreCommits: 'true'
          commitlintRulesPath: ./commitlint.config.js

  checks:
    name: checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,typos-cli,cargo-audit,cargo-mutants,taplo-cli,just,cargo-autoinherit,toml-cli,trunk,wild-linker

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      - name: Configure cargo
        run: |
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "clang-23"
          rustflags = ["-Clink-arg=--ld-path=wild"]
          EOF

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.26" # Use your desired Go version

      - name: Install TinyGo
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64|arm64) ;;
            *) echo "unsupported TinyGo CI architecture: ${arch}" >&2; exit 1 ;;
          esac
          curl -fsSLo /tmp/tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_${arch}.deb"
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version

      - name: Install dockerfmt
        run: |
          go install github.com/reteps/dockerfmt@latest

      - name: Install ghokin
        run: |
          go install github.com/antham/ghokin/v3@v3.9.0

      - name: Install apt deps and current GitHub CLI
        run: |
          set -euo pipefail
          gh_keyring="$(mktemp)"
          curl -fsSL -o "${gh_keyring}" https://cli.github.com/packages/githubcli-archive-keyring.gpg
          sudo install -D -m 644 "${gh_keyring}" /etc/apt/keyrings/githubcli-archive-keyring.gpg
          rm "${gh_keyring}"
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install -y \
            gh \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Checkout
        uses: actions/checkout@v4

      # Runs before the build: the counts are a text scan, so a change that raises one is named in
      # seconds rather than after the toolchain has warmed up.
      - name: Debt ratchet
        run: just ratchet

      - name: Configure kache daemon remote
        env:
          KACHE_S3_BUCKET: ${{ vars.KACHE_S3_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_S3_REGION }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          config="${RUNNER_TEMP}/kache-${GITHUB_JOB}.toml"
          bash scripts/configure_kache_remote.sh "${config}"
          echo "KACHE_CONFIG=${config}" >> "${GITHUB_ENV}"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          manifest-key: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          pr-comment: "false"
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-region: ${{ vars.KACHE_S3_REGION }}
          s3-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Validate
        run: just validate-ci
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Kache stats
        continue-on-error: true
        if: always()
        run: kache stats

  tests:
    name: tests
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # The emergency guard outside the scenario suite's own budget, not the mechanism that ends a
    # wedged run: a job this cancels is killed mid-scenario, and the logs it uploads end without the
    # suite's own diagnostic. The suite bounds itself well inside this limit and leaves the reserve
    # the upload below needs. Keep it in step with WORKFLOW_JOB_LIMIT in
    # tests/common/suite_watchdog.rs, which derives that budget from this number.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
      NERVIX_TEST_CONCURRENCY_FACTOR: "2"
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,toml-cli,cargo-llvm-cov,trunk,cargo-crap,wild-linker

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      - name: Configure cargo
        run: |
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "clang-23"
          rustflags = ["-Clink-arg=--ld-path=wild"]
          EOF

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install TinyGo
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64|arm64) ;;
            *) echo "unsupported TinyGo CI architecture: ${arch}" >&2; exit 1 ;;
          esac
          curl -fsSLo /tmp/tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_${arch}.deb"
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version

      - name: Install dockerfmt
        run: |
          go install github.com/reteps/dockerfmt@latest

      - name: Install playwright
        run: |
          npm install -g playwright

      - name: Install apt deps
        run: |
          sudo apt update
          sudo apt install -y \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure kache daemon remote
        env:
          KACHE_S3_BUCKET: ${{ vars.KACHE_S3_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_S3_REGION }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          config="${RUNNER_TEMP}/kache-${GITHUB_JOB}.toml"
          bash scripts/configure_kache_remote.sh "${config}"
          echo "KACHE_CONFIG=${config}" >> "${GITHUB_ENV}"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          manifest-key: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          pr-comment: "false"
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-region: ${{ vars.KACHE_S3_REGION }}
          s3-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Tests Coverage
        run: |
            just test-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./lcov.info
          use_oidc: true

      - name: Kache stats
        continue-on-error: true
        if: always()
        run: kache stats

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: tests/logs
          if-no-files-found: ignore

  # The cross-language client probes: C, C++, Python, Java and Ruby over the shared Rust binding,
  # and independent Go and TypeScript implementations on Node.js and Bun. They need toolchains the
  # suite job does not install and run a feature of their own, so they are a job of their own
  # beside the suite rather than minutes added to its critical path.
  client-conformance:
    name: client-conformance
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # The suite budget below is derived from this limit: builds before the scenarios, then at most
    # the budget, then the reserve the harness keeps for its own cleanup and the log upload.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
      NERVIX_TEST_CONCURRENCY_FACTOR: "2"
      # Nineteen scenarios finish in a few minutes. A short budget leaves the builds before them
      # up to 40 minutes of the job limit instead of the suite job's 18.
      NERVIX_TEST_SUITE_BUDGET: "15m"
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,toml-cli,trunk,wild-linker

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      # The same toolchain and flags the other jobs build with, so their compilations are
      # interchangeable in the shared cache rather than a second set of artifacts.
      - name: Configure cargo
        run: |
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "clang-23"
          rustflags = ["-Clink-arg=--ld-path=wild"]
          EOF

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install TinyGo
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64|arm64) ;;
            *) echo "unsupported TinyGo CI architecture: ${arch}" >&2; exit 1 ;;
          esac
          curl -fsSLo /tmp/tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_${arch}.deb"
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version

      # The Foreign Function and Memory API the Java probe uses is final from Java 22.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Fiddle's boolean type, which the Ruby probe's signatures use, ships with Ruby 3.3.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install apt deps
        run: |
          sudo apt update
          sudo apt install -y \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure kache daemon remote
        env:
          KACHE_S3_BUCKET: ${{ vars.KACHE_S3_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_S3_REGION }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          config="${RUNNER_TEMP}/kache-${GITHUB_JOB}.toml"
          bash scripts/configure_kache_remote.sh "${config}"
          echo "KACHE_CONFIG=${config}" >> "${GITHUB_ENV}"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          manifest-key: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          pr-comment: "false"
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-region: ${{ vars.KACHE_S3_REGION }}
          s3-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Client conformance
        run: just test-client-conformance

      - name: Kache stats
        continue-on-error: true
        if: always()
        run: kache stats

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-conformance-logs
          path: tests/logs
          if-no-files-found: ignore

  # The checks that answer for the workspace rather than for the scenario suite: undefined
  # behaviour, mutation coverage, benchmark bodies, modeled concurrency and completion
  # reachability. None of them reads the suite's result, so they run beside it instead of queueing
  # behind it, and a slow one no longer pushes the suite's job toward its own timeout.
  extra-tests:
    name: extra-tests
    # Half the suite job's cores on purpose. This job is compilation-bound, so it takes about
    # twice as long here as the same steps took inside that job on sixteen: measured at 26m51s
    # against the suite job's 39m33s. It only has to finish before the suite's job to stay off the
    # critical path, and it does so with minutes to spare, so the cheaper runner is the one to use.
    # Raise this if the suite's job gets faster or these steps get slower.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,just,toml-cli,trunk,wild-linker

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      # The same toolchain and flags the other jobs build with, so their compilations are
      # interchangeable in the shared cache rather than a second set of artifacts.
      - name: Configure cargo
        run: |
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "clang-23"
          rustflags = ["-Clink-arg=--ld-path=wild"]
          EOF

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install TinyGo
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64|arm64) ;;
            *) echo "unsupported TinyGo CI architecture: ${arch}" >&2; exit 1 ;;
          esac
          curl -fsSLo /tmp/tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_${arch}.deb"
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version

      - name: Install apt deps
        run: |
          sudo apt update
          sudo apt install -y \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure kache daemon remote
        env:
          KACHE_S3_BUCKET: ${{ vars.KACHE_S3_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_S3_REGION }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          config="${RUNNER_TEMP}/kache-${GITHUB_JOB}.toml"
          bash scripts/configure_kache_remote.sh "${config}"
          echo "KACHE_CONFIG=${config}" >> "${GITHUB_ENV}"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          manifest-key: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          pr-comment: "false"
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-region: ${{ vars.KACHE_S3_REGION }}
          s3-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Cheapest first, so a workspace that does not build at all is named in seconds rather than
      # after the heavier compilations have run.
      - name: Expiry map Miri
        run: just test-expiry-map-miri

      - name: Expiry map mutation tests
        run: just test-expiry-map-mutants

      # Criterion's test mode executes every benchmark body once, catching panics and deadlocks
      # without treating noisy shared-runner timings as a performance regression signal.
      - name: Benchmark smoke tests
        run: just bench --test

      - name: Shuttle concurrency checks
        run: just test-shuttle

      # The walk saturates every core, and its failures are about completion reachability rather
      # than about any one test.
      - name: NSPL completion walk
        run: just nspl-completion-walk

      - name: Kache stats
        continue-on-error: true
        if: always()
        run: kache stats

      # A modeled concurrency failure is only reproducible from the schedule that produced it, and
      # this job is the only witness of that schedule.
      - name: Upload Shuttle failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shuttle-failures
          path: target/shuttle-failures
          if-no-files-found: ignore

  # Turmoil's seeded network simulations of the interconnect: every scenario over its committed
  # regression seeds, then a fresh-process replay of an injected failure. A job of its own beside
  # the default suite and the Shuttle checks, because its build enables the `turmoil` feature and
  # `tokio_unstable` and so shares no compilation with either, and because a failed scenario's
  # record is this job's artifact.
  turmoil:
    name: turmoil
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # The emergency guard around the build, the tests and the upload. The tests end themselves
    # first: every run has its own real-time bound, and `just test-turmoil` gives all of them
    # together an 8-minute budget, which ends a wedged run with status 124 and leaves the record
    # upload its time.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,toml-cli,wild-linker

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      # The same toolchain and flags the other jobs build with, so the dependencies this build
      # shares with them compile identically.
      - name: Configure cargo
        run: |
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "clang-23"
          rustflags = ["-Clink-arg=--ld-path=wild"]
          EOF

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure kache daemon remote
        env:
          KACHE_S3_BUCKET: ${{ vars.KACHE_S3_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_S3_REGION }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          config="${RUNNER_TEMP}/kache-${GITHUB_JOB}.toml"
          bash scripts/configure_kache_remote.sh "${config}"
          echo "KACHE_CONFIG=${config}" >> "${GITHUB_ENV}"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          manifest-key: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          pr-comment: "false"
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-region: ${{ vars.KACHE_S3_REGION }}
          s3-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Turmoil simulations
        run: just test-turmoil

      - name: Turmoil failure replay
        run: just test-turmoil-replay-check

      - name: Kache stats
        continue-on-error: true
        if: always()
        run: kache stats

      # A failed scenario is reproducible only from its record: the seed and every other input,
      # the build it ran on, and its semantic trace up to the failure. This job is the only
      # witness of them.
      - name: Upload Turmoil failure records
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: turmoil-failures
          path: target/turmoil-failures
          if-no-files-found: ignore
