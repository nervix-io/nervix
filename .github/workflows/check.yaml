name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  KACHE_VERSION: "0.28.1"
  KACHE_REMOTE_KEY_LISTING: "false"
  TINYGO_VERSION: "0.41.1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: false
      - uses: CondeNast/conventional-pull-request-action@v0.2.0
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ignoreCommits: 'true'
          commitlintRulesPath: ./commitlint.config.js

  checks:
    name: checks
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # Cold validation includes Clippy and the complete compiler matrix.
    timeout-minutes: 120
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,typos-cli,cargo-audit,cargo-mutants,taplo-cli,just@latest,cargo-autoinherit,toml-cli,trunk,wild-linker

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      - name: Configure cargo
        run: |
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.26" # Use your desired Go version

      - name: Install TinyGo
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64|arm64) ;;
            *) echo "unsupported TinyGo CI architecture: ${arch}" >&2; exit 1 ;;
          esac
          curl --retry 3 --retry-delay 2 --retry-max-time 120 --connect-timeout 20 --max-time 120 -fsSLo /tmp/tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_${arch}.deb"
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version

      - name: Install dockerfmt
        run: |
          go install github.com/reteps/dockerfmt@latest

      - name: Install ghokin
        run: |
          go install github.com/antham/ghokin/v3@v3.9.0

      - name: Install apt deps and current GitHub CLI
        run: |
          set -euo pipefail
          gh_keyring="$(mktemp)"
          curl -fsSL -o "${gh_keyring}" https://cli.github.com/packages/githubcli-archive-keyring.gpg
          sudo install -D -m 644 "${gh_keyring}" /etc/apt/keyrings/githubcli-archive-keyring.gpg
          rm "${gh_keyring}"
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install -y \
            gh \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure kache daemon remote
        env:
          KACHE_S3_BUCKET: ${{ vars.KACHE_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}
        run: |
          config="${RUNNER_TEMP}/kache-${GITHUB_JOB}.toml"
          bash scripts/configure_kache_remote.sh "${config}"
          echo "KACHE_CONFIG=${config}" >> "${GITHUB_ENV}"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          sync: "false"
          cache-executables: "true"
          max-size: "1TiB"
          manifest-key: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          pr-comment: "false"
          s3-bucket: ${{ vars.KACHE_BUCKET }}
          s3-prefix: "artifacts"
          s3-region: ${{ vars.KACHE_BUCKET_REGION }}
          s3-endpoint: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          s3-access-key-id: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}

      - name: Validate
        run: |
          just toolchains-install
          just validate-ci
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish kache report
        if: always()
        run: python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/kache-report
          if-no-files-found: warn

  tests:
    name: tests
    runs-on: blacksmith-16vcpu-ubuntu-2404
