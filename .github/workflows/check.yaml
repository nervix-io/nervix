      # compiled and what the cache served.
      - name: Publish kache cache after the build
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-build-report"

      - name: Publish kache report after the build
        run: python3 scripts/publish_kache_report.py --phase build "${RUNNER_TEMP}/kache-build-report"

      - name: Loom memory-ordering models
        run: just coverage-native-extras test-loom

      - name: Publish runner load
        if: always()
        uses: ./.github/actions/runner-load
        with:
          phase: finish
          artifact-name: runner-load-loom

      - name: Upload Loom coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-loom
          path: |
            target/native-coverage/**/completion.json
            target/native-coverage/**/lcov.info
            target/native-coverage/**/executions.jsonl
            target/native-coverage/**/export.log
            target/native-coverage/**/models.json
          if-no-files-found: warn

      - name: Publish kache cache
        if: always()
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -f scripts/kache_remote.py ]]; then
            python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache publication did not run because checkout did not provide its script"
          fi

      - name: Publish kache report
        if: always()
        run: python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/kache-report
            ${{ runner.temp }}/kache-build-report
          if-no-files-found: warn

      # A failed Loom model is only reproducible from the checkpoint of the execution that failed;
      # this job is the only witness of it.
      - name: Upload Loom failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loom-failures
          path: target/native-coverage-build-loom/loom-failures
          if-no-files-found: ignore

  # The proof that each Loom model fails under the ordering weakening it exists to detect. Jobs of
  # their own because every qualification that weakens the server rebuilds the server library in
  # Loom's test mode with its one weakening applied, which outlasts the other extra tests; the
  # shards split those rebuilds. Like the `loom` job, they run only for a pull request labeled
  # `loom`.
  loom-qualification:
    name: loom-qualification (${{ matrix.shard }} of ${{ strategy.job-total }})
    if: contains(github.event.pull_request.labels.*.name, 'loom')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: boat-xlarge
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
      # Sixteen compilers of the qualification builds exceeded the 32 GB of Boat's 16-CPU machine,
      # which killed processes of both shards, so the builds keep the eight they had on an 8-CPU,
      # 32 GB runner.
      CARGO_BUILD_JOBS: "8"
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest,trunk,wild-linker

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      - name: Configure cargo
        run: |
          # A machine whose rustup is installed system-wide, as on Boat, has no Cargo home yet.
          mkdir -p ~/.cargo
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install TinyGo
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64|arm64) ;;
            *) echo "unsupported TinyGo CI architecture: ${arch}" >&2; exit 1 ;;
          esac
          curl -fsSLo /tmp/tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_${arch}.deb"
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version

      - name: Install apt deps
        run: |
          sudo apt update
          sudo apt install -y \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          cache-executables: "true"
          pr-comment: "false"

      - name: Start kache remote
        env:
          KACHE_MANIFEST_KEY: ${{ github.job }}-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}
          KACHE_S3_BUCKET: ${{ secrets.KACHE_EU_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ secrets.KACHE_EU_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_EU_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_EU_BUCKET_SECRET_ACCESS_KEY }}
        run: python3 scripts/kache_remote.py start

      - name: Start recording runner load
        uses: ./.github/actions/runner-load
        with:
          phase: start

      - name: Runner diagnostics before Loom ordering qualification
        uses: ./.github/actions/runner-diagnostics
        with:
          label: loom-ordering-qualification

      - name: Loom ordering qualification
        run: |
          just toolchains-install
          just test-loom-qualification ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Publish runner load
        if: always()
        uses: ./.github/actions/runner-load
        with:
          phase: finish
          artifact-name: runner-load-loom-qualification-${{ matrix.shard }}

      - name: Publish kache cache
        if: always()
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -f scripts/kache_remote.py ]]; then
            python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache publication did not run because checkout did not provide its script"
          fi

      - name: Publish kache report
        if: always()
        run: python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/kache-report
          if-no-files-found: warn

      # Each successful negative control retains its counterexample and checkpoint replay too.
      # The isolated weakened source copy is gone by the time these records are uploaded.
      - name: Upload Loom qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loom-qualification-evidence-${{ matrix.shard }}
          path: |
            target/loom-qualification/*/*.log
            target/loom-qualification/*/*.json
          if-no-files-found: ignore

  # Turmoil's seeded network simulations of the interconnect: every scenario over its committed
  # regression seeds, then a fresh-process replay of an injected failure. A job of its own beside
  # the default suite and the Shuttle checks, because its build enables the `turmoil` feature and
  # `tokio_unstable` and so shares no compilation with either, and because a failed scenario's
  # record is this job's artifact. It runs only for a pull request labeled `turmoil`.
  turmoil:
    name: turmoil
    if: contains(github.event.pull_request.labels.*.name, 'turmoil')
    runs-on: boat-large
    # The emergency guard around the build, the tests and the upload. The tests end themselves
    # first: every run has its own real-time bound, and `just test-turmoil` gives all of them
    # together an 8-minute budget, which ends a wedged run with status 124 and leaves the record
    # upload its time.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest,wild-linker,cargo-llvm-cov

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      # The interconnect's wire properties take their vocabulary values from the generator crate,
      # whose WASM protocol bindings are generated when it is built.
      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      # The same toolchain and flags the other jobs build with, so the dependencies this build
      # shares with them compile identically.
      - name: Configure cargo
        run: |
          # A machine whose rustup is installed system-wide, as on Boat, has no Cargo home yet.
          mkdir -p ~/.cargo
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          cache-executables: "true"
          pr-comment: "false"

      - name: Start kache remote
        env:
          KACHE_MANIFEST_KEY: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          KACHE_S3_BUCKET: ${{ secrets.KACHE_EU_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ secrets.KACHE_EU_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_EU_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_EU_BUCKET_SECRET_ACCESS_KEY }}
        run: python3 scripts/kache_remote.py start

      - name: Start recording runner load
        uses: ./.github/actions/runner-load
        with:
          phase: start

      - name: Runner diagnostics before Turmoil simulations
        uses: ./.github/actions/runner-diagnostics
        with:
          label: turmoil-simulations

      - name: Build the Turmoil simulations
        run: |
          just toolchains-install
          just coverage-native-extras-build test-turmoil

      # The cache the build filled is published before the run starts: the run's outcome cannot lose
      # it, the jobs building beside this one can use it, and its report shows what the build
      # compiled and what the cache served.
      - name: Publish kache cache after the build
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-build-report"

      - name: Publish kache report after the build
        run: python3 scripts/publish_kache_report.py --phase build "${RUNNER_TEMP}/kache-build-report"

      - name: Turmoil simulations
        run: just coverage-native-extras test-turmoil --output target/turmoil.lcov

      - name: Runner diagnostics before Turmoil failure replay
        uses: ./.github/actions/runner-diagnostics
        with:
          label: turmoil-failure-replay

      - name: Turmoil failure replay
        run: just test-turmoil-replay-check

      - name: Report Turmoil patch line coverage
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          just coverage-patch "$BASE_SHA" target/turmoil.lcov --scope turmoil \
            --repo "$GH_REPO" --pr "$PR_NUMBER" --pr-head "$PR_HEAD_SHA" \
            --output target/turmoil-patch-coverage.md

      - name: Publish runner load
        if: always()
        uses: ./.github/actions/runner-load
        with:
          phase: finish
          artifact-name: runner-load-turmoil

      - name: Upload Turmoil coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-turmoil
          path: |
            target/native-coverage/test-turmoil/**/lcov.info
            target/native-coverage/test-turmoil/**/completion.json
            target/native-coverage/test-turmoil/**/executions.jsonl
            target/native-coverage/test-turmoil/**/export.log
            target/turmoil.lcov
            target/turmoil-patch-coverage.md
          if-no-files-found: warn

      - name: Publish kache cache
        if: always()
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -f scripts/kache_remote.py ]]; then
            python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache publication did not run because checkout did not provide its script"
          fi

      - name: Publish kache report
        if: always()
        run: python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/kache-report
            ${{ runner.temp }}/kache-build-report
          if-no-files-found: warn

      # A failed scenario is reproducible only from its record: the seed and every other input,
      # the build it ran on, and its semantic trace up to the failure. This job is the only
      # witness of them.
      - name: Upload Turmoil failure records
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: turmoil-failures
          path: |
            target/turmoil-failures
            target/turmoil-suite
            target/native-coverage-build-turmoil/turmoil-failures
            target/native-coverage-build-turmoil/turmoil-suite
          if-no-files-found: ignore
