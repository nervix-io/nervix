        run: |
          config="${RUNNER_TEMP}/kache-${GITHUB_JOB}.toml"
          bash scripts/configure_kache_remote.sh "${config}"
          echo "KACHE_CONFIG=${config}" >> "${GITHUB_ENV}"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          sync: "false"
          cache-executables: "true"
          max-size: "1TiB"
          manifest-key: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          pr-comment: "false"
          s3-bucket: ${{ vars.KACHE_BUCKET }}
          s3-prefix: "artifacts"
          s3-region: ${{ vars.KACHE_BUCKET_REGION }}
          s3-endpoint: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          s3-access-key-id: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}

      - name: Start runner load recorder
        run: |
          python3 scripts/record_runner_load.py "${RUNNER_TEMP}/runner-load.csv" "${RUNNER_TEMP}/runner-load.md" > "${RUNNER_TEMP}/runner-load.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/runner-load.pid"

      - name: Setup uv for Python driver coverage
        uses: astral-sh/setup-uv@v6

      - name: Scenario coverage
        run: |
          pwd > coverage-source-root.txt
          just toolchains-install
          just test-scenarios-coverage

      - name: Upload scenarios coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-scenarios
          overwrite: true
          path: |
            lcov-workspace.info
            lcov.info
            coverage-source-root.txt
            target/paced-simulation/python.lcov
          if-no-files-found: warn

      - name: Publish runner load
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/runner-load.pid" ]]; then
            kill -TERM "$(cat "${RUNNER_TEMP}/runner-load.pid")" || true
            for attempt in {1..10}; do
              [[ -f "${RUNNER_TEMP}/runner-load.md" ]] && break
              sleep 1
            done
          fi
          if [[ -f "${RUNNER_TEMP}/runner-load.md" ]]; then
            cat "${RUNNER_TEMP}/runner-load.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload runner load
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-load-${{ github.job }}
          overwrite: true
          path: |
            ${{ runner.temp }}/runner-load.csv
            ${{ runner.temp }}/runner-load.md
            ${{ runner.temp }}/runner-load.log
          if-no-files-found: warn

      - name: Publish suite summary
        if: always()
        run: |
          if [[ -f tests/logs/suite-summary.md ]]; then
            cat tests/logs/suite-summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Publish kache report
        if: always()
        run: python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          overwrite: true
          path: ${{ runner.temp }}/kache-report
          if-no-files-found: warn

      - name: Upload scenario logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-logs
          overwrite: true
          path: tests/logs
          if-no-files-found: ignore

  coverage:
    name: coverage
    needs: [tests, scenarios, extra-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99

      - name: Install CRAP and LCOV
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-crap,just,toml-cli

      - name: Install LCOV
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Download tests coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-tests
          path: coverage-inputs/tests

      - name: Download scenarios coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-scenarios
          path: coverage-inputs/scenarios

      - name: Download native extra coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-native-extras
          path: coverage-inputs/native-extras

      - name: Merge coverage
        run: |
          lcov --add-tracefile coverage-inputs/tests/lcov-workspace.info \
            --add-tracefile coverage-inputs/scenarios/lcov-workspace.info \
            --output-file lcov-workspace.info
          lcov --add-tracefile coverage-inputs/tests/lcov.info \
            --add-tracefile coverage-inputs/scenarios/lcov.info \
            --output-file lcov.info
          while IFS= read -r report; do
            lcov --add-tracefile lcov-workspace.info --add-tracefile "$report" --output-file lcov-workspace.info
            lcov --add-tracefile lcov.info --add-tracefile "$report" --output-file lcov.info
          done < <(find coverage-inputs -path '*/ordinary/*/lcov.info' -o -name python.lcov)

      - name: Report patch line coverage
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          just coverage-patch "$BASE_SHA" lcov-workspace.info \
            --repo "$GH_REPO" --pr "$PR_NUMBER" --pr-head "$PR_HEAD_SHA" \
            --source-root-file coverage-inputs/tests/coverage-source-root.txt \
            --source-root-file coverage-inputs/scenarios/coverage-source-root.txt \
            --source-root-file coverage-inputs/native-extras/coverage-source-root.txt

      - name: Check CRAP
        run: just check-coverage

      - name: Upload merged coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          overwrite: true
          path: |
            lcov-workspace.info
            lcov.info
            target/patch-coverage.md
            coverage-inputs/**/coverage-source-root.txt
          if-no-files-found: warn

  # The cross-language client probes: C, C++, Python, Java and Ruby over the shared Rust binding,
  # and independent Go and TypeScript implementations on Node.js and Bun. They need toolchains the
  # suite job does not install and run a feature of their own, so they are a job of their own
  # beside the suite rather than minutes added to its critical path. They run only for a pull
  # request labeled `client-conformance`.
  client-conformance:
    name: client-conformance
    if: contains(github.event.pull_request.labels.*.name, 'client-conformance')
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # The suite budget below is derived from this limit: builds before the scenarios, then at most
    # the budget, then the reserve the harness keeps for its own cleanup and the log upload.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
      NERVIX_TEST_CONCURRENCY_FACTOR: "2"
      # Twenty-nine scenarios finish in a few minutes. A short budget leaves the builds before them
      # up to 40 minutes of the job limit instead of the suite job's 25.
      NERVIX_TEST_SUITE_BUDGET: "15m"
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest,toml-cli,trunk,wild-linker

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      # The same toolchain and flags the other jobs build with, so their compilations are
      # interchangeable in the shared cache rather than a second set of artifacts.
      - name: Configure cargo
        run: |
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install TinyGo
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64|arm64) ;;
            *) echo "unsupported TinyGo CI architecture: ${arch}" >&2; exit 1 ;;
          esac
          curl --retry 3 --retry-delay 2 --retry-max-time 120 --connect-timeout 20 --max-time 120 -fsSLo /tmp/tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_${arch}.deb"
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version

      # The Foreign Function and Memory API the Java probe uses is final from Java 22.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Fiddle's boolean type, which the Ruby probe's signatures use, ships with Ruby 3.3.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install apt deps
        run: |
          sudo apt update
          sudo apt install -y \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure kache daemon remote
        env:
          KACHE_S3_BUCKET: ${{ vars.KACHE_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}
        run: |
          config="${RUNNER_TEMP}/kache-${GITHUB_JOB}.toml"
          bash scripts/configure_kache_remote.sh "${config}"
          echo "KACHE_CONFIG=${config}" >> "${GITHUB_ENV}"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          sync: "false"
          cache-executables: "true"
          max-size: "1TiB"
          manifest-key: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          pr-comment: "false"
          s3-bucket: ${{ vars.KACHE_BUCKET }}
          s3-prefix: "artifacts"
          s3-region: ${{ vars.KACHE_BUCKET_REGION }}
          s3-endpoint: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          s3-access-key-id: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}

      - name: Client conformance
        run: |
          just toolchains-install
          just test-client-conformance

      - name: Publish kache report
        if: always()
        run: python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/kache-report
          if-no-files-found: warn

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-conformance-logs
          path: tests/logs
          if-no-files-found: ignore

  # The checks that answer for the workspace rather than for the scenario suite: undefined
  # behaviour, mutation coverage, benchmark bodies, primitive boundary conformance and completion
  # reachability. None of them reads the suite's result, so they run beside it instead of queueing
  # behind it, and a slow one no longer pushes the suite's job toward its own timeout. The checks
  # that execute Nervix code natively in ordinary mode run instrumented and publish their source
  # coverage from that same run.
  extra-tests:
    name: extra-tests
    # Half the suite job's cores saves capacity. Budget cold ordinary instrumentation,
    # compiler checks and modeled primitive builds.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-mutants,just@latest,toml-cli,trunk,wild-linker

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      # The same toolchain and flags the other jobs build with, so their compilations are
      # interchangeable in the shared cache rather than a second set of artifacts.
      - name: Configure cargo
        run: |
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install TinyGo
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64|arm64) ;;
            *) echo "unsupported TinyGo CI architecture: ${arch}" >&2; exit 1 ;;
          esac
          curl --retry 3 --retry-delay 2 --retry-max-time 120 --connect-timeout 20 --max-time 120 -fsSLo /tmp/tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_${arch}.deb"
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version

      - name: Install apt deps
        run: |
          sudo apt update
          sudo apt install -y \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure kache daemon remote
        env:
          KACHE_S3_BUCKET: ${{ vars.KACHE_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}
        run: |
          config="${RUNNER_TEMP}/kache-${GITHUB_JOB}.toml"
          bash scripts/configure_kache_remote.sh "${config}"
          echo "KACHE_CONFIG=${config}" >> "${GITHUB_ENV}"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          sync: "false"
          cache-executables: "true"
          max-size: "1TiB"
          manifest-key: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          pr-comment: "false"
          s3-bucket: ${{ vars.KACHE_BUCKET }}
          s3-prefix: "artifacts"
          s3-region: ${{ vars.KACHE_BUCKET_REGION }}
          s3-endpoint: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          s3-access-key-id: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}

      # Cheapest first, so a workspace that does not build at all is named in seconds rather than
      # after the heavier compilations have run.
      - name: Capability doctests
        run: |
          just toolchains-install
          just test-capability-docs

      - name: Expiry map Miri
        run: just test-expiry-map-miri

      - name: Expiry map mutation tests
        run: just test-expiry-map-mutants

      - name: Setup uv for runner coverage
        uses: astral-sh/setup-uv@v6

      - name: Patch coverage reporter
        run: |
          just coverage-patch-runner
          pwd > target/coverage-source-root.txt

      - name: Paced simulation Python open policy
        run: just coverage-paced-simulation-python

      - name: Release evidence gate
        run: just coverage-release-evidence

      # The collector that the steps below run their checks through, including its refusal of
      # every incomplete collection.
      - name: Native coverage collector
        run: just coverage-model-runner

      - name: Source contracts, compiler diagnostics and paired API doctests
        run: just coverage-native-extras test-typed-ratchet

      - name: Compiler cache changes, interruption and runner qualification
        run: |
          just qualify-typed-ratchet-cache
          just coverage-typed-ratchet-python

      - name: Primitive source and thread owner validation coverage
        run: just coverage-primitive-boundary

      # Criterion's test mode executes every benchmark body once, catching panics and deadlocks
      # without treating noisy shared-runner timings as a performance regression signal. The run is
      # instrumented for source coverage, so its timings are not a measurement either.
      - name: Benchmark smoke tests
        run: just coverage-native-extras bench-smoke

      # The primitive boundary's native conformance collected separately in every execution mode.
      - name: Primitive boundary conformance
        run: just coverage-native-extras test-primitives

      - name: Primitive boundary compile and browser checks
        run: just test-primitives-compile

      # The walk saturates every core, and its failures are about completion reachability rather
      # than about any one test.
      - name: NSPL completion walk
        run: just coverage-native-extras nspl-completion-walk

      # Each collection's report, completion record, executions and export diagnostics, whatever
      # its verdict: a failed or interrupted record is the evidence of what the collection saw. The
      # raw profiles stay on the runner.
      - name: Upload native extra coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-native-extras
          path: |
            target/native-coverage/**/completion.json
            target/native-coverage/**/lcov.info
            target/native-coverage/**/executions.jsonl
            target/native-coverage/**/export.log
            target/typed-ratchet/python.lcov
            target/model-coverage/python.lcov
            target/primitive-boundary/python.lcov
            target/patch-coverage/python.lcov
            target/paced-simulation/python.lcov
            target/release-evidence-coverage/python.lcov
            target/coverage-source-root.txt
            target/typed-ratchet/cache-qualification/**/qualification.json
          if-no-files-found: warn

      - name: Publish kache report
        if: always()
        run: python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/kache-report
          if-no-files-found: warn

  # Shuttle's in-process scheduling checks and uncontrolled-nondeterminism rechecks run
  # in their own coverage collection job beside the other extra tests, and only for a pull
  # request labeled `shuttle`.
  shuttle:
    name: shuttle
    if: contains(github.event.pull_request.labels.*.name, 'shuttle')
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest,toml-cli,trunk,wild-linker,cargo-llvm-cov

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      - name: Configure cargo
        run: |
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install TinyGo
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64|arm64) ;;
            *) echo "unsupported TinyGo CI architecture: ${arch}" >&2; exit 1 ;;
          esac
          curl -fsSLo /tmp/tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_${arch}.deb"
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version

      - name: Install apt deps
        run: |
          sudo apt update
          sudo apt install -y \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure kache daemon remote
        env:
          KACHE_S3_BUCKET: ${{ vars.KACHE_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}
        run: |
          config="${RUNNER_TEMP}/kache-${GITHUB_JOB}.toml"
          bash scripts/configure_kache_remote.sh "${config}"
          echo "KACHE_CONFIG=${config}" >> "${GITHUB_ENV}"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          sync: "false"
          cache-executables: "true"
          max-size: "1TiB"
          manifest-key: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          pr-comment: "false"
          s3-bucket: ${{ vars.KACHE_BUCKET }}
          s3-prefix: "artifacts"
          s3-region: ${{ vars.KACHE_BUCKET_REGION }}
          s3-endpoint: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          s3-access-key-id: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}

      # Every registered Shuttle check under its exploration and under the nondeterminism detector,
      # each in its own process, then the proof that a failing schedule persists and replays.
      - name: Shuttle concurrency checks
        run: |
          just toolchains-install
          just coverage-native-extras test-shuttle

      - name: Shuttle schedule replay
        run: just test-shuttle-replay-check

      - name: Upload Shuttle coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shuttle
          path: |
            target/native-coverage/**/completion.json
            target/native-coverage/**/lcov.info
            target/native-coverage/**/executions.jsonl
            target/native-coverage/**/export.log
            target/native-coverage/**/models.json
          if-no-files-found: warn

      - name: Publish kache report
        if: always()
        run: python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/kache-report
          if-no-files-found: warn

      # A modeled concurrency failure is only reproducible from the schedule that produced it,
      # and this job is the only witness of that schedule.
      - name: Archive Shuttle failure traces
        if: failure()
        run: |
          if [ -d target/native-coverage-build-shuttle/shuttle-failures ]; then
            tar -czf target/shuttle-failures.tar.gz \
              -C target/native-coverage-build-shuttle shuttle-failures
          fi

      - name: Upload Shuttle failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shuttle-failures
          path: target/shuttle-failures.tar.gz
          if-no-files-found: ignore

  # Loom's memory-ordering models run in their own coverage collection job beside the other extra
  # tests, and only for a pull request labeled `loom`.
  loom:
    name: loom
    if: contains(github.event.pull_request.labels.*.name, 'loom')
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # The models took 10 to 11 minutes on a warm cache. The limit leaves room for a cold
    # instrumented build and for the models the inventory adds.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest,toml-cli,trunk,wild-linker,cargo-llvm-cov

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      - name: Configure cargo
        run: |
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Install apt deps
        run: |
          sudo apt update
          sudo apt install -y \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure kache daemon remote
        env:
          KACHE_S3_BUCKET: ${{ vars.KACHE_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}
        run: |
          config="${RUNNER_TEMP}/kache-${GITHUB_JOB}.toml"
          bash scripts/configure_kache_remote.sh "${config}"
          echo "KACHE_CONFIG=${config}" >> "${GITHUB_ENV}"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          sync: "false"
          cache-executables: "true"
          max-size: "1TiB"
          manifest-key: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          pr-comment: "false"
          s3-bucket: ${{ vars.KACHE_BUCKET }}
          s3-prefix: "artifacts"
          s3-region: ${{ vars.KACHE_BUCKET_REGION }}
          s3-endpoint: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          s3-access-key-id: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}

      # Every registered Loom model of a production owner explored to exhaustion. The proof that
      # each model fails under the ordering weakening it exists to detect runs in the
      # loom-qualification jobs.
      - name: Loom memory-ordering models
        run: |
          just toolchains-install
          just coverage-native-extras test-loom

      - name: Upload Loom coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-loom
          path: |
            target/native-coverage/**/completion.json
            target/native-coverage/**/lcov.info
            target/native-coverage/**/executions.jsonl
            target/native-coverage/**/export.log
            target/native-coverage/**/models.json
          if-no-files-found: warn

      - name: Publish kache report
        if: always()
        run: python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/kache-report
          if-no-files-found: warn

      # A failed Loom model is only reproducible from the checkpoint of the execution that failed;
      # this job is the only witness of it.
      - name: Upload Loom failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loom-failures
          path: target/native-coverage-build-loom/loom-failures
          if-no-files-found: ignore

  # The proof that each Loom model fails under the ordering weakening it exists to detect. Jobs of
  # their own because every qualification that weakens the server rebuilds the server library in
  # Loom's test mode with its one weakening applied, which outlasts the other extra tests; the
  # shards split those rebuilds. Like the `loom` job, they run only for a pull request labeled
  # `loom`.
  loom-qualification:
    name: loom-qualification (${{ matrix.shard }} of ${{ strategy.job-total }})
    if: contains(github.event.pull_request.labels.*.name, 'loom')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest,toml-cli,trunk,wild-linker

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      - name: Configure cargo
        run: |
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install TinyGo
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64|arm64) ;;
            *) echo "unsupported TinyGo CI architecture: ${arch}" >&2; exit 1 ;;
          esac
          curl -fsSLo /tmp/tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_${arch}.deb"
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version

      - name: Install apt deps
        run: |
          sudo apt update
          sudo apt install -y \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure kache daemon remote
        env:
          KACHE_S3_BUCKET: ${{ vars.KACHE_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}
        run: |
          config="${RUNNER_TEMP}/kache-${GITHUB_JOB}.toml"
          bash scripts/configure_kache_remote.sh "${config}"
          echo "KACHE_CONFIG=${config}" >> "${GITHUB_ENV}"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          sync: "false"
          cache-executables: "true"
          max-size: "1TiB"
          manifest-key: ${{ github.job }}-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}
          pr-comment: "false"
          s3-bucket: ${{ vars.KACHE_BUCKET }}
          s3-prefix: "artifacts"
          s3-region: ${{ vars.KACHE_BUCKET_REGION }}
          s3-endpoint: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          s3-access-key-id: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}

      - name: Loom ordering qualification
        run: |
          just toolchains-install
          just test-loom-qualification ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Publish kache report
        if: always()
        run: python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/kache-report
          if-no-files-found: warn

      # A failed qualification is only reproducible from its weakened run; this job is the only
      # witness of it.
      - name: Upload Loom qualification evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loom-qualification-failures-${{ matrix.shard }}
          path: |
            target/loom-qualification/*/*.log
            target/loom-qualification/*/*.json
          if-no-files-found: ignore

  # Turmoil's seeded network simulations of the interconnect: every scenario over its committed
  # regression seeds, then a fresh-process replay of an injected failure. A job of its own beside
  # the default suite and the Shuttle checks, because its build enables the `turmoil` feature and
  # `tokio_unstable` and so shares no compilation with either, and because a failed scenario's
  # record is this job's artifact. It runs only for a pull request labeled `turmoil`.
  turmoil:
    name: turmoil
    if: contains(github.event.pull_request.labels.*.name, 'turmoil')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # The emergency guard around the build, the tests and the upload. The tests end themselves
    # first: every run has its own real-time bound, and `just test-turmoil` gives all of them
    # together an 8-minute budget, which ends a wedged run with status 124 and leaves the record
    # upload its time.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest,toml-cli,wild-linker

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      # The interconnect's wire properties take their vocabulary values from the generator crate,
      # whose WASM protocol bindings are generated when it is built.
      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      # The same toolchain and flags the other jobs build with, so the dependencies this build
      # shares with them compile identically.
      - name: Configure cargo
        run: |
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure kache daemon remote
        env:
          KACHE_S3_BUCKET: ${{ vars.KACHE_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}
        run: |
          config="${RUNNER_TEMP}/kache-${GITHUB_JOB}.toml"
          bash scripts/configure_kache_remote.sh "${config}"
          echo "KACHE_CONFIG=${config}" >> "${GITHUB_ENV}"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          sync: "false"
          cache-executables: "true"
          max-size: "1TiB"
          manifest-key: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          pr-comment: "false"
          s3-bucket: ${{ vars.KACHE_BUCKET }}
          s3-prefix: "artifacts"
          s3-region: ${{ vars.KACHE_BUCKET_REGION }}
          s3-endpoint: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          s3-access-key-id: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}

      - name: Turmoil simulations
        run: |
          just toolchains-install
          just test-turmoil

      - name: Turmoil failure replay
        run: just test-turmoil-replay-check

      - name: Publish kache report
        if: always()
        run: python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/kache-report
          if-no-files-found: warn

      # A failed scenario is reproducible only from its record: the seed and every other input,
      # the build it ran on, and its semantic trace up to the failure. This job is the only
      # witness of them.
      - name: Upload Turmoil failure records
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: turmoil-failures
          path: |
            target/turmoil-failures
            target/turmoil-suite
          if-no-files-found: ignore
