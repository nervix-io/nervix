name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

env:
  # Boat machines set en_US.UTF-8, whose collation orders `sort` output differently. Keep the
  # C.UTF-8 locale of GitHub's runner image, which the scripts and their tests expect.
  LC_ALL: C.UTF-8
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # scripts/kache_remote.py lets each job's local store hold a quarter of its cache volume, so a
  # runner's disk still sets the store's budget.
  KACHE_VERSION: "1.2.2"
  KACHE_REMOTE_KEY_LISTING: "false"
  # Kache disables free-space recovery in CI unless a decimal-byte floor is explicit: 64 GiB.
  KACHE_AUTO_RECOVER_MIN_FREE_BYTES: "68719476736"
  TINYGO_VERSION: "0.41.1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide from the exact tested diff before starting any ordinary producer. A validation-only
  # rerun retains this decision; cancellation is never interpreted as completed test evidence.
  test-selection:
    name: test-selection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tests-required: ${{ steps.selection.outputs.tests-required }}
      bolero-required: ${{ steps.selection.outputs.bolero-required }}
    steps:
      - name: Checkout tested merge
        uses: actions/checkout@v4
        with:
          # The tested merge and its parents. Selection fetches the tested base's commit history with
          # these credentials only when GitHub merged into a base that advanced past the event's.
          fetch-depth: 2
          persist-credentials: true

      - name: Select required suites from the tested diff
        id: selection
        run: python3 scripts/ci_test_selection.py --record target/ci-test-selection.json

      - name: Retain the source selection
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-selection
          path: target/ci-test-selection.json
          if-no-files-found: error

  bolero:
    needs: [test-selection]
    if: needs.test-selection.outputs.bolero-required == 'true'
    uses: ./.github/workflows/bolero.yaml
    permissions:
      contents: read
    secrets: inherit
    with:
      tested-sha: ${{ github.sha }}
      event-name: ${{ github.event_name }}
      labels-json: ${{ toJSON(github.event.pull_request.labels.*.name) }}

  conventional-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: false
      - uses: CondeNast/conventional-pull-request-action@v0.2.0
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ignoreCommits: 'true'
          commitlintRulesPath: ./commitlint.config.js

  checks:
    name: checks
    runs-on: boat-xlarge
    # Cold validation includes Clippy and the complete compiler matrix.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      # `just validate-dns-dependencies` needs ripgrep, which a runner image need not provide.
      # install-action has no package of its own for ripgrep, so cargo-binstall installs it.
      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,typos-cli,cargo-audit,cargo-mutants,taplo-cli,just@latest,cargo-autoinherit,trunk,wild-linker,ripgrep
          fallback: cargo-binstall

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      - name: Configure cargo
        run: |
          # A machine whose rustup is installed system-wide, as on Boat, has no Cargo home yet.
          mkdir -p ~/.cargo
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.26" # Use your desired Go version

      - name: Install TinyGo
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64|arm64) ;;
            *) echo "unsupported TinyGo CI architecture: ${arch}" >&2; exit 1 ;;
          esac
          curl --retry 3 --retry-delay 2 --retry-max-time 120 --connect-timeout 20 --max-time 120 -fsSLo /tmp/tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_${arch}.deb"
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version

      - name: Install dockerfmt
        run: python3 scripts/install_go_ci_tool.py dockerfmt "${RUNNER_TEMP}/go-tool-bootstrap"

      - name: Install ghokin
        run: python3 scripts/install_go_ci_tool.py ghokin "${RUNNER_TEMP}/go-tool-bootstrap"

      # Boat's base image has Ubuntu's git 2.43, and the test selection passes `--no-lazy-fetch`,
      # which git 2.44 added. GitHub's runner image takes the current git from this PPA too.
      - name: Install the current git
        run: |
          sudo add-apt-repository --yes ppa:git-core/ppa
          sudo apt-get install --yes --no-install-recommends git

      - name: Install apt deps and current GitHub CLI
        run: |
          set -euo pipefail
          gh_keyring="$(mktemp)"
          curl -fsSL -o "${gh_keyring}" https://cli.github.com/packages/githubcli-archive-keyring.gpg
          sudo install -D -m 644 "${gh_keyring}" /etc/apt/keyrings/githubcli-archive-keyring.gpg
          rm "${gh_keyring}"
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install -y \
            gh \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          cache-executables: "true"
          pr-comment: "false"

      - name: Start kache remote
        env:
          KACHE_MANIFEST_KEY: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          KACHE_S3_BUCKET: ${{ secrets.KACHE_EU_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ secrets.KACHE_EU_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_EU_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_EU_BUCKET_SECRET_ACCESS_KEY }}
        run: python3 scripts/kache_remote.py start

      - name: Runner diagnostics before Validate
        uses: ./.github/actions/runner-diagnostics
        with:
          label: validate

      - name: Validate
        run: |
          just toolchains-install
          just validate-ci
        env:
          GH_TOKEN: ${{ github.token }}

      # Every script test, the book tooling's and the docs worker's included, for every pull request:
      # the book build that also runs them runs only for a pull request labeled `book`.
      - name: Setup uv for the script tests
        uses: astral-sh/setup-uv@v6

      # The docs worker's tests run under Node.js. Boat's own Node.js comes from nvm, which a job's
      # shell may not load.
      - name: Setup Node.js for the docs worker's tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Script tests
        run: just test-docs

      - name: Publish kache cache
        if: always()
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -f scripts/kache_remote.py ]]; then
            python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache publication did not run because checkout did not provide its script"
          fi

      - name: Publish kache report
        if: always()
        run: |
          if [[ -f scripts/publish_kache_report.py ]]; then
            python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache report unavailable because checkout did not provide its script"
          fi

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/kache-report
          if-no-files-found: warn

      - name: Upload Go tool bootstrap logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-tool-bootstrap-${{ github.job }}
          path: ${{ runner.temp }}/go-tool-bootstrap
          if-no-files-found: ignore

  # Diagnostic coverage is a distinct execution mode and never contributes to native cost counts.
  diagnostic-evidence:
    name: diagnostic-evidence
    needs: [test-selection]
    if: needs.test-selection.outputs.tests-required == 'true'
    runs-on: boat-xlarge
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: llvm-tools

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest,cargo-llvm-cov,wild-linker

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      - name: Configure cargo
        run: |
          # A machine whose rustup is installed system-wide, as on Boat, has no Cargo home yet.
          mkdir -p ~/.cargo
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          cache-executables: "true"
          pr-comment: "false"

      - name: Start kache remote
        env:
          KACHE_MANIFEST_KEY: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          KACHE_S3_BUCKET: ${{ secrets.KACHE_EU_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ secrets.KACHE_EU_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_EU_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_EU_BUCKET_SECRET_ACCESS_KEY }}
        run: python3 scripts/kache_remote.py start

      - name: Start recording runner load
        uses: ./.github/actions/runner-load
        with:
          phase: start

      - name: Runner diagnostics before Check diagnostic evidence and report tool coverage
        uses: ./.github/actions/runner-diagnostics
        with:
          label: check-diagnostic-evidence-and-report-tool-coverage

      - name: Check diagnostic evidence and report tool coverage
        run: just coverage-deadlock
        env:
          NERVIX_DEADLOCK_PROBE_ARTIFACTS: target/diagnostic-evidence/probes

      - name: Publish runner load
        if: always()
        uses: ./.github/actions/runner-load
        with:
          phase: finish
          artifact-name: runner-load-diagnostic-evidence

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-evidence
          path: |
            target/deadlock.lcov
            target/diagnostic-evidence
            target/native-coverage/test-deadlock-*/**/completion.json
            target/native-coverage/test-deadlock-*/**/lcov.info
            target/native-coverage/test-deadlock-*/**/executions.jsonl
            target/native-coverage/test-deadlock-*/**/export.log
          if-no-files-found: warn

      - name: Publish kache cache
        if: always()
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -f scripts/kache_remote.py ]]; then
            python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache publication did not run because checkout did not provide its script"
          fi

      - name: Publish kache report
        if: always()
        run: |
          if [[ -f scripts/publish_kache_report.py ]]; then
            python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache report unavailable because checkout did not provide its script"
          fi

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          overwrite: true
          path: ${{ runner.temp }}/kache-report
          if-no-files-found: warn

  # The Deloxide diagnostic lane, only for a pull request labeled `deloxide`: every workload
  # tests/deloxide-inventory.toml registers, each selection on a runner of its own in the
  # instrumented build of the feature it compiles under the native coverage collector, then the
  # qualification of the lane's supervision on deliberately failing processes. Each selection keeps
  # its own budget, so the stressed restore scenarios, which share the stress selection's build,
  # run beside it rather than after it. Diagnostic coverage stays in this job's artifact, apart
  # from ordinary coverage and its CRAP report.
  deloxide:
    name: deloxide (${{ matrix.selection }})
    if: contains(github.event.pull_request.labels.*.name, 'deloxide')
    runs-on: boat-xlarge
    # Setup, then at most the lane's bound, the qualification's bound and the reserve the uploads
    # and the kache report keep after them, within the six hours a Boat CI job may run.
    timeout-minutes: 360
    strategy:
      # Each selection's verdict and evidence stand on their own.
      fail-fast: false
      matrix:
        selection: [deloxide, deloxide-order, deloxide-stress, deloxide-stress-restore]
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
      SELECTION: ${{ matrix.selection }}
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest,cargo-llvm-cov,trunk,wild-linker

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      - name: Configure cargo
        run: |
          # A machine whose rustup is installed system-wide, as on Boat, has no Cargo home yet.
          mkdir -p ~/.cargo
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install TinyGo
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64|arm64) ;;
            *) echo "unsupported TinyGo CI architecture: ${arch}" >&2; exit 1 ;;
          esac
          curl --retry 3 --retry-delay 2 --retry-max-time 120 --connect-timeout 20 --max-time 120 -fsSLo /tmp/tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_${arch}.deb"
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version

      - name: Install apt deps
        run: |
          sudo apt update
          sudo apt install -y \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          cache-executables: "true"
          pr-comment: "false"

      - name: Start kache remote
        env:
          KACHE_MANIFEST_KEY: ${{ github.job }}-${{ matrix.selection }}-${{ runner.os }}-${{ runner.arch }}
          KACHE_S3_BUCKET: ${{ secrets.KACHE_EU_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ secrets.KACHE_EU_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_EU_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_EU_BUCKET_SECRET_ACCESS_KEY }}
        run: python3 scripts/kache_remote.py start

      # The bound covers prerequisites, the inventory's separate build and workload budgets,
      # and the coverage export. At its end the collector and the lane each
      # record their attempt as interrupted and end every process they started.
      - name: Start recording runner load
        uses: ./.github/actions/runner-load
        with:
          phase: start

      - name: Runner diagnostics before Diagnostic lane
        uses: ./.github/actions/runner-diagnostics
        with:
          label: diagnostic-lane

      # The lane's 335 minutes begin with its build and end with its coverage export.
      - name: Build the diagnostic lane
        run: |
          just toolchains-install
          echo "LANE_DEADLINE=$(( $(date +%s) + 335 * 60 ))" >> "${GITHUB_ENV}"
          timeout --signal=TERM --kill-after=60 335m just coverage-native-extras-build "test-${SELECTION}"

      # The cache the build filled is published before the run starts: the run's outcome cannot lose
      # it, the jobs building beside this one can use it, and its report shows what the build
      # compiled and what the cache served.
      - name: Publish kache cache after the build
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-build-report"

      - name: Publish kache report after the build
        run: python3 scripts/publish_kache_report.py --phase build "${RUNNER_TEMP}/kache-build-report"

      - name: Diagnostic lane
        run: |
          remaining=$(( LANE_DEADLINE - $(date +%s) ))
          if (( remaining <= 0 )); then
            echo "::error::The diagnostic lane's build used its whole 335-minute bound"
            exit 124
          fi
          timeout --signal=TERM --kill-after=60 "${remaining}s" just coverage-native-extras "test-${SELECTION}"

      - name: Runner diagnostics before Supervision qualification
        uses: ./.github/actions/runner-diagnostics
        with:
          label: supervision-qualification

      - name: Supervision qualification
        run: timeout --signal=TERM --kill-after=60 10m just test-deloxide-qualification "${SELECTION}"

      # Every attempt's record, logs, evidence and finding descriptions, whatever its verdict: a
      # failed lane is investigated and replayed from what it kept. The raw profiles stay here.
      - name: Publish runner load
        if: always()
        uses: ./.github/actions/runner-load
        with:
          phase: finish
          artifact-name: runner-load-deloxide-${{ matrix.selection }}

      - name: Upload diagnostic lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deloxide-${{ matrix.selection }}
          path: |
            target/native-coverage/test-${{ matrix.selection }}/**/completion.json
            target/native-coverage/test-${{ matrix.selection }}/**/lcov.info
            target/native-coverage/test-${{ matrix.selection }}/**/executions.jsonl
            target/native-coverage/test-${{ matrix.selection }}/**/export.log
            target/native-coverage/test-${{ matrix.selection }}/**/lane.json
            target/native-coverage-build-deloxide*/test-deloxide/${{ matrix.selection }}/
            target/deloxide/test-deloxide/
          if-no-files-found: warn

      - name: Publish kache cache
        if: always()
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -f scripts/kache_remote.py ]]; then
            python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache publication did not run because checkout did not provide its script"
          fi

      - name: Publish kache report
        if: always()
        run: python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ matrix.selection }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/kache-report
            ${{ runner.temp }}/kache-build-report
          if-no-files-found: warn

  tests:
    name: tests
    needs: [test-selection]
    if: needs.test-selection.outputs.tests-required == 'true'
    runs-on: boat-xlarge
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest,cargo-llvm-cov,trunk,wild-linker

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      - name: Configure cargo
        run: |
          # A machine whose rustup is installed system-wide, as on Boat, has no Cargo home yet.
          mkdir -p ~/.cargo
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install TinyGo
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64|arm64) ;;
            *) echo "unsupported TinyGo CI architecture: ${arch}" >&2; exit 1 ;;
          esac
          curl --retry 3 --retry-delay 2 --retry-max-time 120 --connect-timeout 20 --max-time 120 -fsSLo /tmp/tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_${arch}.deb"
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version

      - name: Install dockerfmt
        run: python3 scripts/install_go_ci_tool.py dockerfmt "${RUNNER_TEMP}/go-tool-bootstrap"

      # Boat's own Node.js comes from nvm, which a job's shell may not load, so a global install
      # goes into the Node.js this step pins instead.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install playwright
        run: |
          npm install -g playwright

      - name: Install apt deps
        run: |
          sudo apt update
          sudo apt install -y \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          cache-executables: "true"
          pr-comment: "false"

      - name: Start kache remote
        env:
          KACHE_MANIFEST_KEY: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          KACHE_S3_BUCKET: ${{ secrets.KACHE_EU_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ secrets.KACHE_EU_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_EU_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_EU_BUCKET_SECRET_ACCESS_KEY }}
        run: python3 scripts/kache_remote.py start

      - name: Start runner load recorder
        run: |
          python3 scripts/record_runner_load.py "${RUNNER_TEMP}/runner-load.csv" "${RUNNER_TEMP}/runner-load.md" > "${RUNNER_TEMP}/runner-load.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/runner-load.pid"

      - name: Runner diagnostics before Tests coverage
        uses: ./.github/actions/runner-diagnostics
        with:
          label: tests-coverage

      - name: Build the coverage test binaries
        run: |
          just toolchains-install
          just test-coverage-build

      # The cache the build filled is published before the run starts: the run's outcome cannot lose
      # it, the jobs building beside this one can use it, and its report shows what the build
      # compiled and what the cache served.
      - name: Publish kache cache after the build
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-build-report"

      - name: Publish kache report after the build
        run: python3 scripts/publish_kache_report.py --phase build "${RUNNER_TEMP}/kache-build-report"

      - name: Tests coverage
        run: just test-coverage-run

      - name: Upload tests coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-tests
          path: |
            lcov-workspace.info
            coverage-source-root.txt
          if-no-files-found: warn

      - name: Publish runner load
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/runner-load.pid" ]]; then
            kill -TERM "$(cat "${RUNNER_TEMP}/runner-load.pid")" || true
            for _ in {1..10}; do
              [[ -f "${RUNNER_TEMP}/runner-load.md" ]] && break
              sleep 1
            done
          fi
          if [[ -f "${RUNNER_TEMP}/runner-load.md" ]]; then
            cat "${RUNNER_TEMP}/runner-load.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload runner load
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-load-${{ github.job }}
          path: |
            ${{ runner.temp }}/runner-load.csv
            ${{ runner.temp }}/runner-load.md
            ${{ runner.temp }}/runner-load.log
          if-no-files-found: warn

      - name: Publish kache cache
        if: always()
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -f scripts/kache_remote.py ]]; then
            python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache publication did not run because checkout did not provide its script"
          fi

      - name: Publish kache report
        if: always()
        run: |
          if [[ -f scripts/publish_kache_report.py ]]; then
            python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache report unavailable because checkout did not provide its script"
          fi

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/kache-report
            ${{ runner.temp }}/kache-build-report
          if-no-files-found: warn

      - name: Upload Go tool bootstrap logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-tool-bootstrap-${{ github.job }}
          path: ${{ runner.temp }}/go-tool-bootstrap
          if-no-files-found: ignore

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: tests/logs
          if-no-files-found: ignore

  scenarios:
    name: scenarios
    needs: [test-selection]
    if: needs.test-selection.outputs.tests-required == 'true'
    runs-on: boat-xlarge
    # The harness derives 105 minutes of scenarios from this limit, with 35 for setup/builds and
    # 15 for cleanup/export/uploads. Keep tests/common/suite_watchdog.rs in step.
    timeout-minutes: 155
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
      # 48 slots on the 16-CPU runner. Every scenario's steps run on one runner thread, and 64 slots
      # (Check 40358096404) kept that thread on a CPU for 86% of the run, made every scenario about
      # 45% slower and raised no throughput; see the run slots in docs/src/integration-test-lifecycle.md.
      NERVIX_TEST_CONCURRENCY_FACTOR: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest,cargo-llvm-cov,trunk,wild-linker

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      - name: Configure cargo
        run: |
          # A machine whose rustup is installed system-wide, as on Boat, has no Cargo home yet.
          mkdir -p ~/.cargo
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install TinyGo
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64|arm64) ;;
            *) echo "unsupported TinyGo CI architecture: ${arch}" >&2; exit 1 ;;
          esac
          curl --retry 3 --retry-delay 2 --retry-max-time 120 --connect-timeout 20 --max-time 120 -fsSLo /tmp/tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_${arch}.deb"
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version

      - name: Install dockerfmt
        run: python3 scripts/install_go_ci_tool.py dockerfmt "${RUNNER_TEMP}/go-tool-bootstrap"

      # Boat's own Node.js comes from nvm, which a job's shell may not load, so a global install
      # goes into the Node.js this step pins instead.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install playwright
        run: |
          npm install -g playwright

      - name: Install apt deps
        run: |
          sudo apt update
          sudo apt install -y \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          cache-executables: "true"
          pr-comment: "false"

      - name: Start kache remote
        env:
          KACHE_MANIFEST_KEY: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          KACHE_S3_BUCKET: ${{ secrets.KACHE_EU_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ secrets.KACHE_EU_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_EU_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_EU_BUCKET_SECRET_ACCESS_KEY }}
        run: python3 scripts/kache_remote.py start

      - name: Start runner load recorder
        run: |
          python3 scripts/record_runner_load.py "${RUNNER_TEMP}/runner-load.csv" "${RUNNER_TEMP}/runner-load.md" > "${RUNNER_TEMP}/runner-load.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/runner-load.pid"

      - name: Setup uv for Python driver coverage
        uses: astral-sh/setup-uv@v6

      - name: Runner diagnostics before Scenario coverage
        uses: ./.github/actions/runner-diagnostics
        with:
          label: scenario-coverage

      - name: Build the scenario suite
        run: |
          just toolchains-install
          just test-scenarios-coverage-build

      # The cache the build filled is published before the run starts: the run's outcome cannot lose
      # it, the jobs building beside this one can use it, and its report shows what the build
      # compiled and what the cache served.
      - name: Publish kache cache after the build
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-build-report"

      - name: Publish kache report after the build
        run: python3 scripts/publish_kache_report.py --phase build "${RUNNER_TEMP}/kache-build-report"

      - name: Scenario coverage
        run: just test-scenarios-coverage-run

      # These bodies must fail. The supervisor separately requires complete after-hook cleanup;
      # their failure status is preserved and contributes no ordinary coverage verdict.
      - name: Failed backup cut cleanup
        run: just test-backup-cut-cleanup

      - name: Upload failed backup cut cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-cut-cleanup
          path: target/backup-cut-cleanup.*
          if-no-files-found: warn

      - name: Upload scenarios coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-scenarios
          overwrite: true
          path: |
            lcov-workspace.info
            coverage-source-root.txt
            target/paced-simulation/python.lcov
          if-no-files-found: warn

      - name: Publish runner load
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/runner-load.pid" ]]; then
            kill -TERM "$(cat "${RUNNER_TEMP}/runner-load.pid")" || true
            for _ in {1..10}; do
              [[ -f "${RUNNER_TEMP}/runner-load.md" ]] && break
              sleep 1
            done
          fi
          if [[ -f "${RUNNER_TEMP}/runner-load.md" ]]; then
            cat "${RUNNER_TEMP}/runner-load.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload runner load
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-load-${{ github.job }}
          overwrite: true
          path: |
            ${{ runner.temp }}/runner-load.csv
            ${{ runner.temp }}/runner-load.md
            ${{ runner.temp }}/runner-load.log
          if-no-files-found: warn

      - name: Publish suite summary
        if: always()
        run: |
          if [[ -f tests/logs/suite-summary.md ]]; then
            cat tests/logs/suite-summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Publish kache cache
        if: always()
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -f scripts/kache_remote.py ]]; then
            python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache publication did not run because checkout did not provide its script"
          fi

      - name: Publish kache report
        if: always()
        run: |
          if [[ -f scripts/publish_kache_report.py ]]; then
            python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache report unavailable because checkout did not provide its script"
          fi

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          overwrite: true
          path: |
            ${{ runner.temp }}/kache-report
            ${{ runner.temp }}/kache-build-report
          if-no-files-found: warn

      - name: Upload Go tool bootstrap logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-tool-bootstrap-${{ github.job }}
          path: ${{ runner.temp }}/go-tool-bootstrap
          if-no-files-found: ignore

      - name: Upload scenario logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-logs
          overwrite: true
          path: tests/logs
          if-no-files-found: ignore

  coverage:
    name: coverage
    needs: [tests, scenarios, extra-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          cache-executables: "true"
          pr-comment: "false"

      - name: Start kache remote
        env:
          KACHE_MANIFEST_KEY: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          KACHE_S3_BUCKET: ${{ vars.KACHE_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ vars.KACHE_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_BUCKET_SECRET_ACCESS_KEY }}
        run: python3 scripts/kache_remote.py start

      # The CRAP report runs the cargo-crap version scripts/cargo_crap.py pins, built through kache.
      - name: Runner diagnostics before Install the pinned complexity analyzer
        uses: ./.github/actions/runner-diagnostics
        with:
          label: install-the-pinned-complexity-analyzer

      - name: Install the pinned complexity analyzer
        run: just install-cargo-crap

      - name: Download tests coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-tests
          path: coverage-inputs/tests

      - name: Download scenarios coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-scenarios
          path: coverage-inputs/scenarios

      - name: Download native extra coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-native-extras
          path: coverage-inputs/native-extras

      # One repository-relative report of the ordinary producers, which every step below reads. The
      # merge leaves out the collections of other modes the native extras artifact holds, and fails
      # rather than publish an incomplete report.
      - name: Merge coverage
        run: just coverage-merge coverage-inputs/tests coverage-inputs/scenarios coverage-inputs/native-extras

      # The pinned cargo-crap scores the repository's Rust sources against the merged report. No score
      # fails the step: it fails only when the analysis cannot describe the report, and it writes its
      # JSON and Markdown reports either way.
      - name: Report CRAP
        run: just check-coverage

      # The comment carries the CRAP section for the files the pull request changes, or the CRAP
      # step's failure, or that its report is missing.
      - name: Report patch line coverage
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          just coverage-patch "$BASE_SHA" lcov-workspace.info \
            --crap target/crap-report/crap.json \
            --repo "$GH_REPO" --pr "$PR_NUMBER" --pr-head "$PR_HEAD_SHA"

      - name: Upload merged coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          overwrite: true
          path: |
            lcov-workspace.info
            target/coverage-merge/record.json
            target/patch-coverage.md
            target/crap-report/crap.json
            target/crap-report/crap.md
          if-no-files-found: warn

      - name: Publish kache cache
        if: always()
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -f scripts/kache_remote.py ]]; then
            python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache publication did not run because checkout did not provide its script"
          fi

      - name: Publish kache report
        if: always()
        run: |
          if [[ -f scripts/publish_kache_report.py ]]; then
            python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache report unavailable because checkout did not provide its script"
          fi

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/kache-report
          if-no-files-found: warn

  # The workspace line-coverage union of every producer this run's event and labels select: the
  # ordinary report, the modeled and diagnostic native collections, and the live fuzz campaigns a
  # pull request carrying `fuzz` requests. It waits for every producer job, including a skipped or
  # failed one, so a producer that did not succeed fails the union instead of hiding behind a skip.
  # It downloads the exported reports and records and rebuilds nothing. The ordinary report, its
  # CRAP report and its patch coverage stay with the coverage job.
  coverage-full:
    name: coverage-full
    needs: [test-selection, bolero, coverage, extra-tests, diagnostic-evidence, shuttle, loom, turmoil, deloxide]
    if: ${{ !cancelled() && (needs.test-selection.result != 'success' || needs.test-selection.outputs.tests-required == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The justfile reads the repository toolchain with Python's TOML parser when it loads.
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Record the event, labels and producer results
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          TESTS_REQUIRED: ${{ needs.test-selection.outputs.tests-required }}
          BOLERO_REQUIRED: ${{ needs.test-selection.outputs.bolero-required }}
          JOBS: ${{ toJSON(needs) }}
        run: |
          just coverage-full-select --event "$EVENT" --labels "$LABELS" \
            --tests-required "$TESTS_REQUIRED" --bolero-required "$BOLERO_REQUIRED" --jobs "$JOBS"

      - name: Download ordinary coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-merged
          path: coverage-full-inputs

      - name: Download native extra coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-native-extras
          path: coverage-full-inputs

      - name: Download diagnostic evidence
        uses: actions/download-artifact@v4
        with:
          pattern: diagnostic-evidence
          path: coverage-full-inputs

      # The artifacts of label-enabled producers and of the Bolero call. A pattern that matches no
      # artifact downloads nothing; the union then names what the selection required and lacks.
      - name: Download Shuttle coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shuttle
          path: coverage-full-inputs

      - name: Download Loom coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-loom
          path: coverage-full-inputs

      - name: Download Turmoil coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-turmoil
          path: coverage-full-inputs

      - name: Download Deloxide lane coverage
        uses: actions/download-artifact@v4
        with:
          pattern: deloxide-*
          path: coverage-full-inputs

      - name: Download combined fuzz coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-bolero-fuzz
          path: coverage-full-inputs

      - name: Download Bolero selection
        uses: actions/download-artifact@v4
        with:
          pattern: bolero-selection
          path: coverage-full-inputs

      - name: Combine coverage
        if: ${{ !cancelled() }}
        run: just coverage-full coverage-full-inputs/*

      - name: Upload full coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-full
          path: |
            target/coverage-full/lcov-full.info
            target/coverage-full/beyond-ordinary.info
            target/coverage-full/record.json
            target/coverage-full/selection.json
            target/coverage-full/summary.md
          if-no-files-found: warn

  # The cross-language client probes: C, C++, Python, Java and Ruby over the shared Rust binding,
  # and independent Go and TypeScript implementations on Node.js and Bun. They need toolchains the
  # suite job does not install and run a feature of their own, so they are a job of their own
  # beside the suite rather than minutes added to its critical path. They run only for a pull
  # request labeled `client-conformance`.
  client-conformance:
    name: client-conformance
    if: contains(github.event.pull_request.labels.*.name, 'client-conformance')
    runs-on: boat-xlarge
    # The suite budget below is derived from this limit: builds before the scenarios, then at most
    # the budget, then the reserve the harness keeps for its own cleanup and the log upload.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
      NERVIX_TEST_CONCURRENCY_FACTOR: "2"
      # Twenty-nine scenarios finish in a few minutes. A short budget leaves the builds before them
      # up to 40 minutes of the job limit instead of the suite job's 25.
      NERVIX_TEST_SUITE_BUDGET: "15m"
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest,trunk,wild-linker

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      # The same toolchain and flags the other jobs build with, so their compilations are
      # interchangeable in the shared cache rather than a second set of artifacts.
      - name: Configure cargo
        run: |
          # A machine whose rustup is installed system-wide, as on Boat, has no Cargo home yet.
          mkdir -p ~/.cargo
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install TinyGo
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64|arm64) ;;
            *) echo "unsupported TinyGo CI architecture: ${arch}" >&2; exit 1 ;;
          esac
          curl --retry 3 --retry-delay 2 --retry-max-time 120 --connect-timeout 20 --max-time 120 -fsSLo /tmp/tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_${arch}.deb"
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version

      # The Foreign Function and Memory API the Java probe uses is final from Java 22.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # setup-ruby extracts its prebuilt Ruby to /opt/hostedtoolcache, the prefix the build embeds,
      # without sudo. A Boat machine has no such directory.
      - name: Create the hosted tool cache
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/hostedtoolcache

      # Fiddle's boolean type, which the Ruby probe's signatures use, ships with Ruby 3.3.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install apt deps
        run: |
          sudo apt update
          sudo apt install -y \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          cache-executables: "true"
          pr-comment: "false"

      - name: Start kache remote
        env:
          KACHE_MANIFEST_KEY: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          KACHE_S3_BUCKET: ${{ secrets.KACHE_EU_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ secrets.KACHE_EU_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_EU_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_EU_BUCKET_SECRET_ACCESS_KEY }}
        run: python3 scripts/kache_remote.py start

      - name: Start recording runner load
        uses: ./.github/actions/runner-load
        with:
          phase: start

      - name: Runner diagnostics before Client conformance
        uses: ./.github/actions/runner-diagnostics
        with:
          label: client-conformance

      - name: Build the conformance probes and suite
        run: |
          just toolchains-install
          just build-client-conformance-tests

      # The cache the build filled is published before the run starts: the run's outcome cannot lose
      # it, the jobs building beside this one can use it, and its report shows what the build
      # compiled and what the cache served.
      - name: Publish kache cache after the build
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-build-report"

      - name: Publish kache report after the build
        run: python3 scripts/publish_kache_report.py --phase build "${RUNNER_TEMP}/kache-build-report"

      - name: Client conformance
        run: just test-client-conformance-run

      - name: Publish runner load
        if: always()
        uses: ./.github/actions/runner-load
        with:
          phase: finish
          artifact-name: runner-load-client-conformance

      - name: Publish kache cache
        if: always()
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -f scripts/kache_remote.py ]]; then
            python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache publication did not run because checkout did not provide its script"
          fi

      - name: Publish kache report
        if: always()
        run: python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/kache-report
            ${{ runner.temp }}/kache-build-report
          if-no-files-found: warn

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-conformance-logs
          path: tests/logs
          if-no-files-found: ignore

  # The checks that answer for the workspace rather than for the scenario suite: undefined
  # behaviour, mutation coverage, benchmark bodies, primitive boundary conformance and completion
  # reachability. None of them reads the suite's result, so they run beside it instead of queueing
  # behind it, and a slow one no longer pushes the suite's job toward its own timeout. The checks
  # that execute Nervix code natively in ordinary mode run instrumented and publish their source
  # coverage from that same run.
  extra-tests:
    name: extra-tests
    needs: [test-selection]
    if: needs.test-selection.outputs.tests-required == 'true'
    # Its builds fill about 95 GiB of disk, which only Boat's largest machine holds with room to
    # spare. Budget cold ordinary instrumentation, compiler checks and modeled primitive builds.
    runs-on: boat-xlarge
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-mutants,just@latest,trunk,wild-linker

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      # The same toolchain and flags the other jobs build with, so their compilations are
      # interchangeable in the shared cache rather than a second set of artifacts.
      - name: Configure cargo
        run: |
          # A machine whose rustup is installed system-wide, as on Boat, has no Cargo home yet.
          mkdir -p ~/.cargo
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install TinyGo
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64|arm64) ;;
            *) echo "unsupported TinyGo CI architecture: ${arch}" >&2; exit 1 ;;
          esac
          curl --retry 3 --retry-delay 2 --retry-max-time 120 --connect-timeout 20 --max-time 120 -fsSLo /tmp/tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_${arch}.deb"
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version

      # Boat's base image has Ubuntu's git 2.43, and the test selection passes `--no-lazy-fetch`,
      # which git 2.44 added. GitHub's runner image takes the current git from this PPA too.
      - name: Install the current git
        run: |
          sudo add-apt-repository --yes ppa:git-core/ppa
          sudo apt-get install --yes --no-install-recommends git

      - name: Install apt deps
        run: |
          sudo apt update
          sudo apt install -y \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          cache-executables: "true"
          pr-comment: "false"

      - name: Start kache remote
        env:
          KACHE_MANIFEST_KEY: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          KACHE_S3_BUCKET: ${{ secrets.KACHE_EU_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ secrets.KACHE_EU_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_EU_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_EU_BUCKET_SECRET_ACCESS_KEY }}
        run: python3 scripts/kache_remote.py start

      # Cheapest first, so a workspace that does not build at all is named in seconds rather than
      # after the heavier compilations have run.
      - name: Start recording runner load
        uses: ./.github/actions/runner-load
        with:
          phase: start

      - name: Runner diagnostics before Capability doctests
        uses: ./.github/actions/runner-diagnostics
        with:
          label: capability-doctests

      - name: Capability doctests
        run: |
          just toolchains-install
          just test-capability-docs

      - name: Runner diagnostics before Expiry map Miri
        uses: ./.github/actions/runner-diagnostics
        with:
          label: expiry-map-miri

      - name: Expiry map Miri
        run: just test-expiry-map-miri

      - name: Runner diagnostics before Expiry map mutation tests
        uses: ./.github/actions/runner-diagnostics
        with:
          label: expiry-map-mutation-tests

      - name: Expiry map mutation tests
        run: just test-expiry-map-mutants

      - name: Setup uv for runner coverage
        uses: astral-sh/setup-uv@v6

      - name: Patch coverage reporter
        run: |
          just coverage-patch-runner
          pwd > target/coverage-source-root.txt

      - name: Ordinary coverage merge
        run: just coverage-merge-runner

      - name: CRAP report
        run: just coverage-crap-report-runner

      - name: Full coverage union
        run: just coverage-full-runner

      - name: Paced simulation Python open policy
        run: just coverage-paced-simulation-python

      - name: Release evidence gate
        run: just coverage-release-evidence

      - name: Kubernetes deployment controller
        run: just coverage-operator-deployment

      - name: Kache remote contract
        run: just coverage-kache-ci

      - name: Plexus connector matrix renderer
        run: just coverage-connector-matrix

      # Every pull request whose diff requires the suites tests the source selection and the console
      # build's tooling here; the Bolero randomized job, which also runs them, needs `bolero-random`.
      - name: CI test selection
        run: just coverage-ci-selection

      - name: Web console wasm-bindgen CLI
        run: just coverage-wasm-bindgen

      # The collector that the steps below run their checks through, including its refusal of
      # every incomplete collection.
      - name: Native coverage collector
        run: just coverage-model-runner

      - name: Runner diagnostics before Source contracts, compiler diagnostics and paired API doctests
        uses: ./.github/actions/runner-diagnostics
        with:
          label: source-contracts-compiler-diagnostics-and-paired-api-doctests

      - name: Source contracts, compiler diagnostics and paired API doctests
        run: just coverage-native-extras test-typed-ratchet

      - name: Runner diagnostics before Compiler cache changes, interruption and runner qualification
        uses: ./.github/actions/runner-diagnostics
        with:
          label: compiler-cache-changes-interruption-and-runner-qualification

      - name: Compiler cache changes, interruption and runner qualification
        run: |
          just qualify-typed-ratchet-cache
          just coverage-typed-ratchet-python

      - name: Primitive source and thread owner validation coverage
        run: just coverage-primitive-boundary

      # The completed doctests no longer need their compiled outputs. Keep their evidence while
      # making room for the separately instrumented benchmark build.
      - name: Reclaim completed documentation builds
        run: just clean-ci-docs

      # Criterion's test mode executes every benchmark body once, catching panics and deadlocks
      # without treating noisy shared-runner timings as a performance regression signal. The run is
      # instrumented for source coverage, so its timings are not a measurement either.
      - name: Runner diagnostics before Benchmark smoke tests
        uses: ./.github/actions/runner-diagnostics
        with:
          label: benchmark-smoke-tests

      - name: Benchmark smoke tests
        run: just coverage-native-extras bench-smoke

      # The collector has exported its report and recorded completion before this runs. Release
      # the benchmark's dev-profile build outputs while retaining every coverage record.
      - name: Reclaim completed benchmark builds
        run: just clean-ci-benchmarks

      # The primitive boundary's native conformance collected separately in every execution mode.
      - name: Runner diagnostics before Primitive boundary conformance
        uses: ./.github/actions/runner-diagnostics
        with:
          label: primitive-boundary-conformance

      - name: Primitive boundary conformance
        run: just coverage-native-extras test-primitives

      - name: Runner diagnostics before Primitive boundary compile and browser checks
        uses: ./.github/actions/runner-diagnostics
        with:
          label: primitive-boundary-compile-and-browser-checks

      - name: Primitive boundary compile and browser checks
        run: just test-primitives-compile

      # The walk saturates every core, and its failures are about completion reachability rather
      # than about any one test.
      - name: Runner diagnostics before Plexus completion walk
        uses: ./.github/actions/runner-diagnostics
        with:
          label: plexus-completion-walk

      - name: Plexus completion walk
        run: just coverage-native-extras plexus-completion-walk

      - name: Runner diagnostics before Plexus connector declaration export
        uses: ./.github/actions/runner-diagnostics
        with:
          label: plexus-connector-declaration-export

      - name: Plexus connector declaration export
        run: just coverage-native-extras validate-connector-matrix

      # Each collection's report, completion record, executions and export diagnostics, whatever
      # its verdict: a failed or interrupted record is the evidence of what the collection saw. The
      # raw profiles stay on the runner.
      - name: Publish runner load
        if: always()
        uses: ./.github/actions/runner-load
        with:
          phase: finish
          artifact-name: runner-load-extra-tests

      - name: Upload native extra coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-native-extras
          path: |
            target/native-coverage/**/completion.json
            target/native-coverage/**/lcov.info
            target/native-coverage/**/executions.jsonl
            target/native-coverage/**/export.log
            target/typed-ratchet/python.lcov
            target/model-coverage/python.lcov
            target/primitive-boundary/python.lcov
            target/patch-coverage/python.lcov
            target/coverage-merge/python.lcov
            target/crap-report/python.lcov
            target/coverage-full/python.lcov
            target/paced-simulation/python.lcov
            target/release-evidence-coverage/python.lcov
            target/operator-deployment-coverage/python.lcov
            target/kache-ci/python.lcov
            target/connector-matrix/python.lcov
            target/ci-selection/python.lcov
            target/wasm-bindgen-coverage/python.lcov
            target/coverage-source-root.txt
            target/typed-ratchet/cache-qualification/**/qualification.json
          if-no-files-found: warn

      - name: Publish kache cache
        if: always()
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -f scripts/kache_remote.py ]]; then
            python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache publication did not run because checkout did not provide its script"
          fi

      - name: Publish kache report
        if: always()
        run: python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/kache-report
          if-no-files-found: warn

  # Shuttle's in-process scheduling checks and uncontrolled-nondeterminism rechecks run
  # in their own coverage collection job beside the other extra tests, and only for a pull
  # request labeled `shuttle`.
  shuttle:
    name: shuttle
    if: contains(github.event.pull_request.labels.*.name, 'shuttle')
    runs-on: boat-xlarge
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@latest,trunk,wild-linker,cargo-llvm-cov

      - name: Install Latest LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      - name: Configure cargo
        run: |
          # A machine whose rustup is installed system-wide, as on Boat, has no Cargo home yet.
          mkdir -p ~/.cargo
          tee <<EOF > ~/.cargo/config.toml
          [target.x86_64-unknown-linux-gnu]
          ar = "llvm-ar-23"
          linker = "${GITHUB_WORKSPACE}/scripts/ci_linker.sh"
          EOF

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install TinyGo
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64|arm64) ;;
            *) echo "unsupported TinyGo CI architecture: ${arch}" >&2; exit 1 ;;
          esac
          curl -fsSLo /tmp/tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_${arch}.deb"
          sudo dpkg -i /tmp/tinygo.deb
          tinygo version

      - name: Install apt deps
        run: |
          sudo apt update
          sudo apt install -y \
            libcurl4-openssl-dev \
            protobuf-compiler

      - name: Setup flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.12.19"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: ${{ env.KACHE_VERSION }}
          github-cache: "false"
          cache-executables: "true"
          pr-comment: "false"

      - name: Start kache remote
        env:
          KACHE_MANIFEST_KEY: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          KACHE_S3_BUCKET: ${{ secrets.KACHE_EU_BUCKET }}
          KACHE_S3_REGION: ${{ vars.KACHE_BUCKET_REGION }}
          KACHE_S3_ENDPOINT: ${{ secrets.KACHE_EU_BUCKET_ENDPOINT }}
          KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_EU_BUCKET_ACCESS_KEY_ID }}
          KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_EU_BUCKET_SECRET_ACCESS_KEY }}
        run: python3 scripts/kache_remote.py start

      # Every registered Shuttle check under its exploration and under the nondeterminism detector,
      # each in its own process, then the proof that a failing schedule persists and replays.
      - name: Start recording runner load
        uses: ./.github/actions/runner-load
        with:
          phase: start

      - name: Runner diagnostics before Shuttle concurrency checks
        uses: ./.github/actions/runner-diagnostics
        with:
          label: shuttle-concurrency-checks

      - name: Build the Shuttle checks
        run: |
          just toolchains-install
          just coverage-native-extras-build test-shuttle

      # The cache the build filled is published before the run starts: the run's outcome cannot lose
      # it, the jobs building beside this one can use it, and its report shows what the build
      # compiled and what the cache served.
      - name: Publish kache cache after the build
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-build-report"

      - name: Publish kache report after the build
        run: python3 scripts/publish_kache_report.py --phase build "${RUNNER_TEMP}/kache-build-report"

      - name: Shuttle concurrency checks
        run: just coverage-native-extras test-shuttle

      - name: Runner diagnostics before Shuttle schedule replay
        uses: ./.github/actions/runner-diagnostics
        with:
          label: shuttle-schedule-replay

      - name: Shuttle schedule replay
        run: just test-shuttle-replay-check

      - name: Publish runner load
        if: always()
        uses: ./.github/actions/runner-load
        with:
          phase: finish
          artifact-name: runner-load-shuttle

      - name: Upload Shuttle coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shuttle
          path: |
            target/native-coverage/**/completion.json
            target/native-coverage/**/lcov.info
            target/native-coverage/**/executions.jsonl
            target/native-coverage/**/export.log
            target/native-coverage/**/models.json
          if-no-files-found: warn

      - name: Publish kache cache
        if: always()
        timeout-minutes: 4
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -f scripts/kache_remote.py ]]; then
            python3 scripts/kache_remote.py publish --job-status "${JOB_STATUS}" "${RUNNER_TEMP}/kache-report"
          else
            echo "::notice::Kache publication did not run because checkout did not provide its script"
          fi

      - name: Publish kache report
        if: always()
        run: python3 scripts/publish_kache_report.py "${RUNNER_TEMP}/kache-report"

      - name: Upload kache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/kache-report
            ${{ runner.temp }}/kache-build-report
          if-no-files-found: warn

      # A modeled concurrency failure is only reproducible from the schedule that produced it,
      # and this job is the only witness of that schedule.
      - name: Archive Shuttle failure traces
        if: failure()
        run: |
          if [ -d target/native-coverage-build-shuttle/shuttle-failures ]; then
            tar -czf target/shuttle-failures.tar.gz \
              -C target/native-coverage-build-shuttle shuttle-failures
          fi

      - name: Upload Shuttle failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shuttle-failures
          path: target/shuttle-failures.tar.gz
          if-no-files-found: ignore

  # Loom's memory-ordering models run in their own coverage collection job beside the other extra
  # tests, and only for a pull request labeled `loom`.
  loom:
    name: loom
    if: contains(github.event.pull_request.labels.*.name, 'loom')
    runs-on: boat-xlarge
    # The models took 10 to 11 minutes on a warm cache. The limit leaves room for a cold
    # instrumented build and for the models the inventory adds.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
      CARGO_TERM_COLOR: never
      RUST_LOG_STYLE: never
      # Sixteen compilers of the instrumented Loom build exceeded the 32 GB of Boat's 16-CPU
      # machine, so the build keeps the eight it had on an 8-CPU, 32 GB runner.
      CARGO_BUILD_JOBS: "8"
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
